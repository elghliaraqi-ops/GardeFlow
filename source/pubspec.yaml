name: huim6_planning
description: "Planning des gardes, annuaire et échanges — Réseau Hôpitaux Universitaires Internationaux Mohammed VI & Cheikh Khalifa"
publish_to: "none"
version: 12.0.2+302

# CI rebuild 12.0.2+302 — roster parser r4

# Splash branding refresh: force Web/Android rebuild with verified original assets.
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  intl: ^0.20.3
  image_picker: ^1.1.2
  file_picker: 10.3.8
  url_launcher: ^6.3.0
  pdfrx: 2.4.8
  photo_view: 0.15.0
  flutter_local_notifications: 19.5.0
  timezone: ^0.10.1
  alarm: ^5.13.1
  shared_preferences: ^2.5.3
  speech_to_text: ^7.4.0
  crypto: ^3.0.6
  supabase_flutter: ^2.0.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.2
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE_OFL.txt
    - assets/branding/gardeflow_logo.png
    - assets/branding/splash_gardeflow_exact.webp
    - assets/branding/practice_banner.webp
    - assets/branding/flowsuite_banner.webp
    - assets/branding/splash_practice.webp
    - assets/branding/splash_flowsuite.webp
    - assets/branding/splash_gardeflow_mark.webp
    - assets/branding/splash_practice_mark.webp
    - assets/branding/splash_flowsuite_mark.webp
    - assets/branding/splash_gardeflow_mark.png
    - assets/branding/splash_practice_mark.png
    - assets/branding/splash_flowsuite_mark.png
    - assets/branding/splash_gardeflow_mark_clean.webp
    - assets/branding/splash_practice_mark_clean.webp
    - assets/branding/splash_flowsuite_mark_clean.webp
    - assets/branding/practice_icon.webp
    - assets/branding/elghali_signature.webp
    - assets/branding/login_urgences.jpg
    - assets/branding/partners/hui_rabat.png
    - assets/branding/partners/hui_cheikh_khalifa.png
    - assets/branding/partners/hui_bouskoura.png
    - assets/branding/partners/amium6.png
    - assets/avatars/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
