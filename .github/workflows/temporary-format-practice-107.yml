name: Temporary Dart Format for PR 107
on:
  push:
    branches:
      - feature/practice-persist-progressive-cases-and-diagnostics-20261009
    paths:
      - .github/workflows/temporary-format-practice-107.yml
permissions:
  contents: write
jobs:
  format-practice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: Format Flutter Practice screen
        run: |
          set -euo pipefail
          dart format source/lib/screens/practice_progressive_cases_screen.dart
          git diff --check
          if git diff --quiet -- source/lib/screens/practice_progressive_cases_screen.dart; then
            echo "Already formatted"
            exit 0
          fi
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add source/lib/screens/practice_progressive_cases_screen.dart
          git commit -m 'style(practice): apply canonical Dart formatting'
          git push origin HEAD:feature/practice-persist-progressive-cases-and-diagnostics-20261009
