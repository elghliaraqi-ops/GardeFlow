name: GardeFlow UX UI bootstrap
on:
  push:
    branches: [ux-ui-refonte-v11.7.0]

permissions:
  contents: write

concurrency:
  group: ux-ui-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact refactor payload
        shell: bash
        run: |
          set -euo pipefail
          cat .gardeflow-payload/part* | base64 -d > /tmp/gardeflow-v117-ui.tar.xz
          tar -xJf /tmp/gardeflow-v117-ui.tar.xz
          rm -rf .gardeflow-payload
          rm -f .github/workflows/ux-ui-bootstrap.yml
          python3 source/tool/check_ui_business_boundary.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "Implement GardeFlow UX/UI refactor V11.7.0"
          git push origin HEAD:ux-ui-refonte-v11.7.0
