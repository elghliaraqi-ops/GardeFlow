name: One-time interpromo, badges and news buttons fix

on:
  push:
    branches:
      - audit-fixes-v11.6.70
    paths:
      - .github/workflows/one-time-interpromo-badges-news-buttons.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-v11.6.70
          fetch-depth: 0

      - name: Apply requested corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{label}: anchor not found in {path}')
              s = s.replace(old, new, 1)
              p.write_text(s)

          # 1) Interpromo restriction ONLY for Urgences transfer/exchange.
          path = 'source/lib/screens/exchange_request_sheet.dart'
          replace_once(path,
              "    final sourceIsService = widget.entry.shiftId.startsWith('service-');\n    final exchangeMode = _mode == _Mode.exchange;",
              "    final sourceIsService = widget.entry.shiftId.startsWith('service-');\n    final sourceIsUrgence = widget.entry.shiftId.startsWith('urg-');\n    final exchangeMode = _mode == _Mode.exchange;",
              'source urgency flag')
          replace_once(path,
              "      return !InternPromotions.crossYearBlocked(me, targetUser);",
              "      if (sourceIsUrgence && InternPromotions.crossYearBlocked(me, targetUser)) {\n        return false;\n      }\n      return true;",
              'target promo filter')
          replace_once(path,
              "    final allTargetEntries = selectedDoctor == null\n        ? <PlanningEntry>[]\n        : state.exchangeableEntriesFor(selectedDoctor.id, excludingDate: widget.dateStr);\n    final targetEntries = selectedDoctor == null\n        ? <PlanningEntry>[]\n        : allTargetEntries.where((e) {\n            if (!exchangeMode) return true;\n            final targetIsService = e.shiftId.startsWith('service-');\n            if (targetIsService && selectedDoctor.service != state.currentUser?.service) return false;\n            return true;\n          }).toList();",
              "    final selectedDoctorUser = selectedDoctor == null\n        ? null\n        : state.users\n            .where((u) => u.id == selectedDoctor.id || u.phone == selectedDoctor.phone)\n            .firstOrNull;\n    final crossYearWithSelected =\n        InternPromotions.crossYearBlocked(me, selectedDoctorUser);\n    final allTargetEntries = selectedDoctor == null\n        ? <PlanningEntry>[]\n        : state.exchangeableEntriesFor(selectedDoctor.id, excludingDate: widget.dateStr);\n    final targetEntries = selectedDoctor == null\n        ? <PlanningEntry>[]\n        : allTargetEntries.where((e) {\n            if (!exchangeMode) return true;\n            final targetIsService = e.shiftId.startsWith('service-');\n            final targetIsUrgence = e.shiftId.startsWith('urg-');\n            if (targetIsService && selectedDoctor.service != state.currentUser?.service) return false;\n            if (crossYearWithSelected && (sourceIsUrgence || targetIsUrgence)) return false;\n            return true;\n          }).toList();",
              'target entries promo filter')
          replace_once(path,
              "              text: _mode == _Mode.transfer\n                  ? 'Transfert : vous donnez cette garde à un collègue du même hôpital. Il doit accepter, puis l’admin valide. Première année (Promo 7) et deuxième année (Promo 6) ne peuvent pas se transférer de garde entre elles.'\n                  : sourceIsService\n                      ? 'Échange Service : uniquement avec un médecin de votre service. Si les deux gardes sont des gardes de Service, l’échange est appliqué dès l’acceptation du collègue, sans validation admin. Première année (Promo 7) et deuxième année (Promo 6) restent séparées.'\n                      : 'Échange Urgences : possible avec un médecin du même hôpital et de la même promotion d’internat. Première année (Promo 7) et deuxième année (Promo 6) ne peuvent pas échanger entre elles. Validation admin obligatoire.',",
              "              text: _mode == _Mode.transfer\n                  ? sourceIsUrgence\n                      ? 'Transfert Urgences : même hôpital et même promotion d’internat. Première année (Promo 7) et deuxième année (Promo 6) ne peuvent pas se transférer une garde d’Urgences. Le destinataire accepte, puis l’admin valide.'\n                      : 'Transfert Service : même hôpital. Les transferts de garde de Service restent possibles entre Promo 6 et Promo 7. Le destinataire accepte, puis l’admin valide.'\n                  : sourceIsService\n                      ? 'Échange Service : uniquement avec un médecin de votre service. Les échanges de Service restent possibles entre Promo 6 et Promo 7. Si les deux gardes sont de Service, l’échange est appliqué dès l’acceptation du collègue, sans validation admin.'\n                      : 'Échange Urgences : même hôpital et même promotion d’internat. Première année (Promo 7) et deuxième année (Promo 6) ne peuvent pas échanger une garde d’Urgences entre elles. Validation admin obligatoire.',",
              'rules notice')
          replace_once(path,
              "                rawTargets.isNotEmpty\n                    ? 'Aucun médecin compatible avec votre promotion pour cette demande.'\n                    : 'Aucun autre médecin inscrit dans votre établissement.',",
              "                rawTargets.isNotEmpty && sourceIsUrgence\n                    ? 'Aucun médecin compatible avec votre promotion pour cette garde d’Urgences.'\n                    : 'Aucun autre médecin disponible dans votre établissement.',",
              'empty target message')
          replace_once(path,
              "                          final available = state.exchangeableEntriesFor(doctor.id, excludingDate: widget.dateStr).where((e) {\n                            final targetIsService = e.shiftId.startsWith('service-');\n                            if (targetIsService && doctor.service != state.currentUser?.service) return false;\n                            return true;\n                          }).toList();",
              "                          final doctorUser = state.users\n                              .where((u) => u.id == doctor.id || u.phone == doctor.phone)\n                              .firstOrNull;\n                          final crossYear = InternPromotions.crossYearBlocked(me, doctorUser);\n                          final available = state.exchangeableEntriesFor(doctor.id, excludingDate: widget.dateStr).where((e) {\n                            final targetIsService = e.shiftId.startsWith('service-');\n                            final targetIsUrgence = e.shiftId.startsWith('urg-');\n                            if (targetIsService && doctor.service != state.currentUser?.service) return false;\n                            if (crossYear && (sourceIsUrgence || targetIsUrgence)) return false;\n                            return true;\n                          }).toList();",
              'submit target filter')

          path = 'source/lib/state/app_state.dart'
          replace_once(path,
              "import '../data/seed_data.dart';\nimport '../data/hospitals.dart';",
              "import '../data/seed_data.dart';\nimport '../data/hospitals.dart';\nimport '../data/intern_promotions.dart';",
              'promotion import')
          replace_once(path,
              "    if(BusinessRules.sameHospitalRequired&&target.hospital!=me.hospital)return 'Les transferts sont limités au même établissement.';\n    if(!isUserPlanningMonthApproved(target.id,date))return 'Le calendrier du destinataire doit aussi être validé pour ce mois.';",
              "    if(BusinessRules.sameHospitalRequired&&target.hospital!=me.hospital)return 'Les transferts sont limités au même établissement.';\n    final targetUser=_users.where((u)=>u.id==target.id||u.phone==target.phone).firstOrNull;\n    if(entry.shiftId.startsWith('urg-')&&InternPromotions.crossYearBlocked(me,targetUser))return 'Les transferts de gardes d’Urgences sont interdits entre première année (Promo 7) et deuxième année (Promo 6).';\n    if(!isUserPlanningMonthApproved(target.id,date))return 'Le calendrier du destinataire doit aussi être validé pour ce mois.';",
              'transfer validation')
          replace_once(path,
              "    if((sourceIsService||targetIsService)&&target.service!=me.service){\n      return 'Toute garde de Service ne peut être échangée qu’entre médecins du même service.';\n    }\n    if(targetEntry.ownerId!=target.id&&targetEntry.ownerPhone!=target.phone)return 'La garde choisie n’appartient plus au médecin destinataire.';",
              "    if((sourceIsService||targetIsService)&&target.service!=me.service){\n      return 'Toute garde de Service ne peut être échangée qu’entre médecins du même service.';\n    }\n    final sourceIsUrgence=entry.shiftId.startsWith('urg-');\n    final targetIsUrgence=targetEntry.shiftId.startsWith('urg-');\n    final targetUser=_users.where((u)=>u.id==target.id||u.phone==target.phone).firstOrNull;\n    if((sourceIsUrgence||targetIsUrgence)&&InternPromotions.crossYearBlocked(me,targetUser)){\n      return 'Les échanges impliquant une garde d’Urgences sont interdits entre première année (Promo 7) et deuxième année (Promo 6).';\n    }\n    if(targetEntry.ownerId!=target.id&&targetEntry.ownerPhone!=target.phone)return 'La garde choisie n’appartient plus au médecin destinataire.';",
              'swap validation')
          replace_once(path,
              "    if(BusinessRules.sameHospitalRequired&&fromUser.hospital!=toUser.hospital)return 'Les échanges sont limités aux médecins du même établissement.';\n    final involvesService=source.shiftId.startsWith('service-')||target.shiftId.startsWith('service-');",
              "    if(BusinessRules.sameHospitalRequired&&fromUser.hospital!=toUser.hospital)return 'Les échanges sont limités aux médecins du même établissement.';\n    final involvesUrgence=source.shiftId.startsWith('urg-')||target.shiftId.startsWith('urg-');\n    if(involvesUrgence&&InternPromotions.crossYearBlocked(fromUser,toUser))return 'Les échanges impliquant une garde d’Urgences sont interdits entre première année (Promo 7) et deuxième année (Promo 6).';\n    final involvesService=source.shiftId.startsWith('service-')||target.shiftId.startsWith('service-');",
              'request state validation')

          path = 'source/lib/screens/announcements_screen.dart'
          replace_once(path,
              "                  'L’annonce est visible dans le fil. Les médecins de votre hôpital et de votre promotion reçoivent une notification.',",
              "                  'L’annonce est visible dans le fil. Pour une garde d’Urgences, la notification reste limitée à votre promotion ; pour une garde de Service, Promo 6 et Promo 7 peuvent répondre.',",
              'announcement composer text')
          replace_once(path,
              "    if (InternPromotions.crossYearBlocked(me, author)) {\n      ScaffoldMessenger.of(context).showSnackBar(\n        const SnackBar(\n          content: Text('Échanges impossibles entre première et deuxième année.'),\n        ),\n      );\n      return;\n    }\n    if (me.hospital != author.hospital) {",
              "    final crossYear = InternPromotions.crossYearBlocked(me, author);\n    final announcementIsUrgence = targetEntry.shiftId.startsWith('urg-');\n    if (crossYear && announcementIsUrgence) {\n      ScaffoldMessenger.of(context).showSnackBar(\n        const SnackBar(\n          content: Text('Les échanges de gardes d’Urgences sont impossibles entre première et deuxième année.'),\n        ),\n      );\n      return;\n    }\n    if (me.hospital != author.hospital) {",
              'announcement initial promo check')
          replace_once(path,
              "    final mine = _myPublishableEntries(state)\n        .where((e) => e.id != targetEntry.id)\n        .toList();",
              "    final mine = _myPublishableEntries(state)\n        .where((e) => e.id != targetEntry.id)\n        .where((e) => !crossYear || e.shiftId.startsWith('service-'))\n        .toList();",
              'announcement candidate guards')
          replace_once(path,
              "                              myPromotion == null\n                                  ? 'Publiez une garde et trouvez un collègue pour l’échanger.'\n                                  : '$myPromotion · échanges uniquement dans la même promotion.',",
              "                              myPromotion == null\n                                  ? 'Publiez une garde et trouvez un collègue pour l’échanger.'\n                                  : '$myPromotion · Urgences : même promo · Service : interpromo autorisé.',",
              'announcement header')
          replace_once(path,
              "    if (author != null && InternPromotions.crossYearBlocked(me, author)) return true;\n    return me.hospital != item.hospital;",
              "    if (author != null &&\n        item.shiftId.startsWith('urg-') &&\n        InternPromotions.crossYearBlocked(me, author)) return true;\n    return me.hospital != item.hospital;",
              'announcement viewer filter')

          # 2) High-contrast badges/labels in all app themes.
          path = 'source/lib/screens/home_screen.dart'
          replace_once(path,
              "              color: AppColors.brandSoft,\n              borderRadius: BorderRadius.circular(999),\n              border: Border.all(\n                color: AppColors.brand.withOpacity(0.12),\n              ),",
              "              color: AppColors.card,\n              borderRadius: BorderRadius.circular(999),\n              border: Border.all(\n                color: AppColors.brandBright,\n                width: 1.2,\n              ),",
              'news lower badge background')
          replace_once(path,
              "                    color: AppColors.brandDark,\n                    fontSize: 11.5,",
              "                    color: AppColors.ink,\n                    fontSize: 11.5,",
              'news lower badge text')
          replace_once(path,
              "                  color: AppColors.brand,\n                  size: 20,",
              "                  color: AppColors.brandBright,\n                  size: 20,",
              'news lower badge icon')
          replace_once(path,
              "                    color: AppColors.brandSoft,\n                    borderRadius: BorderRadius.circular(999),\n                    border: Border.all(color: AppColors.brand.withOpacity(0.18)),",
              "                    color: AppColors.card,\n                    borderRadius: BorderRadius.circular(999),\n                    border: Border.all(color: AppColors.brandBright, width: 1.2),",
              'promotion badge background')
          replace_once(path,
              "                      Icon(Icons.school_rounded, size: 17, color: AppColors.brandDark),",
              "                      Icon(Icons.school_rounded, size: 17, color: AppColors.brandBright),",
              'promotion badge icon')
          replace_once(path,
              "                        style: TextStyle(color: AppColors.brandDark, fontSize: 11.5, fontWeight: FontWeight.w900),",
              "                        style: TextStyle(color: AppColors.ink, fontSize: 11.5, fontWeight: FontWeight.w900),",
              'promotion badge text')
          replace_once(path,
              "        statusBg = AppColors.conge.withOpacity(0.22);\n        statusFg = AppColors.congeText;",
              "        statusBg = AppColors.success;\n        statusFg = Colors.white;",
              'approved badge contrast')

          # Also fix the promotion badge inside the transfer/exchange sheet.
          path = 'source/lib/screens/exchange_request_sheet.dart'
          replace_once(path,
              "                      color: AppColors.brandSoft,\n                      borderRadius: AppRadius.pillR,\n                      border: Border.all(color: AppColors.brand.withOpacity(0.18)),",
              "                      color: AppColors.card,\n                      borderRadius: AppRadius.pillR,\n                      border: Border.all(color: AppColors.brandBright, width: 1.2),",
              'sheet promo badge bg')
          replace_once(path,
              "                        color: AppColors.brandDark,\n                        fontSize: 10.5,",
              "                        color: AppColors.ink,\n                        fontSize: 10.5,",
              'sheet promo badge fg')

          # 3) Vertical news categories become real filter buttons.
          path = 'source/lib/screens/daily_news_section.dart'
          replace_once(path,
              "  late Future<List<_DailyNewsItem>> _future;\n  bool _refreshing = false;",
              "  late Future<List<_DailyNewsItem>> _future;\n  bool _refreshing = false;\n  String? _selectedCategory;",
              'news selected category state')
          old = """              SizedBox(height: 16),
              for (final category in _categoryOrder)
                if (items.any((item) => _categoryFor(item) == category)) ...[
                  Container(
                    width: double.infinity,
                    margin: EdgeInsets.only(top: 4, bottom: 10),
                    padding: EdgeInsets.symmetric(horizontal: 12, vertical: 9),
                    decoration: BoxDecoration(
                      color: AppColors.brandSoft,
                      borderRadius: BorderRadius.circular(12),
                      border: Border.all(color: AppColors.line),
                    ),
                    child: Text(
                      category,
                      style: TextStyle(
                        fontFamily: 'SpaceGrotesk',
                        color: AppColors.ink,
                        fontSize: 14,
                        fontWeight: FontWeight.w900,
                      ),
                    ),
                  ),
                  for (final item in items.where(
                    (item) => _categoryFor(item) == category,
                  )) ...[
                    _NewsDetailCard(
                      item: item,
                      onTap: () => _open(item.permalink),
                    ),
                    SizedBox(height: 12),
                  ],
                  SizedBox(height: 8),
                ],
"""
          new = """              SizedBox(height: 14),
              Builder(
                builder: (context) {
                  final availableCategories = _categoryOrder
                      .where((category) =>
                          items.any((item) => _categoryFor(item) == category))
                      .toList(growable: false);
                  if (availableCategories.isEmpty) {
                    return const SizedBox.shrink();
                  }
                  final activeCategory = _selectedCategory != null &&
                          availableCategories.contains(_selectedCategory)
                      ? _selectedCategory!
                      : availableCategories.first;
                  final visibleItems = items
                      .where((item) => _categoryFor(item) == activeCategory)
                      .toList(growable: false);

                  return Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      SingleChildScrollView(
                        scrollDirection: Axis.horizontal,
                        physics: const BouncingScrollPhysics(),
                        child: Row(
                          children: [
                            for (final category in availableCategories) ...[
                              OutlinedButton(
                                onPressed: () =>
                                    setState(() => _selectedCategory = category),
                                style: OutlinedButton.styleFrom(
                                  backgroundColor: activeCategory == category
                                      ? AppColors.brand
                                      : AppColors.card,
                                  foregroundColor: activeCategory == category
                                      ? Colors.white
                                      : AppColors.ink,
                                  side: BorderSide(
                                    color: activeCategory == category
                                        ? AppColors.brandBright
                                        : AppColors.line,
                                    width: 1.2,
                                  ),
                                  padding: const EdgeInsets.symmetric(
                                    horizontal: 14,
                                    vertical: 11,
                                  ),
                                  shape: RoundedRectangleBorder(
                                    borderRadius: BorderRadius.circular(999),
                                  ),
                                  textStyle: const TextStyle(
                                    fontSize: 11.5,
                                    fontWeight: FontWeight.w900,
                                  ),
                                ),
                                child: Text(category),
                              ),
                              const SizedBox(width: 8),
                            ],
                          ],
                        ),
                      ),
                      const SizedBox(height: 14),
                      for (final item in visibleItems) ...[
                        _NewsDetailCard(
                          item: item,
                          onTap: () => _open(item.permalink),
                        ),
                        const SizedBox(height: 12),
                      ],
                    ],
                  );
                },
              ),
"""
          replace_once(path, old, new, 'vertical news category buttons')

          # 4) Public-announcement push: Service goes to same hospital across promos;
          # Urgences remains restricted to same promotion.
          path = 'source/supabase/functions/send-push/index.ts'
          replace_once(path,
              "      const promo = Number(announcement.promotion_number);\n      if (promo === 6 || promo === 7) {\n        cohortQuery = cohortQuery.eq('promotion_number', promo);\n      }",
              "      const promo = Number(announcement.promotion_number);\n      const isServiceAnnouncement = typeof announcement.shift_id === 'string'\n        && announcement.shift_id.startsWith('service-');\n      if (!isServiceAnnouncement && (promo === 6 || promo === 7)) {\n        cohortQuery = cohortQuery.eq('promotion_number', promo);\n      }",
              'announcement push cohort')

          # Keep the root duplicate in sync when present.
          root_push = Path('supabase/functions/send-push/index.ts')
          if root_push.exists():
              s = root_push.read_text()
              old_push = "      const promo = Number(announcement.promotion_number);\n      if (promo === 6 || promo === 7) {\n        cohortQuery = cohortQuery.eq('promotion_number', promo);\n      }"
              new_push = "      const promo = Number(announcement.promotion_number);\n      const isServiceAnnouncement = typeof announcement.shift_id === 'string'\n        && announcement.shift_id.startsWith('service-');\n      if (!isServiceAnnouncement && (promo === 6 || promo === 7)) {\n        cohortQuery = cohortQuery.eq('promotion_number', promo);\n      }"
              if old_push in s:
                  root_push.write_text(s.replace(old_push, new_push, 1))

          sql = """-- GardeFlow 11.6.70 hotfix
-- La séparation Promo 6 / Promo 7 concerne uniquement les gardes d'Urgences.
-- Les transferts et échanges de Service restent autorisés entre promotions.

create or replace function public.enforce_exchange_promotion_scope()
returns trigger
language plpgsql
security definer
set search_path=public,pg_temp
as $$
declare
  p_from smallint;
  p_to smallint;
  involves_urgences boolean;
begin
  select promotion_number into p_from from public.profiles where id=new.from_id;
  select promotion_number into p_to from public.profiles where id=new.to_id;

  involves_urgences := coalesce(new.shift_id, '') like 'urg-%'
    or (new.type = 'exchange' and coalesce(new.target_shift_id, '') like 'urg-%');

  if involves_urgences
     and p_from in (6,7)
     and p_to in (6,7)
     and p_from <> p_to then
    raise exception 'Les transferts et échanges de gardes d’Urgences sont interdits entre première année (Promo 7) et deuxième année (Promo 6)';
  end if;

  return new;
end;
$$;
"""
          Path('source/supabase/patch_v11_6_70b_urgences_only_promotion_scope.sql').write_text(sql)

          # Self-delete this one-time workflow from the final source tree.
          Path('.github/workflows/one-time-interpromo-badges-news-buttons.yml').unlink()
          PY

          git diff --check
          grep -Fq "Les échanges de Service restent possibles entre Promo 6 et Promo 7" source/lib/screens/exchange_request_sheet.dart
          grep -Fq "statusBg = AppColors.success" source/lib/screens/home_screen.dart
          grep -Fq "OutlinedButton(" source/lib/screens/daily_news_section.dart
          grep -Fq "isServiceAnnouncement" source/supabase/functions/send-push/index.ts
          test -f source/supabase/patch_v11_6_70b_urgences_only_promotion_scope.sql

      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GardeFlow CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: scope interpromo rule to urgences and improve badges/news filters'
          git push origin HEAD:audit-fixes-v11.6.70
