name: One-time interpromo badges news buttons fix

on:
  push:
    branches:
      - audit-fixes-v11.6.70
    paths:
      - .github/workflows/one-time-interpromo-badges-news-buttons.yml
      - ci/one_time_patch_interpromo.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-v11.6.70
          fetch-depth: 0
      - name: Apply correction script
        run: python3 ci/one_time_patch_interpromo.py
      - name: Validate patch
        run: |
          git diff --check
          grep -Fq "Les échanges de Service restent possibles entre Promo 6 et Promo 7" source/lib/screens/exchange_request_sheet.dart
          grep -Fq "statusBg = AppColors.success" source/lib/screens/home_screen.dart
          grep -Fq "OutlinedButton(" source/lib/screens/daily_news_section.dart
          grep -Fq "isServiceAnnouncement" source/supabase/functions/send-push/index.ts
          test -f source/supabase/patch_v11_6_70b_urgences_only_promotion_scope.sql
      - name: Commit corrections
        run: |
          git config user.name 'GardeFlow CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: scope interpromo rule to urgences and improve badges/news filters'
          git push origin HEAD:audit-fixes-v11.6.70
