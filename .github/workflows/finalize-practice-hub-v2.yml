name: Finalize Practice Hub V2

on:
  push:
    branches:
      - ux/practice-hub-v12
    paths:
      - .github/workflows/finalize-practice-hub-v2.yml

permissions:
  contents: write

jobs:
  finalize-practice:
    if: "${{ github.event.head_commit.message == 'chore finalize practice hub v2' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/practice-hub-v12
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix Practice card layout and format
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('source/lib/screens/practice_screen.dart')
          text = path.read_text(encoding='utf-8')
          start = text.index('class _PracticeHubAction extends StatelessWidget {')
          end = text.index('class _PracticeGameHeader extends StatelessWidget {', start)
          segment = text[start:end]
          segment = segment.replace(
              'constraints: const BoxConstraints(minHeight: 102),',
              'height: 102,',
              1,
          )
          segment = segment.replace(
              'const Spacer(),',
              'const SizedBox(height: 12),',
              1,
          )
          if 'constraints: const BoxConstraints(minHeight: 102),' in segment:
              raise SystemExit('Invalid Ink constraints still present')
          text = text[:start] + segment + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          dart format source/lib/screens/practice_screen.dart
          git diff --check

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Analyze Practice screen
        working-directory: source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/screens/practice_screen.dart

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Commit finalized Practice hub
        shell: bash
        run: |
          git config user.name "elghliaraqi-ops"
          git config user.email "elghliaraqi@gmail.com"
          git add source/lib/screens/practice_screen.dart
          git rm .github/workflows/finalize-practice-hub.yml
          git rm .github/workflows/finalize-practice-hub-v2.yml
          git commit -m "fix: finalize Practice hub layout"
          git push origin HEAD:ux/practice-hub-v12
