name: Build GardeFlow V12 iOS Unsigned

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v12-optimisee
    paths:
      - '.github/workflows/build-ios.yml'
      - 'source/**'

permissions:
  contents: read

concurrency:
  group: gardeflow-v12-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      PROJECT_DIR: source
      APP_VERSION: 12.0.0
      BUILD_NUMBER: "300"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify canonical V12 source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 12.0.0+300$' pubspec.yaml
          test -f lib/main.dart
          test -f tool/configure_ios.dart

      - name: Generate and configure iOS platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios
          flutter create --no-pub --platforms=ios --org com.huim6 --project-name huim6_planning .
          dart tool/configure_ios.dart
          grep -q 'com.huim6.gardeflow' ios/Runner.xcodeproj/project.pbxproj
          flutter clean
          flutter pub get
          if [ -f ios/Podfile ]; then
            (cd ios && pod install --repo-update)
          fi

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build unsigned iOS release
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --build-name "$APP_VERSION" \
            --build-number "$BUILD_NUMBER"
          test -d build/ios/iphoneos/Runner.app

      - name: Package unsigned artifacts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ios/unsigned-output
          mkdir -p build/ios/unsigned-output/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned-output/Payload/GardeFlow.app
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app build/ios/unsigned-output/GardeFlow-v12.0.0-unsigned.app.zip
          (cd build/ios/unsigned-output && zip -qry GardeFlow-v12.0.0-unsigned.ipa Payload)

      - name: Upload unsigned iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-v12.0.0-ios-unsigned
          path: |
            source/build/ios/unsigned-output/GardeFlow-v12.0.0-unsigned.app.zip
            source/build/ios/unsigned-output/GardeFlow-v12.0.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
