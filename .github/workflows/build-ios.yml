name: Build iOS Unsigned

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ios.yml'
      - 'ci/v11_6_1/**'
      - 'ci/v11_6_3/**'
      - 'ci/v11_6_5/**'
      - 'ci/v11_6_6/**'
      - 'GardeFlow_android_v11_6_0_official_pdf_auto_import.zip'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate GardeFlow project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="GardeFlow_android_v11_6_0_official_pdf_auto_import.zip"
          test -f "$ZIP"
          rm -rf .ci-ios-project
          mkdir -p .ci-ios-project
          ditto -x -k "$ZIP" .ci-ios-project
          PUBSPEC="$(find .ci-ios-project -type f -name pubspec.yaml -print -quit)"
          test -n "$PUBSPEC"
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          test -f "$PROJECT_DIR/lib/main.dart"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Apply V11.6.1 overlay
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/ci/v11_6_1/overlay.part* > /tmp/gardeflow_v11_6_1.patch
          patch -p1 < /tmp/gardeflow_v11_6_1.patch
          grep -q '^version: 11.6.1+161$' pubspec.yaml

      - name: Apply V11.6.3 UI overlay
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/ci/v11_6_3/overlay.part* > /tmp/gardeflow_v11_6_3.patch
          patch -p1 < /tmp/gardeflow_v11_6_3.patch
          grep -q '^version: 11.6.3+163$' pubspec.yaml

      - name: Set V11.6.4 and configure iOS project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          p.write_text(p.read_text().replace('version: 11.6.3+163', 'version: 11.6.4+164'))
          p = Path('tool/configure_ios.dart')
          p.write_text(p.read_text().replace("const deploymentTarget = '13.0';", "const deploymentTarget = '15.0';"))
          PY
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            rm -rf ios
            flutter create --no-pub --platforms=ios --org com.huim6 --project-name huim6_planning .
          fi
          dart tool/configure_ios.dart
          grep -q '^version: 11.6.4+164$' pubspec.yaml

      - name: Fix iOS launcher icon scale
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet --user pillow
          python3 "$GITHUB_WORKSPACE/ci/v11_6_6/fix_launcher_icons.py" --ios

      - name: Apply V11.6.5 official roster backfill
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/ci/v11_6_5/overlay.part* > /tmp/gardeflow_v11_6_5.patch
          patch -p1 < /tmp/gardeflow_v11_6_5.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          p.write_text(p.read_text().replace('version: 11.6.4+164', 'version: 11.6.5+165'))
          PY
          grep -q '^version: 11.6.5+165$' pubspec.yaml

      - name: Apply V11.6.6 HUICK and astreinte hospitals
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/ci/v11_6_6/overlay.part* > /tmp/gardeflow_v11_6_6.patch
          patch -p1 < /tmp/gardeflow_v11_6_6.patch
          grep -q '^version: 11.6.6+166$' pubspec.yaml

      - name: Install Flutter dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get
          if [ -f ios/Podfile ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('ios/Podfile')
          s = p.read_text()
          if re.search(r'^#?\s*platform :ios,', s, flags=re.M):
              s = re.sub(r'^#?\s*platform :ios,\s*[\'\"][^\'\"]+[\'\"]', "platform :ios, '15.0'", s, count=1, flags=re.M)
          else:
              s = "platform :ios, '15.0'\n" + s
          p.write_text(s)
          PY
            (cd ios && pod install --repo-update)
          fi

      - name: Show Xcode and Flutter versions
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          xcodebuild -version
          flutter --version
          flutter doctor -v

      - name: Build iOS release without code signing
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          test -d build/ios/iphoneos/Runner.app

      - name: Package unsigned iOS artifacts
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ios/package
          mkdir -p build/ios/package/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/package/Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/GardeFlow-v11.6.6-Runner.app.zip
          (cd build/ios/package && zip -qry ../GardeFlow-v11.6.6-unsigned.ipa Payload)
          ls -lh build/ios/GardeFlow-v11.6.6-Runner.app.zip build/ios/GardeFlow-v11.6.6-unsigned.ipa

      - name: Upload iOS unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-v11.6.6-ios-unsigned
          path: |
            ${{ steps.project.outputs.dir }}/build/ios/GardeFlow-v11.6.6-Runner.app.zip
            ${{ steps.project.outputs.dir }}/build/ios/GardeFlow-v11.6.6-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
