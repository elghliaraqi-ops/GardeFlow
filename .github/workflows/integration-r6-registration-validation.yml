name: R6 and medical signup combined validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'source/**'
      - 'supabase/**'
      - '.github/workflows/integration-r6-registration-validation.yml'

permissions:
  contents: read

concurrency:
  group: combined-r6-registration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web-release:
    if: github.head_ref == 'integration/r6-registration-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Assert combined release version
        run: grep -q '^version: 12.0.3+303$' pubspec.yaml
      - name: Flutter pub get
        run: flutter pub get
      - name: Full Flutter test suite
        run: flutter test
      - name: Full Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build combined Web release
        run: |
          flutter config --enable-web
          if [ ! -f web/index.html ]; then flutter create --no-pub --platforms=web --project-name huim6_planning .; fi
          flutter build web --release --base-href "/GardeFlow/"
          test -s build/web/main.dart.js
      - uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-R6-registration-web-predeploy
          path: source/build/web/
          retention-days: 15
          if-no-files-found: error

  android-release:
    if: github.head_ref == 'integration/r6-registration-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Recover Firebase config
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/GardeFlow_android_v11_6_0_official_pdf_auto_import.zip"
          test -f "$ZIP"
          mkdir -p /tmp/gardeflow-firebase-combined
          unzip -q "$ZIP" -d /tmp/gardeflow-firebase-combined
          CONFIG="$(find /tmp/gardeflow-firebase-combined -type f -name google-services.json -print -quit)"
          test -n "$CONFIG"
          cp "$CONFIG" google-services.json
      - name: Generate Android with alarm protections
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create --no-pub --platforms=android --org com.huim6 --project-name huim6_planning .
          cp google-services.json android/app/google-services.json
          dart tool/configure_android.dart
          python3 tool/install_alarm_activity.py
          python3 tool/install_system_alarm_bridge.py
          python3 tool/harden_alarm_fallback.py
          grep -q 'android.permission.USE_FULL_SCREEN_INTENT' android/app/src/main/AndroidManifest.xml
      - name: Get dependencies, test and analyze
        run: |
          flutter pub get
          flutter test
          flutter analyze lib tool --no-fatal-infos --no-fatal-warnings
      - name: Build combined APK release
        run: |
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-R6-registration-apk-predeploy
          path: source/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 15
          if-no-files-found: error

  ios-unsigned-release:
    if: github.head_ref == 'integration/r6-registration-20261008'
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Generate iOS platform and configure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios
          flutter create --no-pub --platforms=ios --org com.huim6 --project-name huim6_planning .
          dart tool/configure_ios.dart
          flutter pub get
          if [ -f ios/Podfile ]; then (cd ios && pod install --repo-update); fi
      - name: Flutter tests
        run: flutter test
      - name: Build iOS unsigned
        run: |
          flutter build ios --release --no-codesign
          test -d build/ios/iphoneos/Runner.app
      - name: Package unsigned iOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios/unsigned-output/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned-output/Payload/GardeFlow.app
          (cd build/ios/unsigned-output && zip -qry GardeFlow-R6-registration-unsigned.ipa Payload)
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app build/ios/unsigned-output/GardeFlow-R6-registration-unsigned.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-R6-registration-ios-unsigned-predeploy
          path: |
            source/build/ios/unsigned-output/GardeFlow-R6-registration-unsigned.ipa
            source/build/ios/unsigned-output/GardeFlow-R6-registration-unsigned.app.zip
          retention-days: 15
          if-no-files-found: error

  edge-source-check:
    if: github.head_ref == 'integration/r6-registration-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck R6 Edge Function
        run: deno check source/supabase/functions/analyze-official-roster-pdf/index.ts
      - name: Confirm emergency-only R6 scope
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const SHIFTS = new Set(['urg-jour', 'urg-nuit', 'urg-24h']);" source/supabase/functions/analyze-official-roster-pdf/index.ts
          if grep -Eq "service-(jour|nuit|24h)" source/supabase/functions/analyze-official-roster-pdf/index.ts; then
            exit 1
          fi
          grep -Fq "medical_position" supabase/patch_medical_position_signup_20261008.sql
          grep -Fq "training_language" supabase/patch_medical_position_signup_20261008.sql
