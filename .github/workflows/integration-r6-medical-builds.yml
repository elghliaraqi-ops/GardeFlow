name: GardeFlow R6 + Registration integration builds (NO DEPLOY)

on:
  pull_request:
    branches: [main]
    paths:
      - 'source/**'
      - 'supabase/**'
      - '.github/workflows/integration-r6-medical-builds.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predeploy-r6-registration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Full Flutter test suite (including R6 and registration)
        run: flutter test
      - name: Flutter analyzer
        run: flutter analyze lib test tool --no-fatal-infos --no-fatal-warnings

  android-apk:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: source

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Verify canonical V12 source
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f tool/configure_android.dart
          test -f tool/install_alarm_activity.py
          test -f tool/install_system_alarm_bridge.py
          test -f tool/harden_alarm_fallback.py
          grep -Fq 'version: 12.0.2+302' pubspec.yaml
          echo 'Canonical source verified: GardeFlow 12.0.2+302'

      - name: Recover Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/GardeFlow_android_v11_6_0_official_pdf_auto_import.zip"
          test -f "$ZIP"
          rm -rf /tmp/gardeflow-firebase
          mkdir -p /tmp/gardeflow-firebase
          unzip -q "$ZIP" -d /tmp/gardeflow-firebase
          GOOGLE_SERVICES="$(find /tmp/gardeflow-firebase -type f -name google-services.json -print -quit)"
          test -n "$GOOGLE_SERVICES"
          cp "$GOOGLE_SERVICES" google-services.json

      - name: Generate and configure Android platform
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create --no-pub --platforms=android --org com.huim6 --project-name huim6_planning .
          cp google-services.json android/app/google-services.json
          dart tool/configure_android.dart
          python3 tool/install_alarm_activity.py
          python3 tool/install_system_alarm_bridge.py
          python3 tool/harden_alarm_fallback.py

          MANIFEST=android/app/src/main/AndroidManifest.xml
          ALARM=android/app/src/main/kotlin/com/huim6/huim6_planning/AlarmActivity.kt

          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' "$MANIFEST"
          grep -q 'android.permission.USE_FULL_SCREEN_INTENT' "$MANIFEST"
          grep -q 'android.permission.WAKE_LOCK' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' "$MANIFEST"
          grep -q 'com.gdelataillade.alarm.action.RING' "$MANIFEST"
          grep -q 'GuardAlarmBootReceiver' "$MANIFEST"
          grep -q 'GuardAlarmTriggerReceiver' "$MANIFEST"
          grep -q 'GuardAlarmService' "$MANIFEST"
          grep -q 'foregroundServiceType="specialUse"' "$MANIFEST"

          test -f "$ALARM"
          grep -q 'class GuardAlarmTriggerReceiver' "$ALARM"
          grep -q 'class GuardAlarmService : Service()' "$ALARM"
          grep -q 'PowerManager.PARTIAL_WAKE_LOCK' "$ALARM"
          grep -q 'Notification.CATEGORY_ALARM' "$ALARM"
          grep -q 'setFullScreenIntent(fullScreenPending, true)' "$ALARM"
          grep -q 'PendingIntent.getBroadcast' "$ALARM"
          grep -q 'setAlarmClock' "$ALARM"
          grep -q 'setAndAllowWhileIdle' "$ALARM"

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze Flutter code
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --build-name 12.0.2 --build-number 302

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload GardeFlow V12 APK
        uses: actions/upload-artifact@v4
        with:
          name: PREDEPLOY-R6-medical-android-apk
          path: source/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  web-release:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PROJECT_DIR: source
      APP_VERSION: 12.0.2
      BUILD_NUMBER: "302"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify canonical V12 source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 12.0.2+302$' pubspec.yaml
          test -f lib/main.dart

      - name: Generate web platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter config --enable-web
          if [ ! -f web/index.html ]; then
            flutter create --no-pub --platforms=web --project-name huim6_planning .
          fi

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Analyze Flutter code
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build Flutter Web release
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build web --release \
            --base-href "/GardeFlow/" \
            --build-name "$APP_VERSION" \
            --build-number "$BUILD_NUMBER"

          BUILD_ID="${GITHUB_SHA:0:12}"
          python3 - "$BUILD_ID" <<'PY'
          from pathlib import Path
          import sys

          build_id = sys.argv[1]
          for relative in ('build/web/index.html', 'build/web/flutter_bootstrap.js'):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              marker = '__GARDEFLOW_BUILD_ID__'
              if marker not in text:
                  raise SystemExit(f'Missing cache-bust marker in {relative}')
              path.write_text(text.replace(marker, build_id), encoding='utf-8')

          Path('build/web/build-id.txt').write_text(build_id + '\n', encoding='utf-8')
          PY

          test -f build/web/index.html
          test -f build/web/main.dart.js
          test -f build/web/flutter_bootstrap.js
          grep -Fq "flutter_bootstrap.js?build=$BUILD_ID" build/web/index.html
          grep -Fq 'main.dart.js?build=${buildId}' build/web/flutter_bootstrap.js
          grep -qx "$BUILD_ID" build/web/build-id.txt
          touch build/web/.nojekyll

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: PREDEPLOY-R6-medical-web
          path: source/build/web
          if-no-files-found: error
          retention-days: 30


  ios-unsigned:
    needs: [unit-tests]
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      PROJECT_DIR: source
      APP_VERSION: 12.0.2
      BUILD_NUMBER: "302"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify canonical V12 source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 12.0.2+302$' pubspec.yaml
          test -f lib/main.dart
          test -f tool/configure_ios.dart

      - name: Generate and configure iOS platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios
          flutter create --no-pub --platforms=ios --org com.huim6 --project-name huim6_planning .
          dart tool/configure_ios.dart
          grep -q 'com.huim6.gardeflow' ios/Runner.xcodeproj/project.pbxproj
          flutter clean
          flutter pub get
          if [ -f ios/Podfile ]; then
            (cd ios && pod install --repo-update)
          fi

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build unsigned iOS release
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --build-name "$APP_VERSION" \
            --build-number "$BUILD_NUMBER"
          test -d build/ios/iphoneos/Runner.app

      - name: Package unsigned artifacts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ios/unsigned-output
          mkdir -p build/ios/unsigned-output/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned-output/Payload/GardeFlow.app
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app build/ios/unsigned-output/GardeFlow-v12.0.2-unsigned.app.zip
          (cd build/ios/unsigned-output && zip -qry GardeFlow-v12.0.2-unsigned.ipa Payload)

      - name: Upload unsigned iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PREDEPLOY-R6-medical-ios-unsigned
          path: |
            source/build/ios/unsigned-output/GardeFlow-v12.0.2-unsigned.app.zip
            source/build/ios/unsigned-output/GardeFlow-v12.0.2-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

