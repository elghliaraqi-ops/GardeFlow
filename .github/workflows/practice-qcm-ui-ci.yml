name: Validate Practice QCM UI

on:
  workflow_dispatch:
  push:
    branches:
      - feature-practice-qcm-ui-fixes-20260930
    paths:
      - '.github/workflows/practice-qcm-ui-ci.yml'
      - 'ci/v12_practice_qcm/**'
      - 'source/lib/models/qcm_models.dart'
      - 'source/lib/models/clinical_case_post.dart'
      - 'source/lib/services/clinical_case_service.dart'
      - 'source/lib/screens/practice_qcm_screen.dart'
      - 'source/test/qcm_models_test.dart'

permissions:
  contents: write

concurrency:
  group: practice-qcm-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature-practice-qcm-ui-fixes-20260930
          fetch-depth: 0

      - name: Apply guarded UI patch
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/v12_practice_qcm/run_patch.py
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'GardeFlow CI'
            git config user.email 'actions@users.noreply.github.com'
            git add source/lib/screens/home_screen.dart source/lib/screens/practice_screen.dart source/lib/screens/clinical_cases_section.dart
            git commit -m 'feat(practice): reorganize Practice and wire QCM stats'
            git push origin HEAD:feature-practice-qcm-ui-fixes-20260930
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run targeted tests
        working-directory: source
        run: flutter test test/qcm_models_test.dart test/clinical_case_post_test.dart test/practice_models_test.dart

      - name: Analyze affected Flutter code
        working-directory: source
        run: flutter analyze lib/models/qcm_models.dart lib/models/clinical_case_post.dart lib/services/clinical_case_service.dart lib/screens/practice_qcm_screen.dart lib/screens/clinical_cases_section.dart lib/screens/practice_screen.dart lib/screens/home_screen.dart test/qcm_models_test.dart --no-fatal-infos --no-fatal-warnings

      - name: Build Flutter Web release
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --enable-web
          if [ ! -f web/index.html ]; then
            flutter create --no-pub --platforms=web --project-name huim6_planning .
          fi
          flutter build web --release --base-href "/GardeFlow/"
          test -f build/web/index.html
          test -f build/web/main.dart.js
