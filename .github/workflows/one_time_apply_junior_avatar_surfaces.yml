name: One-time apply junior avatar surfaces

on:
  push:
    branches:
      - feature/junior-gaming-avatars-finalize
    paths:
      - '.github/workflows/one_time_apply_junior_avatar_surfaces.yml'
      - 'ci/patch_junior_avatar_surfaces.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/junior-gaming-avatars-finalize
          fetch-depth: 0
      - name: Patch avatar surfaces
        run: python3 ci/patch_junior_avatar_surfaces.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No avatar surface changes required.'
            exit 0
          fi
          git config user.name 'GardeFlow CI'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            source/lib/screens/home_screen.dart \
            source/lib/screens/admin_screen.dart \
            source/lib/screens/admin_password_reset_screen.dart \
            source/lib/screens/announcements_screen.dart \
            source/lib/screens/practice_screen.dart
          git commit -m 'Show junior avatars across member surfaces'
          git push origin HEAD:feature/junior-gaming-avatars-finalize
