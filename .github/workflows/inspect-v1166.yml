name: Inspect Current Auth Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v1166.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Supabase auth and push infrastructure
        shell: bash
        run: |
          set -euo pipefail
          ZIP="GardeFlow_android_v11_6_0_official_pdf_auto_import.zip"
          rm -rf /tmp/gfinspect && mkdir -p /tmp/gfinspect
          unzip -q "$ZIP" -d /tmp/gfinspect
          PUBSPEC="$(find /tmp/gfinspect -type f -name pubspec.yaml -print -quit)"
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          cd "$PROJECT_DIR"

          echo '===== SUPABASE TREE ====='
          find supabase -maxdepth 4 -type f -print 2>/dev/null | sort || true
          echo '===== SEND PUSH FUNCTION ====='
          if [ -f supabase/functions/send-push/index.ts ]; then
            sed -n '1,360p' supabase/functions/send-push/index.ts
          else
            find . -path '*send-push*' -type f -print -exec sed -n '1,360p' {} \; || true
          fi
          echo '===== CONFIG / DEEPLINK MATCHES ====='
          grep -RInE "scheme|deep.?link|redirectTo|onAuthStateChange|passwordRecovery|AuthChangeEvent|android:host|intent-filter" lib tool android ios 2>/dev/null | head -n 500 || true
