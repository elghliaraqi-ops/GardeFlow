name: Inspect Current Auth Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v1166.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble current project and print auth sources
        shell: bash
        run: |
          set -euo pipefail
          ZIP="GardeFlow_android_v11_6_0_official_pdf_auto_import.zip"
          rm -rf /tmp/gfinspect && mkdir -p /tmp/gfinspect
          unzip -q "$ZIP" -d /tmp/gfinspect
          PUBSPEC="$(find /tmp/gfinspect -type f -name pubspec.yaml -print -quit)"
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          cd "$PROJECT_DIR"

          cat "$GITHUB_WORKSPACE"/ci/v11_6_1/overlay.part* > /tmp/v1161.patch
          patch -p1 < /tmp/v1161.patch >/dev/null
          cat "$GITHUB_WORKSPACE"/ci/v11_6_3/overlay.part* > /tmp/v1163.patch
          patch -p1 < /tmp/v1163.patch >/dev/null
          sed -i 's/^version: 11.6.3+163$/version: 11.6.4+164/' pubspec.yaml
          cat "$GITHUB_WORKSPACE"/ci/v11_6_5/overlay.part* > /tmp/v1165.patch
          patch -p1 < /tmp/v1165.patch >/dev/null
          sed -i 's/^version: 11.6.4+164$/version: 11.6.5+165/' pubspec.yaml
          cat "$GITHUB_WORKSPACE"/ci/v11_6_6/overlay.part* > /tmp/v1166.patch
          patch -p1 < /tmp/v1166.patch >/dev/null
          python3 "$GITHUB_WORKSPACE/ci/v11_6_7/apply_v11_6_7.py" >/dev/null
          python3 "$GITHUB_WORKSPACE/ci/v11_6_8/apply_v11_6_8.py" >/dev/null
          python3 "$GITHUB_WORKSPACE/ci/v11_6_9/apply_v11_6_9.py" >/dev/null
          python3 "$GITHUB_WORKSPACE/ci/v11_6_10/apply_v11_6_10.py" >/dev/null

          echo '===== SCREEN FILES ====='
          find lib/screens -maxdepth 1 -type f -name '*.dart' -print | sort

          echo '===== AUTH MATCHES ====='
          grep -RInE "Mot de passe oublié|mot de passe oublié|forgot|password|Connexion|Se connecter|signIn\(|signUp\(" lib/screens lib/state lib/services | head -n 400 || true

          echo '===== AUTH-RELATED FILE CONTENT ====='
          for f in $(grep -RIlE "Mot de passe oublié|mot de passe oublié|forgot|Connexion|Se connecter|signIn\(" lib/screens lib/state lib/services || true); do
            echo "===== FILE: $f ====="
            sed -n '1,320p' "$f"
          done

          echo '===== SUPABASE AUTH SERVICE TOP ====='
          sed -n '1,150p' lib/services/supabase_backend_service.dart

          echo '===== PUBSPEC ====='
          cat pubspec.yaml
