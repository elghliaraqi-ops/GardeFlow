name: One-time decor embedded visibility fix v2

on:
  push:
    branches:
      - style/full-app-decor-refresh-20261001
    paths:
      - '.github/workflows/one-time-decor-embedded-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: style/full-app-decor-refresh-20261001
          fetch-depth: 0

      - name: Apply visibility patch
        run: python3 ci/patch_embedded_decor.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format shared decor layer
        working-directory: source
        run: dart format lib/theme/screen_decor.dart

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Analyze
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build web release
        working-directory: source
        run: flutter build web --release --base-href '/GardeFlow/' --build-name '12.0.0' --build-number '300'

      - name: Clean generated and one-time files
        run: |
          rm -rf source/.dart_tool source/build
          rm -f source/.flutter-plugins source/.flutter-plugins-dependencies
          git checkout -- source/pubspec.lock 2>/dev/null || true
          rm -f ci/patch_embedded_decor.py
          rm -f .github/workflows/one-time-decor-embedded-fix.yml
          rm -f .github/workflows/one-time-decor-embedded-fix-v2.yml

      - name: Verify intended patch scope
        run: |
          git add -A
          git diff --cached --name-status
          bad=$(git diff --cached --name-only | grep -Ev '^(source/lib/theme/screen_decor\.dart|source/lib/screens/practice_screen\.dart|source/lib/screens/junior_oncall_screen\.dart|source/lib/screens/senior_oncall_screen\.dart|\.github/workflows/one-time-decor-embedded-fix\.yml|\.github/workflows/one-time-decor-embedded-fix-v2\.yml|ci/patch_embedded_decor\.py)$' || true)
          if [ -n "$bad" ]; then
            echo 'Unexpected paths:'
            echo "$bad"
            exit 1
          fi
          grep -q '_DecorForeground' source/lib/theme/screen_decor.dart
          grep -q 'scene: ScreenDecorScene.practice' source/lib/screens/practice_screen.dart
          grep -q 'baseColor: PracticeColors.background' source/lib/screens/practice_screen.dart
          grep -q 'scene: ScreenDecorScene.onCall' source/lib/screens/junior_oncall_screen.dart
          grep -q 'scene: ScreenDecorScene.onCall' source/lib/screens/senior_oncall_screen.dart

      - name: Commit visibility fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: garantir les décors sur les vues intégrées'
          git push origin HEAD:style/full-app-decor-refresh-20261001
