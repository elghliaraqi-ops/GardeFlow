name: Patch account theme V12

on:
  push:
    branches:
      - feat/account-theme-v12

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/account-theme-v12
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply account theme patch
        run: python3 tools/patch_account_theme_v12.py

      - name: Format changed Dart files
        working-directory: source
        run: |
          dart format \
            lib/models/app_user.dart \
            lib/theme/app_theme.dart \
            lib/services/supabase_backend_service.dart \
            lib/state/app_state.dart \
            lib/screens/application_settings_screen.dart

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Analyze implementation
        working-directory: source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Package validated implementation
        run: |
          mkdir -p validated-theme-patch/source/lib/models
          mkdir -p validated-theme-patch/source/lib/theme
          mkdir -p validated-theme-patch/source/lib/services
          mkdir -p validated-theme-patch/source/lib/state
          mkdir -p validated-theme-patch/source/lib/screens
          mkdir -p validated-theme-patch/supabase/migrations
          cp source/lib/models/app_user.dart validated-theme-patch/source/lib/models/
          cp source/lib/theme/app_theme.dart validated-theme-patch/source/lib/theme/
          cp source/lib/services/supabase_backend_service.dart validated-theme-patch/source/lib/services/
          cp source/lib/state/app_state.dart validated-theme-patch/source/lib/state/
          cp source/lib/screens/application_settings_screen.dart validated-theme-patch/source/lib/screens/
          cp supabase/migrations/20261001_account_linked_appearance_theme.sql validated-theme-patch/supabase/migrations/

      - name: Upload validated implementation
        uses: actions/upload-artifact@v4
        with:
          name: validated-account-theme-v12
          path: validated-theme-patch
          if-no-files-found: error
          retention-days: 1
