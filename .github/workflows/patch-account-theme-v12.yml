name: Patch account theme V12

on:
  push:
    branches:
      - feat/account-theme-v12

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/account-theme-v12
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply account theme patch
        run: python3 tools/patch_account_theme_v12.py

      - name: Format changed Dart files
        working-directory: source
        run: |
          dart format \
            lib/models/app_user.dart \
            lib/theme/app_theme.dart \
            lib/services/supabase_backend_service.dart \
            lib/state/app_state.dart \
            lib/screens/application_settings_screen.dart

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Analyze implementation
        working-directory: source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Remove temporary patch helpers
        run: rm -f tools/patch_account_theme_v12.py .github/workflows/patch-account-theme-v12.yml

      - name: Commit patched implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: persist appearance theme per account [theme-patch-done]'
          git push origin HEAD:feat/account-theme-v12
