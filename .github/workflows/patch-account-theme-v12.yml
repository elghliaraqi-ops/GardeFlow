name: Patch account theme V12

on:
  push:
    branches:
      - feat/account-theme-v12

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/account-theme-v12
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply account theme patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "final String appearanceTheme;" source/lib/models/app_user.dart; then
            echo "Account theme patch already present; skipping patch script."
          else
            python3 tools/patch_account_theme_v12.py
          fi

      - name: Disable automatic signed iOS build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-ios-signed.yml')
          text = path.read_text(encoding='utf-8')
          old = "on:\n  workflow_dispatch:\n  push:\n    branches:\n      - main\n    paths:\n      - '.github/workflows/build-ios-signed.yml'\n      - 'source/**'\n"
          new = "on:\n  workflow_dispatch:\n"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new in text:
              print('Signed iOS workflow is already manual-only.')
          else:
              raise SystemExit('Unexpected build-ios-signed.yml trigger block')
          PY

      - name: Format changed Dart files
        working-directory: source
        run: |
          dart format \
            lib/models/app_user.dart \
            lib/theme/app_theme.dart \
            lib/services/supabase_backend_service.dart \
            lib/state/app_state.dart \
            lib/screens/application_settings_screen.dart

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Analyze implementation
        working-directory: source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            source/lib/models/app_user.dart \
            source/lib/theme/app_theme.dart \
            source/lib/services/supabase_backend_service.dart \
            source/lib/state/app_state.dart \
            source/lib/screens/application_settings_screen.dart \
            supabase/migrations/20261001_account_linked_appearance_theme.sql \
            .github/workflows/build-ios-signed.yml
          if git diff --cached --quiet; then
            echo "No validated implementation changes to commit."
          else
            git commit -m "feat: persist account theme and disable signed iOS auto-build [skip ci]"
            git push origin HEAD:feat/account-theme-v12
          fi
