name: One-time Practice branding stats

on:
  push:
    paths:
      - '.github/workflows/one-time-practice-branding-stats.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Practice patch
        run: python3 ci/one_time_practice_branding.py
      - name: Format Dart
        run: cd source && dart format lib/screens/practice_screen.dart lib/screens/splash_screen.dart
      - name: Commit app changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add source/lib/screens/practice_screen.dart source/lib/screens/splash_screen.dart
          git commit -m "feat: Practice branding stats and FlowSuite splash"
          git push
