name: One-time original Practice and FlowSuite assets

on:
  push:
    paths:
      - '.github/workflows/one-time-practice-branding-stats.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install original branding assets and remove Flutter imitations
        run: python3 ci/one_time_practice_branding.py
      - name: Commit exact app branding integration
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m "ui: use original FlowSuite and Practice visual assets"
          git push

# Trigger original asset installation: 2026-10-02
