name: One-time original Practice and FlowSuite assets

on:
  push:
    paths:
      - '.github/workflows/one-time-practice-branding-stats.yml'
      - 'ci/one_time_practice_branding.py'
      - 'ci/one_time_android_widget_integration.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install branding and Android widget integration
        id: install
        shell: bash
        run: |
          set +e
          {
            python3 ci/one_time_practice_branding.py
            branding_status=$?
            if [ "$branding_status" -ne 0 ]; then
              exit "$branding_status"
            fi
            python3 ci/one_time_android_widget_integration.py
            dart format source/lib/screens/home_screen.dart source/lib/services/android_widget_service.dart
          } > /tmp/branding-install.log 2>&1
          status=$?
          cat /tmp/branding-install.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload installation diagnostics
        if: steps.install.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: original-branding-install-error
          path: /tmp/branding-install.log
          if-no-files-found: error
          retention-days: 1
      - name: Commit app integration
        if: steps.install.outputs.status == '0'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m "feat(widget): integrate and format Android home widget"
          git push
      - name: Fail after preserving diagnostics
        if: steps.install.outputs.status != '0'
        run: exit 1

# Trigger formatted Android widget integration: 2026-10-04
