name: One-time Practice branding and stats

on:
  push:
    paths:
      - '.github/workflows/one-time-practice-branding-stats.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Practice and splash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          practice = Path('source/lib/screens/practice_screen.dart')
          s = practice.read_text()

          def once(old, new, label):
              global s
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'anchor missing: {label}')
              s = s.replace(old, new, 1)

          once(
              '  QcmRanks _qcmMonth = const QcmRanks();\n',
              '  QcmRanks _qcmMonth = const QcmRanks();\n  QcmStats _qcmAll = const QcmStats();\n',
              'qcm all state',
          )
          once(
              "        _qcmService.qcmRanks(period: 'month'),\n      ]);",
              "        _qcmService.qcmRanks(period: 'month'),\n        _qcmService.qcmSummary(period: 'all'),\n      ]);",
              'qcm all load',
          )
          once(
              '        _qcmMonth = results[8] as QcmRanks;\n        _loading = false;',
              '        _qcmMonth = results[8] as QcmRanks;\n        _qcmAll = results[9] as QcmStats;\n        _loading = false;',
              'qcm all assign',
          )
          once(
              "              const _PracticeHubSectionHeader(\n                icon: Icons.sports_esports_rounded,\n                title: 'S’entraîner',",
              "              const _PracticeBrandMark(),\n              const SizedBox(height: 16),\n              const _PracticeHubSectionHeader(\n                icon: Icons.sports_esports_rounded,\n                title: 'S’entraîner',",
              'practice brand',
          )
          once(
              '              ),\n              const SizedBox(height: 20),\n              const _PracticeHubSectionHeader(\n                icon: Icons.insights_rounded,',
              '              ),\n              const SizedBox(height: 10),\n              _QcmCanonicalStatsStrip(month: _qcmMonth, total: _qcmAll, loading: _loading),\n              const SizedBox(height: 20),\n              const _PracticeHubSectionHeader(\n                icon: Icons.insights_rounded,',
              'qcm stats strip',
          )

          if 'class _PracticeBrandMark extends StatelessWidget' not in s:
              s += r'''

class _PracticeBrandMark extends StatelessWidget {
  const _PracticeBrandMark();

  @override
  Widget build(BuildContext context) {
    return Semantics(
      label: 'Practice',
      child: Container(
        padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 10),
        decoration: BoxDecoration(
          borderRadius: BorderRadius.circular(22),
          gradient: const LinearGradient(
            colors: [Color(0xFF0D2D63), Color(0xFF165DCA), Color(0xFF7A36E8)],
          ),
          border: Border.all(color: const Color(0xFF55C8FF).withOpacity(.45)),
          boxShadow: [BoxShadow(color: const Color(0xFF235CFF).withOpacity(.18), blurRadius: 18)],
        ),
        child: Row(
          mainAxisSize: MainAxisSize.min,
          children: [
            Container(
              width: 42,
              height: 42,
              decoration: BoxDecoration(
                borderRadius: BorderRadius.circular(13),
                color: Colors.white.withOpacity(.12),
              ),
              child: const Icon(Icons.assignment_turned_in_rounded, color: Colors.white, size: 27),
            ),
            const SizedBox(width: 11),
            const Text(
              'Practice',
              style: TextStyle(
                color: Colors.white,
                fontFamily: 'SpaceGrotesk',
                fontWeight: FontWeight.w900,
                fontSize: 25,
                letterSpacing: -.7,
              ),
            ),
          ],
        ),
      ),
    );
  }
}

class _QcmCanonicalStatsStrip extends StatelessWidget {
  final QcmRanks month;
  final QcmStats total;
  final bool loading;
  const _QcmCanonicalStatsStrip({required this.month, required this.total, required this.loading});

  @override
  Widget build(BuildContext context) {
    String value(int n) => loading ? '—' : '$n';
    return Container(
      padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 11),
      decoration: BoxDecoration(
        color: PracticeColors.surface.withOpacity(.88),
        borderRadius: BorderRadius.circular(18),
        border: Border.all(color: PracticeColors.gameBlue.withOpacity(.35)),
      ),
      child: Row(
        children: [
          const Icon(Icons.sync_rounded, color: PracticeColors.accent, size: 20),
          const SizedBox(width: 9),
          Expanded(
            child: Text(
              '${value(month.answered)} ce mois  •  ${value(total.answered)} au total',
              style: const TextStyle(color: PracticeColors.text, fontWeight: FontWeight.w800, fontSize: 13.5),
            ),
          ),
          const Text('Auto', style: TextStyle(color: PracticeColors.accent, fontSize: 11, fontWeight: FontWeight.w800)),
        ],
      ),
    );
  }
}
'''
          practice.write_text(s)

          splash = Path('source/lib/screens/splash_screen.dart')
          z = splash.read_text()
          z = z.replace('Duration(milliseconds: 2600)', 'Duration(milliseconds: 3200)', 1)
          anchor = "                            SizedBox(height: 26),\n                            Text(\n                              'AU SERVICE DES SOIGNANTS\\nAU SERVICE DES PATIENTS',"
          replacement = "                            SizedBox(height: 22),\n                            const _FlowSuiteSplashBrands(),\n                            SizedBox(height: 22),\n                            Text(\n                              'AU SERVICE DES SOIGNANTS\\nAU SERVICE DES PATIENTS',"
          if '_FlowSuiteSplashBrands(),' not in z:
              if anchor not in z:
                  raise SystemExit('anchor missing: splash brands')
              z = z.replace(anchor, replacement, 1)
          if 'class _FlowSuiteSplashBrands extends StatelessWidget' not in z:
              z += r'''

class _FlowSuiteSplashBrands extends StatelessWidget {
  const _FlowSuiteSplashBrands();

  @override
  Widget build(BuildContext context) {
    return Container(
      padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 12),
      decoration: BoxDecoration(
        color: Colors.white.withOpacity(.78),
        borderRadius: BorderRadius.circular(20),
        border: Border.all(color: const Color(0xFF1A7A62).withOpacity(.14)),
        boxShadow: [BoxShadow(color: const Color(0xFF154B8A).withOpacity(.08), blurRadius: 22, offset: const Offset(0, 8))],
      ),
      child: Row(
        mainAxisAlignment: MainAxisAlignment.center,
        children: [
          const _SplashBrandChip(
            icon: Icons.hub_rounded,
            title: 'FlowSuite',
            subtitle: 'Écosystème hospitalier',
            colors: [Color(0xFF08734E), Color(0xFFE53935)],
          ),
          Container(width: 1, height: 42, margin: const EdgeInsets.symmetric(horizontal: 12), color: const Color(0xFFDCE6EE)),
          const _SplashBrandChip(
            icon: Icons.assignment_turned_in_rounded,
            title: 'Practice',
            subtitle: 'Apprendre · progresser',
            colors: [Color(0xFF075CCB), Color(0xFF873BE8)],
          ),
        ],
      ),
    );
  }
}

class _SplashBrandChip extends StatelessWidget {
  final IconData icon;
  final String title;
  final String subtitle;
  final List<Color> colors;
  const _SplashBrandChip({required this.icon, required this.title, required this.subtitle, required this.colors});

  @override
  Widget build(BuildContext context) {
    return Flexible(
      child: Row(
        mainAxisSize: MainAxisSize.min,
        children: [
          Container(
            width: 39,
            height: 39,
            decoration: BoxDecoration(
              borderRadius: BorderRadius.circular(12),
              gradient: LinearGradient(colors: colors),
            ),
            child: Icon(icon, color: Colors.white, size: 23),
          ),
          const SizedBox(width: 8),
          Flexible(
            child: Column(
              crossAxisAlignment: CrossAxisAlignment.start,
              mainAxisSize: MainAxisSize.min,
              children: [
                ShaderMask(
                  shaderCallback: (r) => LinearGradient(colors: colors).createShader(r),
                  child: Text(title, maxLines: 1, style: const TextStyle(color: Colors.white, fontFamily: 'SpaceGrotesk', fontWeight: FontWeight.w900, fontSize: 16)),
                ),
                Text(subtitle, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(color: Color(0xFF607080), fontSize: 8.5, fontWeight: FontWeight.w700)),
              ],
            ),
          ),
        ],
      ),
    );
  }
}
'''
          splash.write_text(z)
          PY

      - name: Validate Dart formatting
        run: |
          cd source
          dart format lib/screens/practice_screen.dart lib/screens/splash_screen.dart

      - name: Commit deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/lib/screens/practice_screen.dart source/lib/screens/splash_screen.dart
          git commit -m 'feat: unify Practice QCM counters and add FlowSuite branding'
          git push origin HEAD:main
