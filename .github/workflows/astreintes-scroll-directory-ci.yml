name: Astreintes scroll and directory CI

on:
  push:
    branches:
      - improve-astreintes-scroll-directory-20260930

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Astreintes layout update
        run: python3 ci/astreintes_scroll_directory_patch.py

      - name: Verify intended layout
        shell: bash
        run: |
          set -euo pipefail
          grep -q "onDirectory: _tab == 3" source/lib/screens/home_screen.dart
          grep -q "embeddedHeader: _scrollingModeSwitch()" source/lib/screens/home_screen.dart
          ! grep -q "Ouvrir l’annuaire" source/lib/screens/home_screen.dart
          grep -q "final Widget? embeddedHeader" source/lib/screens/junior_oncall_screen.dart
          grep -q "Widget _buildEmbeddedContent()" source/lib/screens/junior_oncall_screen.dart
          grep -q "final Widget? embeddedHeader" source/lib/screens/senior_oncall_screen.dart
          grep -q "Widget _buildEmbeddedContent()" source/lib/screens/senior_oncall_screen.dart

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Patch already applied"
          else
            git config user.name "elghliaraqi-ops"
            git config user.email "elghliaraqi@gmail.com"
            git add source/lib/screens/home_screen.dart source/lib/screens/junior_oncall_screen.dart source/lib/screens/senior_oncall_screen.dart
            git commit -m "Improve Astreintes scrolling and directory access"
            git push origin HEAD:improve-astreintes-scroll-directory-20260930
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Analyze
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build Web release
        working-directory: source
        run: flutter build web --release --base-href "/GardeFlow/"
