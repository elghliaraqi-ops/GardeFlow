name: Astreintes scroll and directory CI

on:
  push:
    branches:
      - improve-astreintes-scroll-directory-20260930

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Astreintes layout update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # -----------------------------------------------------------------
          # Home: move Directory next to the notification bell and make the
          # Astreintes switch part of the embedded screens' scrolling content.
          # -----------------------------------------------------------------
          path = Path('source/lib/screens/home_screen.dart')
          text = path.read_text(encoding='utf-8')

          old = """              onNotifications: () => Navigator.push(\n                context,\n                MaterialPageRoute(builder: (_) => NotificationsScreen()),\n              ),\n              onAccount: () => Navigator.push(\n"""
          new = """              onNotifications: () => Navigator.push(\n                context,\n                MaterialPageRoute(builder: (_) => NotificationsScreen()),\n              ),\n              onDirectory: _tab == 3\n                  ? () => Navigator.push(\n                      context,\n                      MaterialPageRoute(builder: (_) => DirectoryScreen()),\n                    )\n                  : null,\n              onAccount: () => Navigator.push(\n"""
          if old in text:
              text = text.replace(old, new, 1)

          old = """  final VoidCallback onNotifications;\n  final VoidCallback onAccount;\n\n  const _GlobalTopBar({\n    required this.title,\n    required this.appState,\n    required this.onNotifications,\n    required this.onAccount,\n  });\n"""
          new = """  final VoidCallback onNotifications;\n  final VoidCallback? onDirectory;\n  final VoidCallback onAccount;\n\n  const _GlobalTopBar({\n    required this.title,\n    required this.appState,\n    required this.onNotifications,\n    this.onDirectory,\n    required this.onAccount,\n  });\n"""
          if old in text:
              text = text.replace(old, new, 1)

          bell_anchor = """          Stack(\n            clipBehavior: Clip.none,\n            children: [\n              Material(\n                color: AppColors.card,\n"""
          directory_button = """          if (onDirectory != null) ...[\n            Tooltip(\n              message: 'Annuaire',\n              child: Material(\n                color: AppColors.card,\n                borderRadius: BorderRadius.circular(13),\n                child: InkWell(\n                  onTap: onDirectory,\n                  borderRadius: BorderRadius.circular(13),\n                  child: Container(\n                    width: 40,\n                    height: 40,\n                    alignment: Alignment.center,\n                    decoration: BoxDecoration(\n                      border: Border.all(color: AppColors.line),\n                      borderRadius: BorderRadius.circular(13),\n                    ),\n                    child: Icon(\n                      Icons.contacts_rounded,\n                      color: AppColors.brand,\n                      size: 20,\n                    ),\n                  ),\n                ),\n              ),\n            ),\n            SizedBox(width: 9),\n          ],\n"""
          if directory_button not in text:
              if bell_anchor not in text:
                  raise SystemExit('Global top-bar bell anchor not found')
              text = text.replace(bell_anchor, directory_button + bell_anchor, 1)

          pattern = re.compile(
              r"class _AstreintesHubViewState extends State<_AstreintesHubView> \{.*?\n\}\n\nclass _AstreinteModeSwitch",
              re.S,
          )
          replacement = """class _AstreintesHubViewState extends State<_AstreintesHubView> {\n  bool _showSenior = false;\n\n  Widget _scrollingModeSwitch() {\n    return Padding(\n      padding: const EdgeInsets.fromLTRB(14, 10, 14, 8),\n      child: _AstreinteModeSwitch(\n        showSenior: _showSenior,\n        onChanged: (senior) {\n          if (senior == _showSenior) return;\n          setState(() => _showSenior = senior);\n        },\n      ),\n    );\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return ColoredBox(\n      color: AppColors.paper,\n      child: IndexedStack(\n        index: _showSenior ? 0 : 1,\n        children: [\n          SeniorOnCallScreen(\n            embedded: true,\n            embeddedHeader: _scrollingModeSwitch(),\n          ),\n          JuniorOnCallScreen(\n            embedded: true,\n            embeddedHeader: _scrollingModeSwitch(),\n          ),\n        ],\n      ),\n    );\n  }\n}\n\nclass _AstreinteModeSwitch"""
          if 'embeddedHeader: _scrollingModeSwitch()' not in text:
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('Astreintes hub block not found')

          path.write_text(text, encoding='utf-8')

          # -----------------------------------------------------------------
          # Juniors: in embedded mode, one ListView owns the entire page.
          # -----------------------------------------------------------------
          path = Path('source/lib/screens/junior_oncall_screen.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              """class JuniorOnCallScreen extends StatefulWidget {\n  final bool embedded;\n\n  const JuniorOnCallScreen({super.key, this.embedded = false});\n""",
              """class JuniorOnCallScreen extends StatefulWidget {\n  final bool embedded;\n  final Widget? embeddedHeader;\n\n  const JuniorOnCallScreen({\n    super.key,\n    this.embedded = false,\n    this.embeddedHeader,\n  });\n""",
              1,
          )

          old_build = re.compile(
              r"  @override\n  Widget build\(BuildContext context\) \{\n    final theme = Theme\.of\(context\);.*?\n  \}\n\n  Widget _buildBody\(\) \{",
              re.S,
          )
          new_build = r'''  @override
  Widget build(BuildContext context) {
    final theme = Theme.of(context);

    if (widget.embedded) {
      return ColoredBox(
        color: theme.scaffoldBackgroundColor,
        child: RefreshIndicator(
          onRefresh: _load,
          child: ListView(
            physics: const AlwaysScrollableScrollPhysics(
              parent: BouncingScrollPhysics(),
            ),
            padding: const EdgeInsets.only(bottom: 44),
            children: [
              if (widget.embeddedHeader != null) widget.embeddedHeader!,
              Padding(
                padding: const EdgeInsets.fromLTRB(16, 2, 10, 2),
                child: Row(
                  children: [
                    Expanded(
                      child: Text(
                        'Astreinte Junior',
                        style: TextStyle(
                          color: AppColors.ink,
                          fontFamily: 'SpaceGrotesk',
                          fontSize: 18,
                          fontWeight: FontWeight.w900,
                        ),
                      ),
                    ),
                    IconButton(
                      tooltip: 'Calendrier du mois',
                      visualDensity: VisualDensity.compact,
                      onPressed: _loading ? null : _openMonthCalendar,
                      icon: const Icon(Icons.calendar_month_rounded, size: 20),
                      color: AppColors.brand,
                    ),
                    IconButton(
                      tooltip: 'Actualiser',
                      visualDensity: VisualDensity.compact,
                      onPressed: _loading ? null : _load,
                      icon: const Icon(Icons.refresh_rounded, size: 20),
                      color: AppColors.brand,
                    ),
                  ],
                ),
              ),
              _WeekSelector(
                start: _weekStart,
                end: _weekEnd,
                onPrevious: _loading ? null : () => _changeWeek(-1),
                onNext: _loading ? null : () => _changeWeek(1),
              ),
              _DaySelector(
                weekStart: _weekStart,
                selectedIndex: _selectedDayIndex,
                onSelected: _selectDay,
              ),
              _HospitalFilter(
                selectedHospital: _activeHospital,
                onChanged: _selectHospital,
              ),
              _ServiceFilter(
                services: _availableServices,
                value: _selectedService,
                allValue: _allServices,
                onChanged: (value) {
                  if (value == null) return;
                  setState(() => _selectedService = value);
                },
              ),
              const SizedBox(height: 4),
              _buildEmbeddedContent(),
            ],
          ),
        ),
      );
    }

    final body = Column(
      children: [
        _WeekSelector(
          start: _weekStart,
          end: _weekEnd,
          onPrevious: _loading ? null : () => _changeWeek(-1),
          onNext: _loading ? null : () => _changeWeek(1),
        ),
        _DaySelector(
          weekStart: _weekStart,
          selectedIndex: _selectedDayIndex,
          onSelected: _selectDay,
        ),
        _HospitalFilter(
          selectedHospital: _activeHospital,
          onChanged: _selectHospital,
        ),
        _ServiceFilter(
          services: _availableServices,
          value: _selectedService,
          allValue: _allServices,
          onChanged: (value) {
            if (value == null) return;
            setState(() => _selectedService = value);
          },
        ),
        const SizedBox(height: 4),
        Expanded(child: _buildBody()),
      ],
    );

    return Scaffold(
      backgroundColor: theme.scaffoldBackgroundColor,
      appBar: AppBar(
        title: GardeFlowTitle('Astreintes Juniors'),
        actions: [
          IconButton(
            tooltip: 'Calendrier du mois',
            onPressed: _loading ? null : _openMonthCalendar,
            icon: const Icon(Icons.calendar_month_rounded),
          ),
          IconButton(
            tooltip: 'Actualiser',
            onPressed: _loading ? null : _load,
            icon: const Icon(Icons.refresh_rounded),
          ),
        ],
      ),
      body: body,
    );
  }

  Widget _buildEmbeddedContent() {
    if (_loading) {
      return const Padding(
        padding: EdgeInsets.symmetric(vertical: 54),
        child: Center(child: CircularProgressIndicator()),
      );
    }
    if (_error != null) {
      return Padding(
        padding: const EdgeInsets.fromLTRB(22, 28, 22, 20),
        child: Column(
          children: [
            const Icon(
              Icons.error_outline_rounded,
              size: 44,
              color: AppColors.danger,
            ),
            const SizedBox(height: 12),
            Text(_error!, textAlign: TextAlign.center),
            const SizedBox(height: 14),
            FilledButton.icon(
              onPressed: _load,
              icon: const Icon(Icons.refresh_rounded),
              label: const Text('Réessayer'),
            ),
          ],
        ),
      );
    }

    final rows = _visibleRows;
    if (rows.isEmpty) {
      final day = DateFormat('EEEE d MMMM', 'fr_FR').format(_selectedDay);
      return Padding(
        padding: const EdgeInsets.fromLTRB(24, 46, 24, 22),
        child: Column(
          children: [
            Icon(
              Icons.event_available_outlined,
              size: 50,
              color: AppColors.inkFaint,
            ),
            const SizedBox(height: 14),
            Text(
              'Aucune garde ou astreinte Junior $day\nà ${_juniorHospitalLabel(_activeHospital)}${_selectedService == _allServices ? '' : ' · $_selectedService'}.',
              textAlign: TextAlign.center,
              style: Theme.of(context).textTheme.bodyMedium?.copyWith(
                color: AppColors.inkSoft,
                height: 1.45,
              ),
            ),
          ],
        ),
      );
    }

    final groups = _groupRowsByServiceForDay(rows);
    return Padding(
      padding: const EdgeInsets.fromLTRB(
        AppSpace.lg,
        AppSpace.md,
        AppSpace.lg,
        0,
      ),
      child: Column(
        children: [for (final group in groups) _ServiceDayCard(group: group)],
      ),
    );
  }

  Widget _buildBody() {'''
          if 'Widget _buildEmbeddedContent()' not in text:
              text, count = old_build.subn(new_build, text, count=1)
              if count != 1:
                  raise SystemExit('Junior build block not found')
          path.write_text(text, encoding='utf-8')

          # -----------------------------------------------------------------
          # Seniors: same whole-page scroll behavior in embedded mode.
          # -----------------------------------------------------------------
          path = Path('source/lib/screens/senior_oncall_screen.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              """class SeniorOnCallScreen extends StatefulWidget {\n  final bool embedded;\n\n  const SeniorOnCallScreen({super.key, this.embedded = false});\n""",
              """class SeniorOnCallScreen extends StatefulWidget {\n  final bool embedded;\n  final Widget? embeddedHeader;\n\n  const SeniorOnCallScreen({\n    super.key,\n    this.embedded = false,\n    this.embeddedHeader,\n  });\n""",
              1,
          )

          old_build = re.compile(
              r"  @override\n  Widget build\(BuildContext context\) \{\n    final body = Column\(.*?\n  \}\n\n  Widget _buildBody\(\) \{",
              re.S,
          )
          new_build = r'''  @override
  Widget build(BuildContext context) {
    if (widget.embedded) {
      return ColoredBox(
        color: AppColors.paper,
        child: RefreshIndicator(
          onRefresh: _load,
          child: ListView(
            physics: const AlwaysScrollableScrollPhysics(
              parent: BouncingScrollPhysics(),
            ),
            padding: const EdgeInsets.only(bottom: 44),
            children: [
              if (widget.embeddedHeader != null) widget.embeddedHeader!,
              Padding(
                padding: const EdgeInsets.fromLTRB(16, 0, 8, 2),
                child: Row(
                  children: [
                    Expanded(
                      child: Text(
                        'Astreinte Sénior',
                        style: TextStyle(
                          color: AppColors.ink,
                          fontFamily: 'SpaceGrotesk',
                          fontSize: 18,
                          fontWeight: FontWeight.w900,
                        ),
                      ),
                    ),
                    IconButton(
                      tooltip: 'Photos des astreintes',
                      onPressed: _openPhotos,
                      icon: const Icon(Icons.photo_library_rounded, size: 20),
                      color: AppColors.brand,
                    ),
                    IconButton(
                      tooltip: 'Calendrier du mois',
                      onPressed: _loading ? null : _openMonthCalendar,
                      icon: const Icon(Icons.calendar_month_rounded, size: 20),
                      color: AppColors.brand,
                    ),
                    IconButton(
                      tooltip: 'Actualiser',
                      onPressed: _loading ? null : _load,
                      icon: const Icon(Icons.refresh_rounded, size: 20),
                      color: AppColors.brand,
                    ),
                  ],
                ),
              ),
              _SeniorWeekSelector(
                start: _weekStart,
                end: _weekEnd,
                onPrevious: _loading ? null : () => _changeWeek(-1),
                onNext: _loading ? null : () => _changeWeek(1),
              ),
              _SeniorDaySelector(
                weekStart: _weekStart,
                selectedIndex: _selectedDayIndex,
                onSelected: (i) => setState(() => _selectedDayIndex = i),
              ),
              _SeniorHospitalFilter(
                selectedHospital: _activeHospital,
                onChanged: _selectHospital,
              ),
              _SeniorServiceFilter(
                services: _availableServices,
                value: _selectedService,
                onChanged: (value) {
                  if (value != null) setState(() => _selectedService = value);
                },
              ),
              const SizedBox(height: 4),
              _buildEmbeddedContent(),
            ],
          ),
        ),
      );
    }

    final body = Column(
      children: [
        _SeniorWeekSelector(
          start: _weekStart,
          end: _weekEnd,
          onPrevious: _loading ? null : () => _changeWeek(-1),
          onNext: _loading ? null : () => _changeWeek(1),
        ),
        _SeniorDaySelector(
          weekStart: _weekStart,
          selectedIndex: _selectedDayIndex,
          onSelected: (i) => setState(() => _selectedDayIndex = i),
        ),
        _SeniorHospitalFilter(
          selectedHospital: _activeHospital,
          onChanged: _selectHospital,
        ),
        _SeniorServiceFilter(
          services: _availableServices,
          value: _selectedService,
          onChanged: (value) {
            if (value != null) setState(() => _selectedService = value);
          },
        ),
        const SizedBox(height: 4),
        Expanded(child: _buildBody()),
      ],
    );

    return Scaffold(
      backgroundColor: AppColors.paper,
      appBar: AppBar(
        title: GardeFlowTitle('Astreintes Séniors'),
        actions: [
          IconButton(
            tooltip: 'Photos',
            onPressed: _openPhotos,
            icon: const Icon(Icons.photo_library_rounded),
          ),
          IconButton(
            tooltip: 'Calendrier du mois',
            onPressed: _loading ? null : _openMonthCalendar,
            icon: const Icon(Icons.calendar_month_rounded),
          ),
          IconButton(
            tooltip: 'Actualiser',
            onPressed: _loading ? null : _load,
            icon: const Icon(Icons.refresh_rounded),
          ),
        ],
      ),
      body: body,
    );
  }

  Widget _buildEmbeddedContent() {
    if (_loading) {
      return const Padding(
        padding: EdgeInsets.symmetric(vertical: 54),
        child: Center(child: CircularProgressIndicator()),
      );
    }
    if (_error != null) {
      return Padding(
        padding: const EdgeInsets.fromLTRB(22, 28, 22, 20),
        child: Column(
          children: [
            const Icon(
              Icons.error_outline_rounded,
              size: 44,
              color: AppColors.danger,
            ),
            const SizedBox(height: 12),
            Text(_error!, textAlign: TextAlign.center),
            const SizedBox(height: 14),
            FilledButton.icon(
              onPressed: _load,
              icon: const Icon(Icons.refresh_rounded),
              label: const Text('Réessayer'),
            ),
          ],
        ),
      );
    }

    final rows = _visibleRows;
    if (rows.isEmpty) {
      return Padding(
        padding: const EdgeInsets.fromLTRB(24, 46, 24, 22),
        child: Column(
          children: [
            Icon(
              Icons.event_available_outlined,
              size: 50,
              color: AppColors.inkFaint,
            ),
            const SizedBox(height: 14),
            Text(
              'Aucune astreinte sénior le ${DateFormat('d MMMM yyyy', 'fr_FR').format(_selectedDay)}.',
              textAlign: TextAlign.center,
              style: TextStyle(color: AppColors.inkSoft),
            ),
          ],
        ),
      );
    }

    final grouped = <String, List<_SeniorOnCallRow>>{};
    for (final row in rows) {
      grouped.putIfAbsent(row.service, () => []).add(row);
    }
    final services = grouped.keys.toList()
      ..sort((a, b) => a.toLowerCase().compareTo(b.toLowerCase()));
    final isAdmin =
        context.watch<AppState>().currentUser?.role == UserRole.admin;

    return Padding(
      padding: const EdgeInsets.fromLTRB(
        AppSpace.lg,
        AppSpace.md,
        AppSpace.lg,
        0,
      ),
      child: Column(
        children: [
          for (final service in services)
            _SeniorServiceCard(
              service: service,
              rows: grouped[service]!,
              canAddContact: isAdmin,
              savingContacts: _savingContacts,
              onAddContact: _addContact,
            ),
        ],
      ),
    );
  }

  Widget _buildBody() {'''
          if 'Widget _buildEmbeddedContent()' not in text:
              text, count = old_build.subn(new_build, text, count=1)
              if count != 1:
                  raise SystemExit('Senior build block not found')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify intended layout
        shell: bash
        run: |
          set -euo pipefail
          grep -q "onDirectory: _tab == 3" source/lib/screens/home_screen.dart
          grep -q "embeddedHeader: _scrollingModeSwitch()" source/lib/screens/home_screen.dart
          ! grep -q "Ouvrir l’annuaire" source/lib/screens/home_screen.dart
          grep -q "final Widget? embeddedHeader" source/lib/screens/junior_oncall_screen.dart
          grep -q "Widget _buildEmbeddedContent()" source/lib/screens/junior_oncall_screen.dart
          grep -q "final Widget? embeddedHeader" source/lib/screens/senior_oncall_screen.dart
          grep -q "Widget _buildEmbeddedContent()" source/lib/screens/senior_oncall_screen.dart

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Patch already applied"
          else
            git config user.name "elghliaraqi-ops"
            git config user.email "elghliaraqi@gmail.com"
            git add source/lib/screens/home_screen.dart source/lib/screens/junior_oncall_screen.dart source/lib/screens/senior_oncall_screen.dart
            git commit -m "Improve Astreintes scrolling and directory access"
            git push origin HEAD:improve-astreintes-scroll-directory-20260930
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Analyze
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build Web release
        working-directory: source
        run: flutter build web --release --base-href "/GardeFlow/"
