name: One-time home feed visual refresh v2

on:
  push:
    branches:
      - style/home-feed-practice-cases-qcm-20261001
    paths:
      - '.github/workflows/one-time-home-feed-visual-refresh-v2.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: style/home-feed-practice-cases-qcm-20261001
          fetch-depth: 0

      - name: Fix icon and apply visual patch
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Icons\.clinical_notes_rounded/Icons.medical_information_rounded/g' .github/scripts/one_time_home_feed_visual_refresh.py
          python3 .github/scripts/one_time_home_feed_visual_refresh.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Format modified Dart files
        working-directory: source
        run: dart format lib/screens/practice_screen.dart lib/screens/clinical_cases_section.dart

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Analyze
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build web release
        working-directory: source
        run: flutter build web --release --base-href "/GardeFlow/" --build-name "12.0.0" --build-number "300"

      - name: Verify visual-only source scope
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only -- source)"
          echo "$CHANGED"
          test "$CHANGED" = $'source/lib/screens/clinical_cases_section.dart\nsource/lib/screens/practice_screen.dart' || test "$CHANGED" = $'source/lib/screens/practice_screen.dart\nsource/lib/screens/clinical_cases_section.dart'

      - name: Remove one-time files
        run: |
          rm -f .github/scripts/one_time_home_feed_visual_refresh.py
          rm -f .github/workflows/one-time-home-feed-visual-refresh.yml
          rm -f .github/workflows/one-time-home-feed-visual-refresh-v2.yml

      - name: Commit validated visual refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: rendre Practice, cas cliniques et QCM visibles sur l'accueil"
          git push origin HEAD:style/home-feed-practice-cases-qcm-20261001
