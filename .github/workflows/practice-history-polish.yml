name: Practice history polish

on:
  push:
    branches:
      - feature-practice-history-polish-20260930
    paths:
      - '.github/workflows/practice-history-polish.yml'
      - '.github/scripts/apply_practice_history_polish.py'
      - 'source/lib/screens/practice_screen.dart'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature-practice-history-polish-20260930

      - name: Apply visual patch
        run: python3 .github/scripts/apply_practice_history_polish.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Format Practice screen
        run: dart format source/lib/screens/practice_screen.dart

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Analyze code
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build web release
        working-directory: source
        run: flutter build web --release --base-href "/GardeFlow/"

      - name: Commit validated source
        shell: bash
        run: |
          if git diff --quiet -- source/lib/screens/practice_screen.dart; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/lib/screens/practice_screen.dart
          git commit -m 'style: polish Practice history screen'
          git push origin HEAD:feature-practice-history-polish-20260930
