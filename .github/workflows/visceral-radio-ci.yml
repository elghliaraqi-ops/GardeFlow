name: Validate private Viscéral Radio
on:
  pull_request:
    branches: [main]
    paths:
      - 'source/lib/screens/practice_visceral_radio_screen.dart'
      - 'source/lib/widgets/practice_keyword_text.dart'
      - 'source/lib/widgets/practice_clinical_dossier.dart'
      - 'source/test/practice_keywords_everywhere_test.dart'
      - 'source/lib/widgets/practice_surgical_techniques.dart'
      - 'source/test/practice_surgical_techniques_test.dart'
      - 'source/lib/screens/practice_daily_screen.dart'
      - 'source/lib/screens/practice_progressive_cases_screen.dart'
      - 'source/lib/screens/clinical_cases_section.dart'
      - 'source/test/practice_keyword_text_test.dart'
      - 'source/lib/screens/visceral_radio_*.dart'
      - 'source/lib/screens/practice_screen.dart'
      - 'source/test/practice_visceral_radio_test.dart'
      - 'source/test/visceral_radio_course_widgets_test.dart'
      - 'source/supabase/functions/generate-visceral-radio/**'
      - '.github/workflows/visceral-radio-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - working-directory: source
        run: flutter pub get
      - working-directory: source
        run: dart format lib/screens/practice_visceral_radio_screen.dart lib/screens/visceral_radio_course_widgets.dart lib/screens/visceral_radio_fiche_view.dart
      - working-directory: source
        run: flutter analyze lib/screens/practice_visceral_radio_screen.dart lib/screens/visceral_radio_course_widgets.dart lib/screens/visceral_radio_fiche_view.dart lib/screens/practice_screen.dart lib/widgets/practice_keyword_text.dart lib/widgets/practice_surgical_techniques.dart lib/widgets/practice_clinical_dossier.dart lib/screens/practice_daily_screen.dart lib/screens/practice_progressive_cases_screen.dart lib/screens/clinical_cases_section.dart --no-fatal-infos --no-fatal-warnings
      - working-directory: source
        run: flutter test test/practice_keywords_everywhere_test.dart test/practice_clinical_dossier_test.dart test/practice_surgical_techniques_test.dart test/practice_keyword_text_test.dart test/practice_visceral_radio_test.dart test/visceral_radio_course_widgets_test.dart

  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check private Edge Function and JSON contract
        run: deno check source/supabase/functions/generate-visceral-radio/index.ts source/supabase/functions/generate-visceral-radio/generation_contract_test.ts source/supabase/functions/generate-visceral-radio/groq_transport.ts
      - name: Type-check multi-source preview module
        run: deno check source/supabase/functions/generate-visceral-radio/medical_image_previews.ts
      - name: Test external medical image search terms
        run: deno test source/supabase/functions/generate-visceral-radio/medical_image_previews_test.ts
      - name: Verify mirrored Edge entrypoint, contracts and transport
        run: |
          for file in index.ts generation_contract.ts groq_transport.ts; do
            cmp "source/supabase/functions/generate-visceral-radio/$file" "supabase/functions/generate-visceral-radio/$file"
          done
      - name: Test JSON 400 recovery, one-call success, residency depth and quota
        run: deno test source/supabase/functions/generate-visceral-radio/groq_transport_test.ts
      - name: Test four Groq prompt/JSON contracts (no API calls)
        run: deno test source/supabase/functions/generate-visceral-radio/surgical_techniques_test.ts source/supabase/functions/generate-visceral-radio/emc_context_test.ts source/supabase/functions/generate-visceral-radio/generation_contract_test.ts source/supabase/functions/generate-visceral-radio/residency_course_context_test.ts
