name: Validate private Viscéral Radio
on:
  pull_request:
    branches: [main]
    paths:
      - 'source/lib/screens/practice_visceral_radio_screen.dart'
      - 'source/lib/screens/practice_screen.dart'
      - 'source/test/practice_visceral_radio_test.dart'
      - 'source/supabase/functions/generate-visceral-radio/**'
      - '.github/workflows/visceral-radio-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - working-directory: source
        run: flutter pub get
      - working-directory: source
        run: dart format lib/screens/practice_visceral_radio_screen.dart
      - working-directory: source
        run: flutter analyze lib/screens/practice_visceral_radio_screen.dart lib/screens/practice_screen.dart --no-fatal-infos --no-fatal-warnings
      - working-directory: source
        run: flutter test test/practice_visceral_radio_test.dart

  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check private Edge Function and JSON contract
        run: deno check source/supabase/functions/generate-visceral-radio/index.ts source/supabase/functions/generate-visceral-radio/generation_contract_test.ts
      - name: Test four Groq prompt/JSON contracts (no API calls)
        run: deno test source/supabase/functions/generate-visceral-radio/generation_contract_test.ts
