name: Apply Practice Hub Refactor V3

on:
  push:
    branches:
      - ux/practice-hub-v12
    paths:
      - .github/workflows/apply-practice-hub-v3.yml

permissions:
  contents: write

jobs:
  patch-practice:
    if: "${{ github.event.head_commit.message == 'chore add practice runner v3' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/practice-hub-v12
          fetch-depth: 0

      - name: Execute staged Practice patch
        shell: bash
        run: |
          python <<'RUNNER'
          from pathlib import Path

          raw = Path('.github/workflows/apply-practice-hub.yml').read_text(encoding='utf-8')
          marker = "          python <<'PY'\n"
          start = raw.index(marker) + len(marker)
          end = raw.index("\n          PY\n", start)
          block = raw[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          exec(compile(script, 'practice_hub_patch.py', 'exec'), {'__name__': '__main__'})
          RUNNER

      - name: Verify patch scope
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "source/lib/screens/practice_screen.dart"
          ! grep -Eq 'FontWeight\.w(650|750|850)' source/lib/screens/practice_screen.dart

      - name: Commit Practice redesign
        shell: bash
        run: |
          git config user.name "elghliaraqi-ops"
          git config user.email "elghliaraqi@gmail.com"
          git add source/lib/screens/practice_screen.dart
          git rm .github/workflows/apply-practice-hub.yml
          git rm .github/workflows/apply-practice-hub-v2.yml
          git rm .github/workflows/apply-practice-hub-v3.yml
          git commit -m "feat practice hub redesign"
          git push origin HEAD:ux/practice-hub-v12
