name: GardeFlow combined integration builds (no deployment)

on:
  pull_request:
    branches: [main]
    paths:
      - 'source/**'
      - '.github/workflows/integration-release-validation.yml'

permissions:
  contents: read

concurrency:
  group: gardeflow-integration-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    if: github.head_ref == 'feat/r6-two-reader-buttons-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Prepare Firebase and canonical Android alarms
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/GardeFlow_android_v11_6_0_official_pdf_auto_import.zip"
          test -f "$ZIP"
          rm -rf /tmp/gardeflow-integration-firebase
          mkdir -p /tmp/gardeflow-integration-firebase
          unzip -q "$ZIP" -d /tmp/gardeflow-integration-firebase
          GS="$(find /tmp/gardeflow-integration-firebase -type f -name google-services.json -print -quit)"
          test -n "$GS"
          cp "$GS" google-services.json
          rm -rf android
          flutter create --no-pub --platforms=android --org com.huim6 --project-name huim6_planning .
          cp google-services.json android/app/google-services.json
          dart tool/configure_android.dart
          python3 tool/install_alarm_activity.py
          python3 tool/install_system_alarm_bridge.py
          python3 tool/harden_alarm_fallback.py
          grep -Fq 'android.permission.SCHEDULE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml
          grep -Fq 'setFullScreenIntent(fullScreenPending, true)' android/app/src/main/kotlin/com/huim6/huim6_planning/AlarmActivity.kt
      - name: Build non-deployed release APK
        run: |
          flutter pub get
          flutter build apk --release --build-name 12.0.5 --build-number 305
          test -f build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-v12.0.5-two-reader-buttons-Android-APK
          path: source/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  web-release:
    if: github.head_ref == 'feat/r6-two-reader-buttons-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Build non-deployed web release
        run: |
          flutter config --enable-web
          if [ ! -f web/index.html ]; then
            flutter create --no-pub --platforms=web --project-name huim6_planning .
          fi
          flutter pub get
          flutter build web --release --base-href "/GardeFlow/" --build-name 12.0.5 --build-number 305
          test -f build/web/main.dart.js
          test -f build/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-12.0.5-lockfile
          path: source/pubspec.lock
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-v12.0.5-two-reader-buttons-Web
          path: source/build/web
          if-no-files-found: error
          retention-days: 30

  ios-unsigned:
    if: github.head_ref == 'feat/r6-two-reader-buttons-20261008'
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Build non-deployed unsigned iOS release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios
          flutter create --no-pub --platforms=ios --org com.huim6 --project-name huim6_planning .
          dart tool/configure_ios.dart
          flutter pub get
          if [ -f ios/Podfile ]; then
            (cd ios && pod install --repo-update)
          fi
          flutter build ios --release --no-codesign --build-name 12.0.5 --build-number 305
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/ios/integration-unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/integration-unsigned/Payload/GardeFlow.app
          (cd build/ios/integration-unsigned && zip -qry GardeFlow-R6-Groq-unsigned.ipa Payload)
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app build/ios/integration-unsigned/GardeFlow-R6-Groq-unsigned.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-v12.0.5-two-reader-buttons-iOS-unsigned
          path: |
            source/build/ios/integration-unsigned/GardeFlow-R6-Groq-unsigned.ipa
            source/build/ios/integration-unsigned/GardeFlow-R6-Groq-unsigned.app.zip
          if-no-files-found: error
          retention-days: 30
