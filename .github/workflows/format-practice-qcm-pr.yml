name: Temporary Format Practice QCM PR
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/format-practice-qcm-pr.yml'
      - 'source/lib/screens/practice_daily_screen.dart'
      - 'source/lib/screens/practice_progressive_cases_screen.dart'
      - 'source/lib/screens/clinical_cases_section.dart'
      - 'source/lib/widgets/practice_qcm_medical_illustration.dart'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Dart format changed Practice files
        working-directory: source
        run: |
          dart format lib/screens/practice_daily_screen.dart lib/screens/practice_progressive_cases_screen.dart lib/screens/clinical_cases_section.dart lib/widgets/practice_qcm_medical_illustration.dart test/practice_qcm_medical_illustration_test.dart
      - name: Commit formatted source if necessary
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add source/lib/screens/practice_daily_screen.dart source/lib/screens/practice_progressive_cases_screen.dart source/lib/screens/clinical_cases_section.dart source/lib/widgets/practice_qcm_medical_illustration.dart source/test/practice_qcm_medical_illustration_test.dart
          if git diff --cached --quiet; then
            echo "Dart formatting already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(practice): format shared QCM medical image viewers with dart format"
          git push origin "HEAD:$BRANCH"
