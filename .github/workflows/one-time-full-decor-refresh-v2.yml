name: One-time full app decor refresh v2

on:
  push:
    branches:
      - style/full-app-decor-refresh-20261001
    paths:
      - '.github/workflows/one-time-full-decor-refresh-v2.yml'

permissions:
  contents: write

jobs:
  decorate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: style/full-app-decor-refresh-20261001
          fetch-depth: 0

      - name: Apply screen-by-screen decorative refresh
        run: python3 ci/apply_full_decor_refresh.py

      - name: Normalize Flutter-compatible decorative icons
        run: sed -i 's/Icons.stethoscope_rounded/Icons.medical_services_rounded/g' source/lib/theme/screen_decor.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format decorated source
        working-directory: source
        run: dart format lib/theme/screen_decor.dart lib/screens

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Analyze Flutter source
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build Web release
        working-directory: source
        run: flutter build web --release --base-href '/GardeFlow/' --build-name '12.0.0' --build-number '300'

      - name: Remove generated Flutter artifacts
        run: |
          rm -rf source/.dart_tool source/build
          rm -f source/.flutter-plugins source/.flutter-plugins-dependencies
          git checkout -- source/pubspec.lock 2>/dev/null || true

      - name: Remove one-time CI helpers
        run: |
          rm -f ci/apply_full_decor_refresh.py
          rm -f .github/workflows/one-time-full-decor-refresh.yml
          rm -f .github/workflows/one-time-full-decor-refresh-v2.yml

      - name: Verify final source scope
        run: |
          echo 'Final changed paths:'
          git status --short
          bad=$(git status --porcelain | awk '{print $2}' | grep -Ev '^source/lib/(screens/.*\.dart|theme/screen_decor\.dart)$' || true)
          if [ -n "$bad" ]; then
            echo 'Unexpected changed paths:'
            echo "$bad"
            exit 1
          fi
          test -f source/lib/theme/screen_decor.dart
          grep -R "DecorScaffold(scene:" source/lib/screens --include='*.dart' >/dev/null
          grep -q "DecorSectionBanner" source/lib/screens/clinical_cases_section.dart
          grep -q "DecorSectionBanner" source/lib/screens/daily_news_section.dart
          grep -q "DecorSheetLead" source/lib/screens/exchange_request_sheet.dart

      - name: Commit validated decorative refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 1
          fi
          git commit -m 'style: enrichir tous les écrans avec des décors thématiques'
          git push origin HEAD:style/full-app-decor-refresh-20261001
