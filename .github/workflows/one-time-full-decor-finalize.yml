name: One-time full app decor finalize

on:
  push:
    branches:
      - style/full-app-decor-refresh-20261001
    paths:
      - '.github/workflows/one-time-full-decor-finalize.yml'

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: style/full-app-decor-refresh-20261001
          fetch-depth: 0

      - name: Apply screen-by-screen decorative refresh
        run: python3 ci/apply_full_decor_refresh.py

      - name: Normalize Flutter-compatible decorative icons
        run: sed -i 's/Icons.stethoscope_rounded/Icons.medical_services_rounded/g' source/lib/theme/screen_decor.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format shared decor layer only
        working-directory: source
        run: dart format lib/theme/screen_decor.dart

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Analyze Flutter source
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build Web release
        working-directory: source
        run: flutter build web --release --base-href '/GardeFlow/' --build-name '12.0.0' --build-number '300'

      - name: Remove generated Flutter artifacts
        run: |
          rm -rf source/.dart_tool source/build
          rm -f source/.flutter-plugins source/.flutter-plugins-dependencies
          git checkout -- source/pubspec.lock 2>/dev/null || true

      - name: Remove all one-time helpers
        run: |
          rm -f ci/apply_full_decor_refresh.py
          rm -f .github/workflows/one-time-full-decor-refresh.yml
          rm -f .github/workflows/one-time-full-decor-refresh-v2.yml
          rm -f .github/workflows/one-time-full-decor-finalize.yml

      - name: Verify screen-by-screen coverage
        run: |
          test -f source/lib/theme/screen_decor.dart
          for f in \
            admin_disciplinary_assignment_screen.dart \
            admin_password_reset_screen.dart \
            admin_screen.dart \
            announcements_screen.dart \
            application_settings_screen.dart \
            astreinte_screen.dart \
            audit_screen.dart \
            auth_screen.dart \
            directory_screen.dart \
            forgot_password_screen.dart \
            home_screen.dart \
            junior_oncall_screen.dart \
            notifications_screen.dart \
            official_planning_screen.dart \
            practice_qcm_screen.dart \
            practice_screen.dart \
            profile_screen.dart \
            senior_oncall_screen.dart \
            senior_roster_review_screen.dart \
            settings_screen.dart \
            splash_screen.dart; do
              grep -q 'DecorScaffold(scene:' "source/lib/screens/$f" || { echo "Missing decor in $f"; exit 1; }
          done
          grep -q 'DecorSectionBanner' source/lib/screens/clinical_cases_section.dart
          grep -q 'ScreenDecorScene.practice' source/lib/screens/clinical_cases_section.dart
          grep -q 'DecorSectionBanner' source/lib/screens/daily_news_section.dart
          grep -q 'ScreenDecorScene.news' source/lib/screens/daily_news_section.dart
          grep -q 'DecorSheetLead' source/lib/screens/exchange_request_sheet.dart
          grep -q 'ScreenDecorScene.planning' source/lib/screens/exchange_request_sheet.dart
          echo 'All 24 screen/section files are decor-covered.'

      - name: Stage and verify final net scope
        run: |
          git add -A
          echo 'Staged files for final commit:'
          git diff --cached --name-status
          bad=$(git diff --cached --name-only | grep -Ev '^(source/lib/screens/.*\.dart|source/lib/theme/screen_decor\.dart|\.github/workflows/one-time-full-decor-refresh\.yml|\.github/workflows/one-time-full-decor-refresh-v2\.yml|\.github/workflows/one-time-full-decor-finalize\.yml|ci/apply_full_decor_refresh\.py)$' || true)
          if [ -n "$bad" ]; then
            echo 'Unexpected changed paths:'
            echo "$bad"
            exit 1
          fi

      - name: Commit validated decorative refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: enrichir tous les écrans avec des décors thématiques'
          git push origin HEAD:style/full-app-decor-refresh-20261001
