name: One-time home cards sky UI

on:
  push:
    branches:
      - feat/home-cards-sky-ui
    paths:
      - .github/workflows/one-time-home-cards-sky-ui.yml
      - ci/patch_home_cards_sky_ui.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-cards-sky-ui
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply premium home card redesign
        run: |
          set -euo pipefail
          # Normalize the generated Dart snippet before applying it.
          sed -i 's/FontWeight\.w650/FontWeight.w600/g' ci/patch_home_cards_sky_ui.py
          sed -i 's/^        minHeight: 78,$/        constraints: const BoxConstraints(minHeight: 78),/' ci/patch_home_cards_sky_ui.py
          python3 ci/patch_home_cards_sky_ui.py
          dart format source/lib/screens/home_screen.dart
          git diff --check

      - name: Validate Flutter source
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/screens/home_screen.dart
          flutter test test/mobile_layout_test.dart

      - name: Commit validated source changes
        run: |
          set -euo pipefail
          if git diff --quiet -- source/lib/screens/home_screen.dart; then
            echo 'No source change required.'
            exit 0
          fi
          git config user.name 'GardeFlow CI'
          git config user.email 'actions@users.noreply.github.com'
          git add source/lib/screens/home_screen.dart
          git commit -m 'feat: implement dynamic sky cards on home'
          git push origin HEAD:feat/home-cards-sky-ui
