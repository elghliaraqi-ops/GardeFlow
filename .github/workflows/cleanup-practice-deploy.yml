name: Cleanup Practice deployment helpers

on:
  push:
    branches:
      - feature-practice-qcm-notifications-20260930
    paths:
      - '.github/workflows/cleanup-practice-deploy.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-practice-qcm-notifications-20260930

      - name: Fix migration signature and remove temporary CI helpers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ci/v12_practice/practice_qcm5_notifications.sql')
          s = p.read_text(encoding='utf-8')
          old = '  p_position smallint,\n'
          if old not in s and '  p_position integer,\n' not in s:
              raise SystemExit('Unexpected migration signature')
          s = s.replace(old, '  p_position integer,\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git rm -f \
            .github/scripts/apply_practice_push_backend.py \
            .github/scripts/apply_practice_qcm5_notifications.py \
            .github/scripts/finalize_practice_qcm5_notifications.py \
            .github/workflows/practice-qcm5-finalize.yml \
            .github/workflows/practice-qcm5-notifications.yml \
            .github/workflows/cleanup-practice-deploy.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/v12_practice/practice_qcm5_notifications.sql
          git commit -m 'chore: finalize Practice deployment sources'
          git push origin HEAD:feature-practice-qcm-notifications-20260930
