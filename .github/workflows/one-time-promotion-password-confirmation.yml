name: One-time promotion password confirmation

on:
  push:
    branches:
      - audit-fixes-v11.6.70
    paths:
      - '.github/workflows/one-time-promotion-password-confirmation.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-v11.6.70
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply source patch
        run: |
          set -euo pipefail
          python3 ci/patch_promotion_password_confirmation.py
          dart format \
            source/lib/screens/admin_screen.dart \
            source/lib/state/app_state.dart \
            source/lib/services/supabase_backend_service.dart
          git diff --check

      - name: Validate Flutter
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/intern_promotions_test.dart
          dart analyze \
            lib/screens/admin_screen.dart \
            lib/state/app_state.dart \
            lib/services/supabase_backend_service.dart

      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name 'GardeFlow CI'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            source/lib/screens/admin_screen.dart \
            source/lib/state/app_state.dart \
            source/lib/services/supabase_backend_service.dart
          git commit -m 'feat: require password before adding promotion'
          git push origin HEAD:audit-fixes-v11.6.70
