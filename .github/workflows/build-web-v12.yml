name: Build & Deploy GardeFlow Web V12

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v12-optimisee
    paths:
      - '.github/workflows/build-web-v12.yml'
      - 'source/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gardeflow-v12-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-practice-ui:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify generation request
        id: request
        shell: bash
        run: |
          if [ -f .github/scripts/move_cases_and_game_qcm.py ] && [ -f .github/scripts/move_cases_trigger.txt ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.request.outputs.enabled == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Practice/cases/QCM changes
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git switch -C generated/practice-cases-qcm-20261001
          python .github/scripts/move_cases_and_game_qcm.py
          sed -i 's/FontWeight\.w650/FontWeight.w600/g' source/lib/screens/clinical_cases_section.dart
          git diff --check

      - name: Install dependencies
        if: steps.request.outputs.enabled == 'true'
        working-directory: source
        run: flutter pub get

      - name: Run tests
        if: steps.request.outputs.enabled == 'true'
        working-directory: source
        run: flutter test

      - name: Analyze Flutter code
        if: steps.request.outputs.enabled == 'true'
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build Flutter Web release
        if: steps.request.outputs.enabled == 'true'
        working-directory: source
        run: flutter build web --release --base-href "/GardeFlow/" --build-name "12.0.0" --build-number "301"

      - name: Commit and push validated source branch
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- source/pubspec.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            source/lib/screens/home_screen.dart \
            source/lib/screens/practice_screen.dart \
            source/lib/screens/practice_qcm_screen.dart \
            source/lib/screens/clinical_cases_section.dart \
            source/lib/screens/clinical_cases_screen.dart
          git diff --cached --check
          git commit -m "feat: déplacer les cas cliniques dans Practice et gamifier les QCM"
          git push --force origin generated/practice-cases-qcm-20261001

  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PROJECT_DIR: source
      APP_VERSION: 12.0.0
      BUILD_NUMBER: "300"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify canonical V12 source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 12.0.0+300$' pubspec.yaml
          test -f lib/main.dart

      - name: Generate web platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter config --enable-web
          if [ ! -f web/index.html ]; then
            flutter create --no-pub --platforms=web --project-name huim6_planning .
          fi

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Analyze Flutter code
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build Flutter Web release
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build web --release \
            --base-href "/GardeFlow/" \
            --build-name "$APP_VERSION" \
            --build-number "$BUILD_NUMBER"

          BUILD_ID="${GITHUB_SHA:0:12}"
          python3 - "$BUILD_ID" <<'PY'
          from pathlib import Path
          import sys

          build_id = sys.argv[1]
          for relative in ('build/web/index.html', 'build/web/flutter_bootstrap.js'):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              marker = '__GARDEFLOW_BUILD_ID__'
              if marker not in text:
                  raise SystemExit(f'Missing cache-bust marker in {relative}')
              path.write_text(text.replace(marker, build_id), encoding='utf-8')

          Path('build/web/build-id.txt').write_text(build_id + '\n', encoding='utf-8')
          PY

          test -f build/web/index.html
          test -f build/web/main.dart.js
          test -f build/web/flutter_bootstrap.js
          grep -Fq "flutter_bootstrap.js?build=$BUILD_ID" build/web/index.html
          grep -Fq 'main.dart.js?build=${buildId}' build/web/flutter_bootstrap.js
          grep -qx "$BUILD_ID" build/web/build-id.txt
          touch build/web/.nojekyll

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-v12.0.0-web
          path: source/build/web
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/build/web

  deploy-pages:
    if: github.ref_name == 'main'
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

