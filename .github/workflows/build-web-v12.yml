name: Build & Deploy GardeFlow Web V12

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v12-optimisee
    paths:
      - '.github/workflows/build-web-v12.yml'
      - 'source/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gardeflow-v12-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PROJECT_DIR: source
      APP_VERSION: 12.0.5
      BUILD_NUMBER: "305"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Verify canonical V12 source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 12.0.5+305$' pubspec.yaml
          test -f lib/main.dart
          grep -Fq "label: const Text('Relire avec pdfrx')" lib/screens/official_planning_screen.dart
          grep -Fq "label: const Text('Relire avec Groq')" lib/screens/official_planning_screen.dart

      - name: Generate web platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter config --enable-web
          if [ ! -f web/index.html ]; then
            flutter create --no-pub --platforms=web --project-name huim6_planning .
          fi

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Analyze Flutter code
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build Flutter Web release
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build web --release \
            --base-href "/GardeFlow/" \
            --build-name "$APP_VERSION" \
            --build-number "$BUILD_NUMBER"

          BUILD_ID="${GITHUB_SHA:0:12}"
          python3 - "$BUILD_ID" <<'PY'
          from pathlib import Path
          import sys

          build_id = sys.argv[1]
          for relative in ('build/web/index.html', 'build/web/flutter_bootstrap.js'):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              marker = '__GARDEFLOW_BUILD_ID__'
              if marker not in text:
                  raise SystemExit(f'Missing cache-bust marker in {relative}')
              path.write_text(text.replace(marker, build_id), encoding='utf-8')

          Path('build/web/build-id.txt').write_text(build_id + '\n', encoding='utf-8')
          PY

          test -f build/web/index.html
          test -f build/web/main.dart.js
          test -f build/web/flutter_bootstrap.js
          grep -Fq "flutter_bootstrap.js?build=$BUILD_ID" build/web/index.html
          grep -Fq 'main.dart.js?build=${buildId}' build/web/flutter_bootstrap.js
          grep -qx "$BUILD_ID" build/web/build-id.txt
          touch build/web/.nojekyll

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-v12.0.5-web
          path: source/build/web
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/build/web

  deploy-pages:
    if: github.ref_name == 'main'
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


