name: GardeFlow hardening guardrails

on:
  pull_request:
  push:
    branches:
      - hardening-20261003
      - main

permissions:
  contents: read

jobs:
  repository-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject edits to legacy top-level lib source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "${{ github.event.before || github.event.pull_request.base.sha }}" "${{ github.sha }}" 2>/dev/null | grep -E '^lib/'; then
            echo 'ERROR: top-level lib/ is legacy. Modify source/lib/ only.' >&2
            exit 1
          fi
          echo 'Canonical source guard passed: source/lib/ only.'
