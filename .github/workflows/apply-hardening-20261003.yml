name: Apply GardeFlow hardening patch

on:
  push:
    branches:
      - hardening-20261003
    paths:
      - 'tools/apply_hardening_20261003.py'
      - '.github/workflows/apply-hardening-20261003.yml'

permissions:
  contents: write

concurrency:
  group: gardeflow-hardening-autopatch
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hardening-20261003
          fetch-depth: 0

      - name: Apply guarded source transformations
        run: python3 tools/apply_hardening_20261003.py

      - name: Write canonical business rules
        shell: bash
        run: |
          cat > source/lib/config/business_rules.dart <<'DART'
          /// Règles métier GardeFlow centralisées.
          ///
          /// L'interface ne doit jamais être la seule barrière : les mêmes
          /// contraintes critiques sont aussi imposées côté PostgreSQL/RLS/RPC.
          class BusinessRules {
            BusinessRules._();

            static const bool sameHospitalRequired = true;
            static const bool sameGradeRequiredForExchange = false;
            static const bool firstYearSamePromotionRequiredForEmergency = true;

            /// Toute demande d'échange impliquant une garde de Service impose
            /// que les deux médecins appartiennent au même service.
            static bool exchangeRequiresSameService(
              String sourceShiftId,
              String? targetShiftId,
            ) =>
                sourceShiftId.startsWith('service-') ||
                (targetShiftId?.startsWith('service-') ?? false);

            /// La restriction de promotion de la première année ne s'applique
            /// qu'aux demandes impliquant les Urgences.
            static bool requestInvolvesEmergency(
              String sourceShiftId,
              String? targetShiftId,
            ) =>
                sourceShiftId.startsWith('urg-') ||
                (targetShiftId?.startsWith('urg-') ?? false);

            static const int minimumRestHours = 0;
          }
          DART

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Format changed Dart files
        working-directory: source
        run: dart format lib/config/business_rules.dart lib/state/app_state.dart lib/services/supabase_backend_service.dart lib/models/planning_month.dart lib/screens/home_screen.dart lib/screens/admin_screen.dart

      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'GardeFlow Hardening Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add source/lib
          git commit -m 'fix: harden planning, exchange and PDF rules [hardening-applied]'
          git push origin HEAD:hardening-20261003
