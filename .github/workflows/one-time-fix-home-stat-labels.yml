name: One-time home stat label fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-fix-home-stat-labels.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix compact home stat labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('source/lib/screens/home_screen.dart')
          text = path.read_text()
          start_marker = 'class _HomeStatPill extends StatelessWidget {'
          end_marker = 'class _HomeQuickRow extends StatelessWidget {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = r'''class _HomeStatPill extends StatelessWidget {
            final IconData icon;
            final int value;
            final String label;

            const _HomeStatPill({
              required this.icon,
              required this.value,
              required this.label,
            });

            @override
            Widget build(BuildContext context) {
              return Container(
                constraints: const BoxConstraints(minHeight: 60),
                padding: const EdgeInsets.symmetric(horizontal: 7, vertical: 8),
                decoration: BoxDecoration(
                  gradient: LinearGradient(
                    begin: Alignment.topLeft,
                    end: Alignment.bottomRight,
                    colors: [
                      Colors.white.withOpacity(0.18),
                      Colors.white.withOpacity(0.085),
                    ],
                  ),
                  borderRadius: BorderRadius.circular(17),
                  border: Border.all(color: Colors.white.withOpacity(0.18)),
                  boxShadow: [
                    BoxShadow(
                      color: Colors.black.withOpacity(0.08),
                      blurRadius: 8,
                      offset: const Offset(0, 4),
                    ),
                  ],
                ),
                child: Row(
                  children: [
                    Container(
                      width: 27,
                      height: 27,
                      alignment: Alignment.center,
                      decoration: BoxDecoration(
                        color: Colors.white.withOpacity(0.13),
                        borderRadius: BorderRadius.circular(9),
                      ),
                      child: Icon(icon, color: Colors.white, size: 15),
                    ),
                    const SizedBox(width: 5),
                    Expanded(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          FittedBox(
                            fit: BoxFit.scaleDown,
                            alignment: Alignment.centerLeft,
                            child: Text(
                              '$value',
                              maxLines: 1,
                              softWrap: false,
                              style: const TextStyle(
                                color: Colors.white,
                                fontFamily: 'SpaceGrotesk',
                                fontSize: 18,
                                height: 1,
                                fontWeight: FontWeight.w900,
                              ),
                            ),
                          ),
                          const SizedBox(height: 3),
                          SizedBox(
                            width: double.infinity,
                            child: FittedBox(
                              fit: BoxFit.scaleDown,
                              alignment: Alignment.centerLeft,
                              child: Text(
                                label,
                                maxLines: 1,
                                softWrap: false,
                                style: TextStyle(
                                  color: Colors.white.withOpacity(0.88),
                                  fontSize: 9.5,
                                  fontWeight: FontWeight.w800,
                                ),
                              ),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

'''

          path.write_text(text[:start] + replacement + text[end:])
          PY

          grep -q "label: 'Ce mois'" source/lib/screens/home_screen.dart
          grep -q "label: 'Urgences'" source/lib/screens/home_screen.dart
          grep -q "label: 'Service'" source/lib/screens/home_screen.dart
          grep -q "width: double.infinity" source/lib/screens/home_screen.dart
          grep -q "fit: BoxFit.scaleDown" source/lib/screens/home_screen.dart

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-fix-home-stat-labels.yml
          git config user.name "elghliaraqi-ops"
          git config user.email "elghliaraqi@gmail.com"
          git add source/lib/screens/home_screen.dart .github/workflows/one-time-fix-home-stat-labels.yml
          git commit -m "Fix home dashboard stat labels on narrow screens"
          git push origin HEAD:main
