name: One-time final UI fixes 20260923

on:
  push:
    branches:
      - audit-fixes-v11.6.70
    paths:
      - '.github/workflows/one-time-final-ui-fixes-20260923.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-v11.6.70
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply final UI fixes
        run: |
          set -euo pipefail
          python3 ci/patch_final_ui_fixes_20260923.py
          dart format \
            source/lib/screens/home_screen.dart \
            source/lib/screens/daily_news_section.dart \
            source/lib/screens/junior_oncall_screen.dart \
            source/lib/screens/senior_oncall_screen.dart \
            source/lib/screens/astreinte_screen.dart \
            source/lib/screens/directory_screen.dart \
            source/lib/screens/auth_screen.dart
          git diff --check

      - name: Validate Flutter
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/intern_promotions_test.dart
          dart analyze --no-fatal-warnings \
            lib/screens/home_screen.dart \
            lib/screens/daily_news_section.dart \
            lib/screens/junior_oncall_screen.dart \
            lib/screens/senior_oncall_screen.dart \
            lib/screens/astreinte_screen.dart \
            lib/screens/directory_screen.dart \
            lib/screens/auth_screen.dart

      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name 'GardeFlow CI'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            source/lib/screens/home_screen.dart \
            source/lib/screens/daily_news_section.dart \
            source/lib/screens/junior_oncall_screen.dart \
            source/lib/screens/senior_oncall_screen.dart \
            source/lib/screens/astreinte_screen.dart \
            source/lib/screens/directory_screen.dart \
            source/lib/screens/auth_screen.dart
          git commit -m 'fix: polish final UI details'
          git push origin HEAD:audit-fixes-v11.6.70
