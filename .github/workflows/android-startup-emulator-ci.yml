name: Android Startup Emulator Smoke Test
on:
  pull_request:
    branches: [main]
    paths:
      - 'source/lib/main.dart'
      - 'source/lib/state/app_state.dart'
      - 'source/test/android_startup_resilience_test.dart'
      - '.github/workflows/android-startup-emulator-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: source
      - run: dart format --output=none lib/main.dart test/android_startup_resilience_test.dart
        working-directory: source
      - run: flutter test test/android_startup_resilience_test.dart
        working-directory: source
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/state/app_state.dart test/android_startup_resilience_test.dart
        working-directory: source

  android-cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Configure Firebase and native Android platform
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p /tmp/gardeflow-android-config
          unzip -q "$GITHUB_WORKSPACE/GardeFlow_android_v11_6_0_official_pdf_auto_import.zip" -d /tmp/gardeflow-android-config
          GOOGLE_SERVICES="$(find /tmp/gardeflow-android-config -name google-services.json -type f -print -quit)"
          test -n "$GOOGLE_SERVICES"
          flutter create --no-pub --platforms=android --org com.huim6 --project-name huim6_planning .
          cp "$GOOGLE_SERVICES" android/app/google-services.json
          dart tool/configure_android.dart
          python3 tool/install_alarm_activity.py
          python3 tool/install_system_alarm_bridge.py
          python3 tool/harden_alarm_fallback.py
          flutter pub get
          flutter build apk --release --build-name 12.0.7 --build-number 307
          test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Enable emulator hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then
            echo "::error::KVM is unavailable on this GitHub runner; cannot validate APK startup here."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Boot APK in Android emulator, assert login is reachable
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p android-startup-report
            adb logcat -c
            adb install -r source/build/app/outputs/flutter-apk/app-release.apk
            adb shell am start -n com.huim6.huim6_planning/.MainActivity
            success=0
            for i in $(seq 1 24); do
              sleep 5
              adb shell uiautomator dump /sdcard/gardeflow-ui.xml >/dev/null 2>&1 || true
              adb shell cat /sdcard/gardeflow-ui.xml > /tmp/gardeflow-screen.xml 2>/dev/null || true
              if grep -Eq 'Se connecter|Connexion|Numéro de téléphone' /tmp/gardeflow-screen.xml 2>/dev/null; then
                success=1
                break
              fi
            done
            adb exec-out screencap -p > android-startup-report/screen.png || true
            adb logcat -d -v threadtime > android-startup-report/logcat.txt || true
            adb shell dumpsys activity activities > android-startup-report/activity.txt || true
            cp /tmp/gardeflow-screen.xml android-startup-report/accessibility.xml 2>/dev/null || true
            if [ "$success" != "1" ]; then
              echo "Android 16 startup did not reach login within 120 s."\n              head -c 10000 /tmp/gardeflow-screen.xml || true
              grep -E 'AndroidRuntime|FATAL EXCEPTION|GF_STARTUP|flutter|Flutter|E/.*' android-startup-report/logcat.txt | tail -n 180 || true
              exit 1
            fi
            echo "PASS: release APK reached GardeFlow login without saved session."

      - name: Upload startup diagnosis (emulator only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gardeflow-android-startup-diagnostic
          path: android-startup-report/
          retention-days: 7
          if-no-files-found: ignore
