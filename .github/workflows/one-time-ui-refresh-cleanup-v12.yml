name: One-time GardeFlow UI refresh cleanup and Android validation

on:
  push:
    branches:
      - ui-refresh-v12
    paths:
      - '.github/workflows/one-time-ui-refresh-cleanup-v12.yml'

permissions:
  contents: write

jobs:
  cleanup-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v5
        with:
          ref: ui-refresh-v12
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Apply cleanup
        run: |
          set -euo pipefail
          python3 ci/patch_ui_refresh_cleanup_v12.py
          dart format source/lib/screens/home_screen.dart
          git diff --check

      - name: Install dependencies and validate Dart
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get
          flutter test
          flutter analyze lib tool --no-fatal-infos --no-fatal-warnings
          flutter build web --release

      - name: Recover Firebase Android configuration
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/GardeFlow_android_v11_6_0_official_pdf_auto_import.zip"
          test -f "$ZIP"
          rm -rf /tmp/gardeflow-firebase
          mkdir -p /tmp/gardeflow-firebase
          unzip -q "$ZIP" -d /tmp/gardeflow-firebase
          GOOGLE_SERVICES="$(find /tmp/gardeflow-firebase -type f -name google-services.json -print -quit)"
          test -n "$GOOGLE_SERVICES"
          cp "$GOOGLE_SERVICES" google-services.json

      - name: Generate Android platform
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create --no-pub --platforms=android --org com.huim6 --project-name huim6_planning .
          cp google-services.json android/app/google-services.json
          dart tool/configure_android.dart
          python3 tool/install_alarm_activity.py
          grep -q 'android.permission.USE_FULL_SCREEN_INTENT' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/huim6/huim6_planning/AlarmActivity.kt

      - name: Build release APK
        working-directory: source
        run: |
          set -euo pipefail
          flutter build apk --release --build-name 12.0.0 --build-number 300
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-v12-ui-refresh-validation-apk
          path: source/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'GardeFlow CI'
          git config user.email 'actions@users.noreply.github.com'
          git add source/lib/screens/home_screen.dart
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'chore(ui): clean obsolete initial avatar variables'
          git push origin HEAD:ui-refresh-v12
