name: Build GardeFlow V12 Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v12-optimisee
      - alarm-reminders-v12
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'source/**'

permissions:
  contents: read

concurrency:
  group: gardeflow-v12-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: source

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Verify canonical V12 source
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f tool/configure_android.dart
          test -f tool/install_alarm_activity.py
          test -f tool/install_system_alarm_bridge.py
          test -f tool/harden_alarm_fallback.py
          grep -Fq 'version: 12.0.3+303' pubspec.yaml
          echo 'Canonical source verified: GardeFlow 12.0.3+303'

      - name: Recover Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/GardeFlow_android_v11_6_0_official_pdf_auto_import.zip"
          test -f "$ZIP"
          rm -rf /tmp/gardeflow-firebase
          mkdir -p /tmp/gardeflow-firebase
          unzip -q "$ZIP" -d /tmp/gardeflow-firebase
          GOOGLE_SERVICES="$(find /tmp/gardeflow-firebase -type f -name google-services.json -print -quit)"
          test -n "$GOOGLE_SERVICES"
          cp "$GOOGLE_SERVICES" google-services.json

      - name: Generate and configure Android platform
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create --no-pub --platforms=android --org com.huim6 --project-name huim6_planning .
          cp google-services.json android/app/google-services.json
          dart tool/configure_android.dart
          python3 tool/install_alarm_activity.py
          python3 tool/install_system_alarm_bridge.py
          python3 tool/harden_alarm_fallback.py

          MANIFEST=android/app/src/main/AndroidManifest.xml
          ALARM=android/app/src/main/kotlin/com/huim6/huim6_planning/AlarmActivity.kt

          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' "$MANIFEST"
          grep -q 'android.permission.USE_FULL_SCREEN_INTENT' "$MANIFEST"
          grep -q 'android.permission.WAKE_LOCK' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' "$MANIFEST"
          grep -q 'com.gdelataillade.alarm.action.RING' "$MANIFEST"
          grep -q 'GuardAlarmBootReceiver' "$MANIFEST"
          grep -q 'GuardAlarmTriggerReceiver' "$MANIFEST"
          grep -q 'GuardAlarmService' "$MANIFEST"
          grep -q 'foregroundServiceType="specialUse"' "$MANIFEST"

          test -f "$ALARM"
          grep -q 'class GuardAlarmTriggerReceiver' "$ALARM"
          grep -q 'class GuardAlarmService : Service()' "$ALARM"
          grep -q 'PowerManager.PARTIAL_WAKE_LOCK' "$ALARM"
          grep -q 'Notification.CATEGORY_ALARM' "$ALARM"
          grep -q 'setFullScreenIntent(fullScreenPending, true)' "$ALARM"
          grep -q 'PendingIntent.getBroadcast' "$ALARM"
          grep -q 'setAlarmClock' "$ALARM"
          grep -q 'setAndAllowWhileIdle' "$ALARM"

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze Flutter code
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --build-name 12.0.3 --build-number 303

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload GardeFlow V12 APK
        uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-v12.0.3-apk
          path: source/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

