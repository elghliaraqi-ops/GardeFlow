name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'source/**'
      - 'GardeFlow_android_v11_6_0_official_pdf_auto_import.zip'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate GardeFlow project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          if [ -f "GardeFlow_android_v11_6_0_official_pdf_auto_import.zip" ]; then
            ZIP="GardeFlow_android_v11_6_0_official_pdf_auto_import.zip"
          elif [ -f "source/GardeFlow_android_v11_6_0_official_pdf_auto_import.zip" ]; then
            ZIP="source/GardeFlow_android_v11_6_0_official_pdf_auto_import.zip"
          fi

          if [ -n "$ZIP" ]; then
            rm -rf .ci-project
            mkdir -p .ci-project
            unzip -q "$ZIP" -d .ci-project
            PROJECT_DIR="$(find .ci-project -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          elif [ -f "lib/main.dart" ] && [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            echo "Projet Flutter complet introuvable."
            echo "Ajoutez GardeFlow_android_v11_6_0_official_pdf_auto_import.zip à la racine du repository."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Flutter doctor
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter doctor -v

      - name: Prepare Android project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/gradlew ] || [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            rm -rf android
            flutter create --no-pub --platforms=android --org com.huim6 --project-name huim6_planning .
          fi

          test -f google-services.json
          cp -f google-services.json android/app/google-services.json

          dart tool/configure_android.dart

          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/drawable/ic_stat_huim6.xml
          test -f android/app/src/main/res/values/styles.xml
          test -f android/app/src/main/res/values-night/styles.xml
          test -f android/app/src/main/res/drawable/launch_background.xml

      - name: Install Flutter dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter clean
          flutter pub get

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload GardeFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-v11.6.0-release-apk
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
