name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'source/**'
      - 'ci/v11_6_1/**'
      - 'ci/v11_6_3/**'
      - 'ci/v11_6_5/**'
      - 'ci/v11_6_6/**'
      - 'ci/v11_6_7/**'
      - 'ci/v11_6_8/**'
      - 'ci/v11_6_9/**'
      - 'ci/v11_6_10/**'
      - 'ci/v11_6_11/**'
      - 'GardeFlow_android_v11_6_0_official_pdf_auto_import.zip'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate GardeFlow project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="GardeFlow_android_v11_6_0_official_pdf_auto_import.zip"
          test -f "$ZIP"
          rm -rf .ci-project
          mkdir -p .ci-project
          unzip -q "$ZIP" -d .ci-project
          PUBSPEC="$(find .ci-project -type f -name pubspec.yaml -print -quit)"
          test -n "$PUBSPEC"
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          test -f "$PROJECT_DIR/lib/main.dart"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Apply V11.6.1 overlay
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/ci/v11_6_1/overlay.part* > /tmp/gardeflow_v11_6_1.patch
          patch -p1 < /tmp/gardeflow_v11_6_1.patch
          grep -q '^version: 11.6.1+161$' pubspec.yaml

      - name: Apply V11.6.3 UI overlay
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/ci/v11_6_3/overlay.part* > /tmp/gardeflow_v11_6_3.patch
          patch -p1 < /tmp/gardeflow_v11_6_3.patch
          grep -q '^version: 11.6.3+163$' pubspec.yaml

      - name: Apply V11.6.4 launcher icon fix
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^version: 11.6.3+163$/version: 11.6.4+164/' pubspec.yaml
          python3 -m pip install --quiet --break-system-packages pillow
          python3 "$GITHUB_WORKSPACE/ci/v11_6_6/fix_launcher_icons.py" --android
          grep -q '^version: 11.6.4+164$' pubspec.yaml

      - name: Apply V11.6.5 official roster backfill
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/ci/v11_6_5/overlay.part* > /tmp/gardeflow_v11_6_5.patch
          patch -p1 < /tmp/gardeflow_v11_6_5.patch
          sed -i 's/^version: 11.6.4+164$/version: 11.6.5+165/' pubspec.yaml
          grep -q '^version: 11.6.5+165$' pubspec.yaml

      - name: Apply V11.6.6 HUICK and astreinte hospitals
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/ci/v11_6_6/overlay.part* > /tmp/gardeflow_v11_6_6.patch
          patch -p1 < /tmp/gardeflow_v11_6_6.patch
          grep -q '^version: 11.6.6+166$' pubspec.yaml

      - name: Apply V11.6.7 reminders and PDF search
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/ci/v11_6_7/apply_v11_6_7.py"
          grep -q '^version: 11.6.7+167$' pubspec.yaml

      - name: Apply V11.6.8 PDF viewer hotfix
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/ci/v11_6_8/apply_v11_6_8.py"
          grep -q '^version: 11.6.8+168$' pubspec.yaml

      - name: Apply V11.6.9 PDF and reminder UI fixes
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/ci/v11_6_9/apply_v11_6_9.py"
          grep -q '^version: 11.6.9+169$' pubspec.yaml

      - name: Apply V11.6.10 notification startup hotfix
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/ci/v11_6_10/apply_v11_6_10.py"
          grep -q '^version: 11.6.10+170$' pubspec.yaml
          ! grep -q '_plugin.cancelAll()' lib/services/notification_service.dart

      - name: Apply V11.6.11 functional password recovery
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/ci/v11_6_11/apply_v11_6_11.py"
          grep -q '^version: 11.6.11+171$' pubspec.yaml
          test -f lib/screens/forgot_password_screen.dart
          grep -q "password-reset" lib/services/supabase_backend_service.dart

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ] || [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            rm -rf android
            flutter create --no-pub --platforms=android --org com.huim6 --project-name huim6_planning .
          fi
          test -f google-services.json
          cp -f google-services.json android/app/google-services.json
          dart tool/configure_android.dart
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/drawable-nodpi/gardeflow_launcher_logo.png

      - name: Install Flutter dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter clean
          flutter pub get

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload GardeFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-v11.6.11-release-apk
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
