name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'source/**'
      - 'ci/v11_6_1/**'
      - 'ci/v11_6_3/**'
      - 'ci/v11_6_5/**'
      - 'ci/v11_6_6/**'
      - 'ci/v11_6_7/**'
      - 'ci/v11_6_8/**'
      - 'ci/v11_6_9/**'
      - 'ci/v11_6_10/**'
      - 'ci/v11_6_11/**'
      - 'ci/v11_6_12/**'
      - 'ci/v11_6_13/**'
      - 'ci/v11_6_16_bundle/**'
      - 'ci/v11_6_17/**'
      - 'ci/v11_6_18/**'
      - 'ci/v11_6_19/**'
      - 'ci/v11_6_20/**'
      - 'ci/v11_6_21/**'
      - 'ci/v11_6_22/**'
      - 'ci/v11_6_23/**'
      - 'ci/v11_6_24/**'
      - 'ci/v11_6_25/**'
      - 'ci/v11_6_26/**'
      - 'ci/v11_6_27/**'
      - 'ci/v11_6_28/**'
      - 'ci/v11_6_29/**'
      - 'ci/v11_6_30/**'
      - 'ci/v11_6_31/**'
      - 'ci/v11_6_32/**'
      - 'ci/v11_6_33/**'
      - 'ci/v11_6_34/**'
      - 'ci/v11_6_35/**'
      - 'ci/v11_6_36/**'
      - 'GardeFlow_android_v11_6_0_official_pdf_auto_import.zip'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V11.6.14 to V11.6.16 patches
        shell: bash
        run: |
          set -euo pipefail
          cat ci/v11_6_16_bundle/bundle.part*.b64 | base64 -d > /tmp/GardeFlow-v11.6.16-ci-bundle.zip
          unzip -oq /tmp/GardeFlow-v11.6.16-ci-bundle.zip -d "$GITHUB_WORKSPACE"
          test -f ci/v11_6_14/apply_v11_6_14.py
          test -f ci/v11_6_15/apply_v11_6_15.py
          test -f ci/v11_6_16/apply_v11_6_16.py

      - name: Locate GardeFlow project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="GardeFlow_android_v11_6_0_official_pdf_auto_import.zip"
          test -f "$ZIP"
          rm -rf .ci-project
          mkdir -p .ci-project
          unzip -q "$ZIP" -d .ci-project
          PUBSPEC="$(find .ci-project -type f -name pubspec.yaml -print -quit)"
          test -n "$PUBSPEC"
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          test -f "$PROJECT_DIR/lib/main.dart"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Apply patches V11.6.1 to V11.6.36
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/ci/v11_6_1/overlay.part* > /tmp/v11_6_1.patch
          patch -p1 < /tmp/v11_6_1.patch
          cat "$GITHUB_WORKSPACE"/ci/v11_6_3/overlay.part* > /tmp/v11_6_3.patch
          patch -p1 < /tmp/v11_6_3.patch

          sed -i 's/^version: 11.6.3+163$/version: 11.6.4+164/' pubspec.yaml
          python3 -m pip install --quiet --break-system-packages pillow
          python3 "$GITHUB_WORKSPACE/ci/v11_6_6/fix_launcher_icons.py" --android

          cat "$GITHUB_WORKSPACE"/ci/v11_6_5/overlay.part* > /tmp/v11_6_5.patch
          patch -p1 < /tmp/v11_6_5.patch
          sed -i 's/^version: 11.6.4+164$/version: 11.6.5+165/' pubspec.yaml

          cat "$GITHUB_WORKSPACE"/ci/v11_6_6/overlay.part* > /tmp/v11_6_6.patch
          patch -p1 < /tmp/v11_6_6.patch

          python3 "$GITHUB_WORKSPACE/ci/v11_6_7/apply_v11_6_7.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_8/apply_v11_6_8.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_9/apply_v11_6_9.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_10/apply_v11_6_10.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_11/apply_v11_6_11.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_12/apply_v11_6_12.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_13/apply_v11_6_13.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_14/apply_v11_6_14.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_15/apply_v11_6_15.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_16/apply_v11_6_16.py"

          # Hotfix alarm 5.13.1 + Dart actuel
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/services/alarm_ring_service.dart')
          s = p.read_text()
          old = 'const VolumeSettings.fade('
          count = s.count(old)
          if count == 0:
              raise SystemExit('VolumeSettings.fade const hotfix: pattern not found')
          p.write_text(s.replace(old, 'VolumeSettings.fade('))
          print(f'VolumeSettings.fade const hotfix applied: {count} occurrence(s)')
          PY
          if grep -q 'const VolumeSettings.fade' lib/services/alarm_ring_service.dart; then
            echo "VolumeSettings.fade const hotfix failed"
            exit 1
          fi

          # Preserve the stable V11.6.16 business logic exactly.
          cp lib/state/app_state.dart /tmp/app_state_v11_6_16.dart

          python3 "$GITHUB_WORKSPACE/ci/v11_6_17/apply_v11_6_17.py"

          # V11.6.17 is a visual redesign: restore the proven stable state logic.
          cp /tmp/app_state_v11_6_16.dart lib/state/app_state.dart

          # Ensure redesigned password-recovery screen imports the shared theme.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/forgot_password_screen.dart')
          s = p.read_text()
          theme_import = "import '../theme/app_theme.dart';"
          if theme_import not in s:
              anchor = "import 'package:flutter/material.dart';"
              if anchor not in s:
                  raise SystemExit('forgot_password_screen.dart: Flutter material import missing')
              s = s.replace(anchor, anchor + "\n" + theme_import, 1)
              p.write_text(s)
              print('Added AppColors theme import to forgot_password_screen.dart')
          else:
              print('AppColors theme import already present')
          PY

          python3 "$GITHUB_WORKSPACE/ci/v11_6_18/apply_v11_6_18.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_19/apply_v11_6_19.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_20/apply_v11_6_20.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_21/apply_v11_6_21.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_22/apply_v11_6_22.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_23/apply_v11_6_23.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_24/apply_v11_6_24.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_25/apply_v11_6_25.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_26/apply_v11_6_26.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_27/apply_v11_6_27.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_28/apply_v11_6_28.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_29/apply_v11_6_29.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_30/apply_v11_6_30.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_31/apply_v11_6_31.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_32/apply_v11_6_32.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_33/apply_v11_6_33.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_34/apply_v11_6_34.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_35/apply_v11_6_35.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_36/apply_v11_6_36.py"
          test -f lib/screens/profile_screen.dart
          grep -q '^version: 11.6.36+196$' pubspec.yaml
          grep -q 'const DirectoryScreen(embedded: true)' lib/screens/home_screen.dart
          grep -q "'Astreintes'" lib/screens/home_screen.dart
          grep -q 'const _AstreintesHubView()' lib/screens/home_screen.dart
          grep -q 'const ProfileScreen()' lib/screens/home_screen.dart
          grep -q 'class _MainBottomBar' lib/screens/home_screen.dart
          grep -q "final greeting = isNight ? 'Bonsoir' : 'Bonjour';" lib/screens/home_screen.dart
          grep -q 'Prochaine garde à venir' lib/screens/home_screen.dart
          grep -q 'class _PlanningShiftGroup' lib/screens/home_screen.dart
          grep -q 'Planning officiel' lib/screens/home_screen.dart
          grep -q 'notifications_none_rounded' lib/screens/home_screen.dart
          grep -q 'Transfert / échange' lib/screens/home_screen.dart
          grep -q 'ExchangeRequestSheet(dateStr: dateStr, entry: entry)' lib/screens/home_screen.dart
          grep -q 'Effacer les rappels déjà envoyés' lib/screens/notifications_screen.dart
          grep -q 'Planning validé · tuiles verrouillées' lib/screens/home_screen.dart
          grep -q 'NeverScrollableScrollPhysics' lib/screens/home_screen.dart
          grep -q 'class _CompactShiftTile' lib/screens/home_screen.dart
          grep -q 'GardeFlowLogo(size: 38)' lib/screens/home_screen.dart
          grep -q 'assets/branding/gardeflow_logo.png' lib/theme/widgets.dart
          grep -q 'static const brand = Color(0xFF138A55)' lib/theme/app_theme.dart
          grep -q 'static const cyan = Color(0xFFD94A43)' lib/theme/app_theme.dart
          grep -q 'Actualités du jour' lib/screens/daily_news_section.dart
          grep -q 'Bonsoir' lib/screens/home_screen.dart
          grep -q 'ce mois-ci' lib/screens/home_screen.dart
          grep -q 'FontWeight.w600' lib/screens/home_screen.dart
          grep -q 'Le planning de garde pour garder le' lib/screens/auth_screen.dart
          grep -q 'subtitleColor: _loginGreen' lib/screens/auth_screen.dart
          grep -q 'FittedBox' lib/screens/auth_screen.dart
          grep -q 'Astreinte Senior' lib/screens/home_screen.dart
          grep -q 'Astreinte Junior' lib/screens/home_screen.dart
          grep -q 'AstreinteScreen(embedded: true)' lib/screens/home_screen.dart
          grep -q 'JuniorOnCallScreen(embedded: true)' lib/screens/home_screen.dart
          grep -Fq "const ['Accueil', 'Planning', 'Annuaire', 'Astreintes']" lib/screens/home_screen.dart
          grep -q "GardeFlowTitle('Mon profil')" lib/screens/profile_screen.dart
          grep -q "directory-add-contact-embedded" lib/screens/directory_screen.dart
          grep -q "directory-add-contact-standalone" lib/screens/directory_screen.dart
          grep -q "class _PlanningShiftGroup" lib/screens/home_screen.dart
          grep -q "SettingsScreen(reminderFocus: true)" lib/screens/home_screen.dart
          grep -q "notifications_active_rounded" lib/screens/home_screen.dart
          grep -q "final bool reminderFocus" lib/screens/settings_screen.dart
          grep -q "widget.reminderFocus ? 'Rappels de garde' : 'Réglages'" lib/screens/settings_screen.dart
          grep -q "Calendrier mensuel validé" lib/screens/audit_screen.dart
          grep -q "Calendrier rouvert" lib/screens/audit_screen.dart
          grep -q "Historique administratif" lib/screens/audit_screen.dart
          grep -q "GardeFlowTitle('Gestion des gardes')" lib/screens/admin_screen.dart
          grep -q "Elghali Production © 2026" lib/screens/profile_screen.dart
          grep -q "elghali_signature.webp" lib/screens/profile_screen.dart
          grep -q "MediaQuery.viewPaddingOf(context).bottom" lib/screens/home_screen.dart
          grep -q "width: 235" lib/screens/profile_screen.dart
          grep -q "Ouvrir la source" lib/screens/daily_news_section.dart
          grep -q "À venir" lib/screens/daily_news_section.dart
          grep -q "Publications Instagram officielles" lib/screens/daily_news_section.dart
          grep -q "Voir sur Instagram" lib/screens/daily_news_section.dart
          grep -q "GardeFlowTitle('Alarme de garde')" lib/screens/settings_screen.dart
          grep -q "Configurer les autorisations Android" lib/screens/settings_screen.dart
          grep -q "Lancer le test" lib/screens/settings_screen.dart
          test -f assets/branding/elghali_signature.webp
          grep -q "Concerné" lib/screens/audit_screen.dart
          grep -q "Motif :" lib/screens/audit_screen.dart
          grep -q "title: 'SERVICE'" lib/screens/home_screen.dart
          grep -q "title: 'URGENCES'" lib/screens/home_screen.dart
          grep -q "'CONGÉ'" lib/screens/home_screen.dart
          grep -q "FloatingActionButton(" lib/screens/directory_screen.dart
          if grep -q "Text('Mon profil'.*titleLarge" lib/screens/profile_screen.dart; then echo 'Duplicate profile header remains'; exit 1; fi
          if grep -q 'floatingActionButton:' lib/screens/home_screen.dart; then echo 'Unexpected central FAB'; exit 1; fi

          python3 - <<'PY'
          from pathlib import Path
          candidates = list(Path('lib').rglob('*.dart')) + list(Path('tool').rglob('*.dart'))
          for p in candidates:
              raw = p.read_bytes()
              try:
                  raw.decode('utf-8')
              except UnicodeDecodeError as exc:
                  print(f'Normalizing UTF-8 in {p}: {exc}')
                  p.write_text(raw.decode('utf-8', errors='replace'))
          checks = [
              ('pubspec.yaml', 'version: 11.6.36+196'),
              ('pubspec.yaml', 'alarm: ^5.13.1'),
              ('lib/screens/home_screen.dart', 'class _DashboardView'),
              ('lib/services/notification_service.dart', 'AlarmRingService'),
              ('lib/screens/admin_password_reset_screen.dart', 'AppColors.success'),
              ('lib/screens/audit_screen.dart', 'AppColors.danger'),
          ]
          for file_name, needle in checks:
              p = Path(file_name)
              if not p.exists():
                  raise SystemExit(f'V11.6.17 validation: missing {file_name}')
              if needle not in p.read_text():
                  raise SystemExit(f'V11.6.17 validation: {needle!r} missing in {file_name}')
              print(f'OK {file_name}: {needle}')
          if not Path('lib/services/alarm_ring_service.dart').exists():
              raise SystemExit('V11.6.17 validation: alarm_ring_service.dart missing')
          print('V11.6.17 validation completed')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ] || [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            rm -rf android
            flutter create --no-pub --platforms=android --org com.huim6 --project-name huim6_planning .
          fi
          test -f google-services.json
          cp -f google-services.json android/app/google-services.json
          dart tool/configure_android.dart
          python3 "$GITHUB_WORKSPACE/ci/v11_6_17/install_alarm_activity.py"
          grep -q 'android.permission.USE_FULL_SCREEN_INTENT' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK' android/app/src/main/AndroidManifest.xml
          grep -q 'com.gdelataillade.alarm.action.RING' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/huim6/huim6_planning/AlarmActivity.kt
          grep -q 'ACTION_ALARM_SNOOZE' android/app/src/main/kotlin/com/huim6/huim6_planning/AlarmActivity.kt
          grep -q 'ACTION_ALARM_STOP' android/app/src/main/kotlin/com/huim6/huim6_planning/AlarmActivity.kt
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/drawable-nodpi/gardeflow_launcher_logo.png

      - name: Install Flutter dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter clean
          flutter pub get

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload GardeFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-v11.6.36-release-apk
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
