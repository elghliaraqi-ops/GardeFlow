name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'source/**'
      - 'ci/v11_6_1/**'
      - 'ci/v11_6_3/**'
      - 'ci/v11_6_5/**'
      - 'GardeFlow_android_v11_6_0_official_pdf_auto_import.zip'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate GardeFlow project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          if [ -f "GardeFlow_android_v11_6_0_official_pdf_auto_import.zip" ]; then
            ZIP="GardeFlow_android_v11_6_0_official_pdf_auto_import.zip"
          elif [ -f "source/GardeFlow_android_v11_6_0_official_pdf_auto_import.zip" ]; then
            ZIP="source/GardeFlow_android_v11_6_0_official_pdf_auto_import.zip"
          fi

          if [ -n "$ZIP" ]; then
            rm -rf .ci-project
            mkdir -p .ci-project
            unzip -q "$ZIP" -d .ci-project
            PUBSPEC="$(find .ci-project -type f -name pubspec.yaml -print -quit)"
            if [ -z "$PUBSPEC" ]; then
              echo "pubspec.yaml introuvable dans le ZIP."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$PUBSPEC")"
          elif [ -f "lib/main.dart" ] && [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            echo "Projet Flutter complet introuvable."
            echo "Ajoutez GardeFlow_android_v11_6_0_official_pdf_auto_import.zip à la racine du repository."
            exit 1
          fi

          test -f "$PROJECT_DIR/lib/main.dart"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Apply V11.6.1 overlay
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/ci/v11_6_1/overlay.part* > /tmp/gardeflow_v11_6_1.patch
          patch -p1 < /tmp/gardeflow_v11_6_1.patch
          grep -q '^version: 11.6.1+161$' pubspec.yaml
          echo "V11.6.1 overlay applied successfully."

      - name: Apply V11.6.3 UI overlay
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/ci/v11_6_3/overlay.part* > /tmp/gardeflow_v11_6_3.patch
          patch -p1 < /tmp/gardeflow_v11_6_3.patch
          grep -q '^version: 11.6.3+163$' pubspec.yaml
          echo "V11.6.3 overlay applied successfully."

      - name: Apply V11.6.4 launcher icon fix
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          sed -i 's/^version: 11.6.3+163$/version: 11.6.4+164/' pubspec.yaml
          grep -q '^version: 11.6.4+164$' pubspec.yaml

          python3 -m pip install --quiet --break-system-packages pillow

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          source = root / 'tool/android-res/drawable-nodpi/gardeflow_logo.png'
          if not source.is_file():
              raise SystemExit(f'Logo source introuvable: {source}')

          img = Image.open(source).convert('RGB')
          width, height = img.size

          mask = Image.new('1', img.size, 0)
          mask_px = mask.load()
          src_px = img.load()
          for y in range(height):
              for x in range(width):
                  r, g, b = src_px[x, y]
                  if min(r, g, b) < 185 and (max(r, g, b) - min(r, g, b)) > 45:
                      mask_px[x, y] = 1

          bbox = mask.getbbox()
          if bbox is None:
              raise SystemExit('Impossible de détecter le symbole du logo.')

          left, top, right, bottom = bbox
          pad = max(8, int(min(width, height) * 0.01))
          left = max(0, left - pad)
          top = max(0, top - pad)
          right = min(width, right + pad)
          bottom = min(height, bottom + pad)
          symbol = img.crop((left, top, right, bottom))

          def centered_master(symbol_img, canvas_size, symbol_size):
              canvas = Image.new('RGB', (canvas_size, canvas_size), 'white')
              sw, sh = symbol_img.size
              scale = min(symbol_size / sw, symbol_size / sh)
              nw = max(1, round(sw * scale))
              nh = max(1, round(sh * scale))
              resized = symbol_img.resize((nw, nh), Image.Resampling.LANCZOS)
              canvas.paste(resized, ((canvas_size - nw) // 2, (canvas_size - nh) // 2))
              return canvas

          legacy_master = centered_master(symbol, 1024, 655)
          adaptive_master = centered_master(symbol, 1024, 440)

          adaptive_path = root / 'tool/android-res/drawable-nodpi/gardeflow_launcher_logo.png'
          adaptive_path.parent.mkdir(parents=True, exist_ok=True)
          adaptive_master.save(adaptive_path, format='PNG', optimize=True)

          densities = {
              'mdpi': 48,
              'hdpi': 72,
              'xhdpi': 96,
              'xxhdpi': 144,
              'xxxhdpi': 192,
          }
          for density, size in densities.items():
              target = root / f'tool/android-res/mipmap-{density}/ic_launcher.png'
              target.parent.mkdir(parents=True, exist_ok=True)
              legacy_master.resize((size, size), Image.Resampling.LANCZOS).save(
                  target, format='PNG', optimize=True
              )

          foreground = root / 'tool/android-res/drawable/gardeflow_launcher_foreground.xml'
          text = foreground.read_text(encoding='utf-8')
          text = text.replace('@drawable/gardeflow_logo', '@drawable/gardeflow_launcher_logo')
          foreground.write_text(text, encoding='utf-8')

          print('Launcher icon V11.6.4 generated with corrected padding.')
          print('Detected symbol bbox:', bbox)
          PY

          test -f tool/android-res/drawable-nodpi/gardeflow_launcher_logo.png
          grep -q '@drawable/gardeflow_launcher_logo' tool/android-res/drawable/gardeflow_launcher_foreground.xml
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "tool/android-res/mipmap-$density/ic_launcher.png"
          done

      - name: Apply V11.6.5 official roster backfill
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/ci/v11_6_5/overlay.part* > /tmp/gardeflow_v11_6_5.patch
          patch -p1 < /tmp/gardeflow_v11_6_5.patch
          sed -i 's/^version: 11.6.4+164$/version: 11.6.5+165/' pubspec.yaml
          grep -q '^version: 11.6.5+165$' pubspec.yaml
          echo "V11.6.5 official roster backfill applied successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter doctor -v

      - name: Prepare Android project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/gradlew ] || [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            rm -rf android
            flutter create --no-pub --platforms=android --org com.huim6 --project-name huim6_planning .
          fi

          test -f google-services.json
          cp -f google-services.json android/app/google-services.json

          dart tool/configure_android.dart

          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/drawable-nodpi/gardeflow_launcher_logo.png
          grep -q '@drawable/gardeflow_launcher_logo' android/app/src/main/res/drawable/gardeflow_launcher_foreground.xml
          test -f android/app/src/main/res/drawable/ic_stat_huim6.xml
          test -f android/app/src/main/res/values/styles.xml
          test -f android/app/src/main/res/values-night/styles.xml
          test -f android/app/src/main/res/drawable/launch_background.xml

      - name: Install Flutter dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter clean
          flutter pub get

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload GardeFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-v11.6.5-release-apk
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30