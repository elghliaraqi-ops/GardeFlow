name: One-time fix announcement keyboard button

on:
  push:
    branches:
      - fix-announcement-keyboard-button-20261003
    paths:
      - .github/workflows/one-time-fix-announcement-keyboard-button.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-announcement-keyboard-button-20261003
          fetch-depth: 0

      - name: Make announcement composer keyboard-safe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('source/lib/screens/announcements_screen.dart')
          text = path.read_text(encoding='utf-8')

          start = text.index('  Future<void> _openComposer() async {')
          end = text.index('\n  Future<void> _close(', start)
          composer = text[start:end]

          old_layout = (
              "          return Padding(\n"
              "            padding: EdgeInsets.fromLTRB(\n"
              "              18,\n"
              "              2,\n"
              "              18,\n"
              "              18 +\n"
              "                  MediaQuery.viewInsetsOf(context).bottom +\n"
              "                  MediaQuery.viewPaddingOf(context).bottom,\n"
              "            ),\n"
              "            child: Column(\n"
          )
          new_layout = (
              "          return SingleChildScrollView(\n"
              "            keyboardDismissBehavior: ScrollViewKeyboardDismissBehavior.onDrag,\n"
              "            padding: EdgeInsets.fromLTRB(\n"
              "              18,\n"
              "              2,\n"
              "              18,\n"
              "              18 +\n"
              "                  MediaQuery.viewInsetsOf(context).bottom +\n"
              "                  MediaQuery.viewPaddingOf(context).bottom,\n"
              "            ),\n"
              "            child: Column(\n"
          )
          if old_layout not in composer:
              raise SystemExit('Announcement composer layout anchor not found')
          composer = composer.replace(old_layout, new_layout, 1)

          old_press = (
              "                        : () async {\n"
              "                            setSheetState(() => sending = true);\n"
          )
          new_press = (
              "                        : () async {\n"
              "                            // Keep the CTA active while the IME is visible.\n"
              "                            FocusManager.instance.primaryFocus?.unfocus();\n"
              "                            setSheetState(() => sending = true);\n"
          )
          if old_press not in composer:
              raise SystemExit('Announcement publish button anchor not found')
          composer = composer.replace(old_press, new_press, 1)

          text = text[:start] + composer + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

          grep -Fq 'keyboardDismissBehavior: ScrollViewKeyboardDismissBehavior.onDrag' source/lib/screens/announcements_screen.dart
          grep -Fq 'FocusManager.instance.primaryFocus?.unfocus();' source/lib/screens/announcements_screen.dart
          git diff --check

      - name: Commit keyboard fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GardeFlow CI'
          git config user.email 'actions@users.noreply.github.com'
          git add source/lib/screens/announcements_screen.dart
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'fix: allow announcement publish while keyboard is open'
          git push origin HEAD:fix-announcement-keyboard-button-20261003
