name: Validate Clinical QCM Layout

on:
  push:
    branches:
      - fix/organize-clinical-qcm-page-20261001
    paths:
      - '.github/workflows/validate-clinical-qcm-layout.yml'
      - 'source/lib/screens/clinical_cases_section.dart'
      - 'source/lib/screens/clinical_case_specialty.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Analyze
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build Web release
        working-directory: source
        run: flutter build web --release --base-href "/GardeFlow/" --build-name "12.0.0" --build-number "302"
