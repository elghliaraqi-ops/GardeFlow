name: Gamify Practice

on:
  push:
    branches:
      - style/gamify-practice-20261001

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply Practice gamification
        run: python3 .github/scripts/gamify_practice.py
      - name: Commit visual change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/lib/screens/practice_screen.dart source/lib/theme/screen_decor.dart
          git commit -m "style: transformer Practice en expérience gamifiée"
          git push
      - name: Install dependencies
        working-directory: source
        run: flutter pub get
      - name: Run tests
        working-directory: source
        run: flutter test
      - name: Analyze Flutter code
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings
      - name: Build Flutter Web release
        working-directory: source
        run: flutter build web --release --base-href "/GardeFlow/" --build-name "12.0.0" --build-number "300"
