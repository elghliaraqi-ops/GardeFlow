name: One-time home feed visual refresh

on:
  push:
    branches:
      - style/home-feed-practice-cases-qcm-20261001
    paths:
      - '.github/workflows/one-time-home-feed-visual-refresh.yml'
      - '.github/scripts/one_time_home_feed_visual_refresh.py'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: style/home-feed-practice-cases-qcm-20261001
          fetch-depth: 0

      - name: Apply visual patch
        run: python3 .github/scripts/one_time_home_feed_visual_refresh.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Format modified Dart files
        working-directory: source
        run: dart format lib/screens/practice_screen.dart lib/screens/clinical_cases_section.dart

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Analyze
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build web release
        working-directory: source
        run: flutter build web --release --base-href "/GardeFlow/" --build-name "12.0.0" --build-number "300"

      - name: Verify visual-only scope
        shell: bash
        run: |
          set -euo pipefail
          git diff -- source/lib/screens/practice_screen.dart source/lib/screens/clinical_cases_section.dart
          test -z "$(git diff --name-only | grep -vE '^(source/lib/screens/practice_screen.dart|source/lib/screens/clinical_cases_section.dart)$' || true)"

      - name: Remove one-time patch files
        run: |
          rm -f .github/scripts/one_time_home_feed_visual_refresh.py
          rm -f .github/workflows/one-time-home-feed-visual-refresh.yml

      - name: Commit validated visual refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: rendre Practice, cas cliniques et QCM visibles sur l'accueil"
          git push origin HEAD:style/home-feed-practice-cases-qcm-20261001
