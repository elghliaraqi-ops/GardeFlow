name: Validate Practice voice dictation

on:
  push:
    branches:
      - feature-practice-voice-dictation-20260930
    paths:
      - '.github/workflows/practice-voice-dictation.yml'
      - '.github/scripts/apply_practice_voice_dictation.py'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature-practice-voice-dictation-20260930

      - name: Apply voice dictation patch
        run: python3 .github/scripts/apply_practice_voice_dictation.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Format
        run: dart format source/lib/screens/practice_screen.dart source/tool/configure_android.dart

      - name: Test
        working-directory: source
        run: flutter test

      - name: Analyze
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build web release
        working-directory: source
        run: flutter build web --release --base-href "/GardeFlow/"

      - name: Recover Firebase Android configuration
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/GardeFlow_android_v11_6_0_official_pdf_auto_import.zip"
          test -f "$ZIP"
          rm -rf /tmp/gardeflow-firebase
          mkdir -p /tmp/gardeflow-firebase
          unzip -q "$ZIP" -d /tmp/gardeflow-firebase
          GOOGLE_SERVICES="$(find /tmp/gardeflow-firebase -type f -name google-services.json -print -quit)"
          test -n "$GOOGLE_SERVICES"
          cp "$GOOGLE_SERVICES" google-services.json

      - name: Generate and configure Android platform
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          rm -rf android
          flutter create --no-pub --platforms=android --org com.huim6 --project-name huim6_planning .
          cp google-services.json android/app/google-services.json
          dart tool/configure_android.dart
          python3 tool/install_alarm_activity.py
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.speech.RecognitionService' android/app/src/main/AndroidManifest.xml

      - name: Build Android debug APK
        working-directory: source
        run: flutter build apk --debug

      - name: Commit validated feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/pubspec.yaml source/pubspec.lock source/lib/screens/practice_screen.dart source/tool/configure_android.dart
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add per-field voice dictation to Practice forms'
          git push origin HEAD:feature-practice-voice-dictation-20260930
