name: Validate QCM Security Fix

on:
  pull_request:
    branches: [main]
    paths:
      - 'source/lib/services/clinical_case_service.dart'
      - 'source/lib/services/qcm_generation_retry_policy.dart'
      - 'source/supabase/functions/generate-clinical-case-qcm/**'
      - 'source/test/qcm_generation_retry_policy_test.dart'
      - 'source/test/qcm_models_test.dart'
      - 'source/test/clinical_case_post_test.dart'
      - 'supabase/migrations/*qcm*'
      - '.github/workflows/qcm-security-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qcm-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/qcm-generation-security
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Flutter dependencies
        working-directory: source
        run: flutter pub get

      - name: Apply Dart formatting
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/services/clinical_case_service.dart lib/services/qcm_generation_retry_policy.dart test/qcm_generation_retry_policy_test.dart
          cd "$GITHUB_WORKSPACE"
          if ! git diff --quiet; then
            git config user.name 'GardeFlow CI'
            git config user.email 'actions@users.noreply.github.com'
            git add source/lib/services/clinical_case_service.dart source/lib/services/qcm_generation_retry_policy.dart source/test/qcm_generation_retry_policy_test.dart
            git commit -m 'style(qcm): apply dart format'
            git push origin HEAD:fix/qcm-generation-security
          fi

      - name: Verify Dart formatting
        working-directory: source
        run: dart format --output=none --set-exit-if-changed lib/services/clinical_case_service.dart lib/services/qcm_generation_retry_policy.dart test/qcm_generation_retry_policy_test.dart

      - name: Flutter analyzer
        working-directory: source
        run: flutter analyze lib/services/clinical_case_service.dart lib/services/qcm_generation_retry_policy.dart test/qcm_generation_retry_policy_test.dart

      - name: QCM unit tests
        working-directory: source
        run: flutter test test/qcm_generation_retry_policy_test.dart test/qcm_models_test.dart test/clinical_case_post_test.dart

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check QCM Edge Function
        run: deno check source/supabase/functions/generate-clinical-case-qcm/index.ts

      - name: SQL security assertions
        shell: bash
        run: |
          set -euo pipefail
          HARDEN='supabase/migrations/20261001223000_qcm_generation_security_hardening.sql'
          FEED='supabase/migrations/20261001220900_clinical_qcm_rpc_security_hardening.sql'
          grep -Fq 'clinical_case_commit_generated_qcms' "$HARDEN"
          grep -Fq 'clinical_case_qcm_generation_jobs' "$HARDEN"
          grep -Fq 'rate_limit_exceeded' "$HARDEN"
          grep -Fq 'revoke all on table public.clinical_case_qcms from anon,authenticated' "$HARDEN"
          grep -Fq "legacy.post_id is not null then c.correct_index" "$FEED"
          grep -Fq 'revoke all on function public.clinical_case_feed(integer,integer) from public, anon' "$FEED"
