name: Practice 5 QCM + notifications

on:
  push:
    branches:
      - feature-practice-qcm-notifications-20260930
    paths:
      - '.github/workflows/practice-qcm5-notifications.yml'
      - '.github/scripts/apply_practice_qcm5_notifications.py'
      - '.github/scripts/apply_practice_push_backend.py'
      - 'source/lib/models/clinical_case_post.dart'
      - 'source/lib/models/qcm_models.dart'
      - 'source/lib/services/clinical_case_service.dart'
      - 'source/supabase/functions/**'
      - 'ci/v12_practice/practice_qcm5_notifications.sql'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature-practice-qcm-notifications-20260930

      - name: Apply client integration patch
        run: python3 .github/scripts/apply_practice_qcm5_notifications.py

      - name: Apply push backend patch
        run: python3 .github/scripts/apply_practice_push_backend.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Format Dart sources
        run: |
          dart format \
            source/lib/models/clinical_case_post.dart \
            source/lib/models/qcm_models.dart \
            source/lib/services/clinical_case_service.dart \
            source/lib/services/practice_service.dart \
            source/lib/services/push_notification_service.dart \
            source/lib/services/notification_service.dart \
            source/lib/state/app_state.dart \
            source/lib/screens/home_screen.dart \
            source/lib/screens/clinical_cases_section.dart

      - name: Run Flutter tests
        working-directory: source
        run: flutter test

      - name: Analyze Flutter code
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build Flutter Web release
        working-directory: source
        run: flutter build web --release --base-href "/GardeFlow/"

      - name: Validate migration shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'create table if not exists public.clinical_case_qcms' ci/v12_practice/practice_qcm5_notifications.sql
          grep -q 'clinical_case_submit_qcm_answer' ci/v12_practice/practice_qcm5_notifications.sql
          grep -q 'minItems: 5' source/supabase/functions/generate-clinical-case-qcm/index.ts
          grep -q "practice_achievement_unlocked" source/supabase/functions/send-push/index.ts

      - name: Commit validated implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            source/lib/models/clinical_case_post.dart \
            source/lib/models/qcm_models.dart \
            source/lib/services/clinical_case_service.dart \
            source/lib/services/practice_service.dart \
            source/lib/services/push_notification_service.dart \
            source/lib/services/notification_service.dart \
            source/lib/state/app_state.dart \
            source/lib/screens/home_screen.dart \
            source/lib/screens/clinical_cases_section.dart \
            source/supabase/functions/generate-clinical-case-qcm/index.ts \
            source/supabase/functions/send-push/index.ts \
            ci/v12_practice/practice_qcm5_notifications.sql
          git commit -m 'feat: add five Practice QCMs and learning notifications'
          git push origin HEAD:feature-practice-qcm-notifications-20260930
