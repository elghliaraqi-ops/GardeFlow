name: Fix hardening call sites

on:
  push:
    branches:
      - hardening-20261003
    paths:
      - 'tools/fix_hardening_call_sites.py'
      - '.github/workflows/fix-hardening-call-sites.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[call-sites-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hardening-20261003
          fetch-depth: 0
      - name: Patch UI call sites
        run: python3 tools/fix_hardening_call_sites.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: source
        run: flutter pub get
      - name: Format patched screens
        working-directory: source
        run: dart format lib/screens/announcements_screen.dart lib/screens/exchange_request_sheet.dart
      - name: Commit patched screens
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GardeFlow Hardening Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add source/lib/screens/announcements_screen.dart source/lib/screens/exchange_request_sheet.dart
          git commit -m 'fix: pass shift context to promotion rules [call-sites-applied]'
          git push origin HEAD:hardening-20261003
