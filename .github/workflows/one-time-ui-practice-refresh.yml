          # Small visual polish for the ranking card; data and behavior are unchanged.
          replace_exact(
              qcm,
              """                borderRadius: BorderRadius.circular(18),
                border: Border.all(color: _line),""",
              """                borderRadius: BorderRadius.circular(20),
                border: Border.all(color: _line),""",
              1,
          )

          # Guard rail: this workflow may only touch presentation-layer screen files.
          allowed = {
              practice,
              clinical,
              qcm,
          }
          changed = []
          import subprocess
          out = subprocess.check_output(['git', 'diff', '--name-only'], text=True)
          for line in out.splitlines():
              if line.strip():
                  changed.append(line.strip())
          unexpected = [p for p in changed if p not in allowed]
          if unexpected:
              raise SystemExit(f'Unexpected files changed: {unexpected}')
          expected = {practice, clinical, qcm}
          if set(changed) != expected:
              raise SystemExit(f'Expected exactly {sorted(expected)}, got {sorted(changed)}')
          PY

          git diff --check
          grep -Fq "OBSERVATION CLINIQUE" source/lib/screens/practice_screen.dart
          grep -Fq "Antécédents et histoire de la maladie" source/lib/screens/practice_screen.dart
          grep -Fq "borderRadius: BorderRadius.circular(26)" source/lib/screens/clinical_cases_section.dart
          grep -Fq "Votre progression sur les cas cliniques" source/lib/screens/practice_qcm_screen.dart

      - name: Commit visual-only refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GardeFlow CI'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            source/lib/screens/practice_screen.dart \
            source/lib/screens/clinical_cases_section.dart \
            source/lib/screens/practice_qcm_screen.dart
          if git diff --cached --quiet; then
