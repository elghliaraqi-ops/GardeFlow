name: One-time Practice UI visual refresh

on:
  push:
    branches:
      - ui/practice-clinical-qcm-refresh-20260930
    paths:
      - .github/workflows/one-time-ui-practice-refresh.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/practice-clinical-qcm-refresh-20260930
          fetch-depth: 0

      - name: Apply UI-only visual refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              found = s.count(old)
              if found < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrences, found {found}')
              s = s.replace(old, new, count)
              p.write_text(s)

          def replace_between(path, start, end, replacement):
              p = Path(path)
              s = p.read_text()
              a = s.find(start)
              if a < 0:
                  raise SystemExit(f'{path}: start marker not found: {start}')
              b = s.find(end, a)
              if b < 0:
                  raise SystemExit(f'{path}: end marker not found: {end}')
              s = s[:a] + replacement.rstrip() + '\n\n' + s[b:]
              p.write_text(s)

