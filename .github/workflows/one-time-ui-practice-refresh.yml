name: One-time Practice UI visual refresh

on:
  push:
    branches:
      - ui/practice-clinical-qcm-refresh-20260930
    paths:
      - .github/workflows/one-time-ui-practice-refresh.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/practice-clinical-qcm-refresh-20260930
          fetch-depth: 0

      - name: Prepare current visual patch
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/one_time_ui_practice_refresh.py /tmp/one_time_ui_practice_refresh.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/one_time_ui_practice_refresh.py')
          s = p.read_text()
          s = s.replace(
              '                  padding: const EdgeInsets.symmetric(horizontal: 9, vertical: 6),',
              '                padding: const EdgeInsets.symmetric(horizontal: 9, vertical: 6),',
              1,
          )
          s = s.replace(
              '                  padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 7),',
              '                padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 7),',
              1,
          )
          s = s.replace('Icons.stethoscope_rounded', 'Icons.medical_services_outlined')
          s = s.replace('Icons.clinical_notes_outlined', 'Icons.assignment_outlined')
          p.write_text(s)
          PY

      - name: Apply UI-only visual patch
        run: python3 /tmp/one_time_ui_practice_refresh.py

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq "OBSERVATION CLINIQUE" source/lib/screens/practice_screen.dart
          grep -Fq "Antécédents et histoire de la maladie" source/lib/screens/practice_screen.dart
          grep -Fq "borderRadius: BorderRadius.circular(26)" source/lib/screens/clinical_cases_section.dart
          grep -Fq "Votre progression sur les cas cliniques" source/lib/screens/practice_qcm_screen.dart
          changed="$(git diff --name-only -- source/lib/screens)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -Fxq 'source/lib/screens/practice_screen.dart'
          printf '%s\n' "$changed" | grep -Fxq 'source/lib/screens/clinical_cases_section.dart'
          printf '%s\n' "$changed" | grep -Fxq 'source/lib/screens/practice_qcm_screen.dart'
          git config user.name 'GardeFlow CI'
          git config user.email 'actions@users.noreply.github.com'
          git add source/lib/screens/practice_screen.dart source/lib/screens/clinical_cases_section.dart source/lib/screens/practice_qcm_screen.dart
          git commit -m 'style: refresh Practice patient forms clinical cases and QCM'
          git push origin HEAD:ui/practice-clinical-qcm-refresh-20260930
