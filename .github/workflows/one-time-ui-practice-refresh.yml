name: One-time Practice UI visual refresh

on:
  push:
    branches:
      - ui/practice-clinical-qcm-refresh-20260930
    paths:
      - .github/workflows/one-time-ui-practice-refresh.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/practice-clinical-qcm-refresh-20260930
          fetch-depth: 0

      - name: Diagnose visual anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('source/lib/screens/clinical_cases_section.dart').read_text()
          anchors = {
            'case-card': "      padding: const EdgeInsets.all(15),\n      decoration: BoxDecoration(\n        color: AppColors.card,\n        borderRadius: BorderRadius.circular(22),",
            'case-badge': "                  padding: const EdgeInsets.symmetric(horizontal: 9, vertical: 6),\n                decoration: BoxDecoration(\n                  color: AppColors.brandSoft,",
            'qcm-panel': "              padding: const EdgeInsets.all(13),\n              decoration: BoxDecoration(\n                color: AppColors.paperAlt,\n                borderRadius: BorderRadius.circular(17),",
            'question': "                    style: TextStyle(\n                      color: AppColors.ink,\n                      fontSize: 13.5,",
            'correction': "                padding: const EdgeInsets.all(13),\n                decoration: BoxDecoration(\n                  color: (correct ? AppColors.success : AppColors.danger)",
          }
          for name, anchor in anchors.items():
              print(name, s.count(anchor))
          PY

      - name: Apply UI-only visual patch
        run: python3 .github/scripts/one_time_ui_practice_refresh.py

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq "OBSERVATION CLINIQUE" source/lib/screens/practice_screen.dart
          grep -Fq "Antécédents et histoire de la maladie" source/lib/screens/practice_screen.dart
          grep -Fq "borderRadius: BorderRadius.circular(26)" source/lib/screens/clinical_cases_section.dart
          grep -Fq "Votre progression sur les cas cliniques" source/lib/screens/practice_qcm_screen.dart
          git config user.name 'GardeFlow CI'
          git config user.email 'actions@users.noreply.github.com'
          git add source/lib/screens/practice_screen.dart source/lib/screens/clinical_cases_section.dart source/lib/screens/practice_qcm_screen.dart
          git commit -m 'style: refresh Practice patient forms clinical cases and QCM'
          git push origin HEAD:ui/practice-clinical-qcm-refresh-20260930
