name: Finalize Practice 5 QCM UX

on:
  push:
    branches:
      - feature-practice-qcm-notifications-20260930
    paths:
      - '.github/workflows/practice-qcm5-finalize.yml'
      - '.github/scripts/finalize_practice_qcm5_notifications.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-practice-qcm-notifications-20260930

      - name: Apply final UX patch
        run: python3 .github/scripts/finalize_practice_qcm5_notifications.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Format
        run: dart format source/lib/screens/clinical_cases_section.dart source/lib/services/push_notification_service.dart source/lib/screens/home_screen.dart

      - name: Test
        working-directory: source
        run: flutter test

      - name: Analyze
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build web release
        working-directory: source
        run: flutter build web --release --base-href "/GardeFlow/"

      - name: Commit final UX
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/lib/screens/clinical_cases_section.dart source/lib/services/push_notification_service.dart source/lib/screens/home_screen.dart
          git commit -m 'refactor: finalize Practice QCM AI UX and push routing'
          git push origin HEAD:feature-practice-qcm-notifications-20260930
