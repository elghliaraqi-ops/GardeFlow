name: Practice All QCM Medical Images
on:
  pull_request:
    branches: [main]
    paths:
      - 'source/supabase/functions/practice-medical-images/**'
      - 'supabase/functions/practice-medical-images/**'
      - 'source/supabase/functions/generate-practice-daily-challenge/**'
      - 'source/supabase/functions/generate-practice-progressive-case/**'
      - 'source/supabase/functions/generate-clinical-case-qcm/**'
      - 'source/supabase/functions/preview-clinical-case-qcm/**'
      - 'source/lib/widgets/practice_qcm_medical_illustration.dart'
      - 'source/lib/services/practice_google_image_cache.dart'
      - 'source/test/practice_google_image_cache_test.dart'
      - 'source/lib/screens/clinical_cases_section.dart'
      - 'source/lib/screens/practice_daily_screen.dart'
      - 'source/lib/screens/practice_progressive_cases_screen.dart'
      - 'source/test/practice_qcm_medical_illustration_test.dart'
      - '.github/workflows/practice-all-qcm-medical-images.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify shared backend and all QCM image contracts
        shell: bash
        run: |
          set -euo pipefail
          for fn in generate-clinical-case-qcm generate-practice-daily-challenge generate-practice-progressive-case preview-clinical-case-qcm; do
            deno check "source/supabase/functions/$fn/medical_image_contract.ts"
            cmp "source/supabase/functions/$fn/medical_image_contract.ts" "supabase/functions/$fn/medical_image_contract.ts"
            cmp "source/supabase/functions/$fn/index.ts" "supabase/functions/$fn/index.ts"
          done
          cmp source/supabase/functions/practice-medical-images/index.ts supabase/functions/practice-medical-images/index.ts
          cmp source/supabase/functions/practice-medical-images/medical_image_previews.ts supabase/functions/practice-medical-images/medical_image_previews.ts
          deno check source/supabase/functions/practice-medical-images/index.ts
          deno check source/supabase/functions/generate-practice-daily-challenge/index.ts
          deno check source/supabase/functions/generate-practice-progressive-case/index.ts
          deno check source/supabase/functions/preview-clinical-case-qcm/index.ts
          deno test --allow-env=SERPAPI_KEY source/supabase/functions/practice-medical-images/medical_image_previews_test.ts
          deno test source/supabase/functions/generate-practice-daily-challenge/medical_image_contract_test.ts
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - working-directory: source
        run: flutter pub get
      - name: Dart format + targeted analysis
        working-directory: source
        run: |
          dart format lib/services/practice_google_image_cache.dart test/practice_google_image_cache_test.dart lib/widgets/practice_qcm_medical_illustration.dart lib/screens/clinical_cases_section.dart lib/screens/practice_daily_screen.dart lib/screens/practice_progressive_cases_screen.dart test/practice_qcm_medical_illustration_test.dart
          flutter analyze lib/services/practice_google_image_cache.dart lib/widgets/practice_qcm_medical_illustration.dart lib/screens/clinical_cases_section.dart lib/screens/practice_daily_screen.dart lib/screens/practice_progressive_cases_screen.dart --no-fatal-infos --no-fatal-warnings
      - name: QCM UI and existing flows
        working-directory: source
        run: |
          flutter test test/practice_google_image_cache_test.dart
          flutter test test/practice_qcm_medical_illustration_test.dart
          flutter test test/practice_external_medical_media_policy_test.dart
          flutter test test/practice_progressive_cases_screen_test.dart
          flutter test test/clinical_case_qcm_preview_test.dart
