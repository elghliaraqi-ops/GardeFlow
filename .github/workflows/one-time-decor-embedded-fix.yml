name: One-time decor embedded visibility fix

on:
  push:
    branches:
      - style/full-app-decor-refresh-20261001
    paths:
      - '.github/workflows/one-time-decor-embedded-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: style/full-app-decor-refresh-20261001
          fetch-depth: 0

      - name: Ensure decorations stay visible on opaque and embedded views
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('source/lib')

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Marker not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          decor = root / 'theme/screen_decor.dart'
          text = decor.read_text(encoding='utf-8')
          old = "        body: body,\n        floatingActionButton: floatingActionButton,"
          new = "        body: body == null\n            ? null\n            : _DecorForeground(scene: scene, child: body!),\n        floatingActionButton: floatingActionButton,"
          if old not in text:
              raise SystemExit('DecorScaffold body marker not found')
          text = text.replace(old, new, 1)
          marker = 'class DecorSectionBanner extends StatelessWidget {'
          foreground = r'''
class _DecorForeground extends StatelessWidget {
  final ScreenDecorScene scene;
  final Widget child;

  const _DecorForeground({required this.scene, required this.child});

  @override
  Widget build(BuildContext context) {
    final accent = scene.accent;
    final dark = AppColors.isDarkMode;
    return Stack(
      fit: StackFit.expand,
      children: [
        child,
        IgnorePointer(
          child: Stack(
            children: [
              Positioned(
                right: -26,
                top: 18,
                child: Transform.rotate(
                  angle: -.13,
                  child: Icon(
                    scene.primaryIcon,
                    size: 112,
                    color: accent.withOpacity(dark ? .045 : .032),
                  ),
                ),
              ),
              Positioned(
                left: -18,
                bottom: 54,
                child: Transform.rotate(
                  angle: .15,
                  child: Icon(
                    scene.secondaryIcon,
                    size: 82,
                    color: accent.withOpacity(dark ? .034 : .026),
                  ),
                ),
              ),
            ],
          ),
        ),
      ],
    );
  }
}

'''
          if marker not in text:
              raise SystemExit('DecorSectionBanner marker not found')
          text = text.replace(marker, foreground + marker, 1)
          decor.write_text(text, encoding='utf-8')

          replace_once(
              root / 'screens/practice_screen.dart',
              "    return ColoredBox(\n      color: PracticeColors.background,\n      child: SafeArea(",
              "    return ScreenDecorBackdrop(\n      scene: ScreenDecorScene.practice,\n      baseColor: PracticeColors.background,\n      child: SafeArea(",
          )
          replace_once(
              root / 'screens/junior_oncall_screen.dart',
              "      return ColoredBox(\n        color: theme.scaffoldBackgroundColor,\n        child: RefreshIndicator(",
              "      return ScreenDecorBackdrop(\n        scene: ScreenDecorScene.onCall,\n        baseColor: theme.scaffoldBackgroundColor,\n        child: RefreshIndicator(",
          )
          replace_once(
              root / 'screens/senior_oncall_screen.dart',
              "      return ColoredBox(\n        color: AppColors.paper,\n        child: RefreshIndicator(",
              "      return ScreenDecorBackdrop(\n        scene: ScreenDecorScene.onCall,\n        baseColor: AppColors.paper,\n        child: RefreshIndicator(",
          )
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format shared decor layer
        working-directory: source
        run: dart format lib/theme/screen_decor.dart

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Analyze
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build web release
        working-directory: source
        run: flutter build web --release --base-href '/GardeFlow/' --build-name '12.0.0' --build-number '300'

      - name: Clean generated files
        run: |
          rm -rf source/.dart_tool source/build
          rm -f source/.flutter-plugins source/.flutter-plugins-dependencies
          git checkout -- source/pubspec.lock 2>/dev/null || true
          rm -f .github/workflows/one-time-decor-embedded-fix.yml

      - name: Verify intended source-only patch
        run: |
          git add -A
          git diff --cached --name-status
          bad=$(git diff --cached --name-only | grep -Ev '^(source/lib/theme/screen_decor\.dart|source/lib/screens/practice_screen\.dart|source/lib/screens/junior_oncall_screen\.dart|source/lib/screens/senior_oncall_screen\.dart|\.github/workflows/one-time-decor-embedded-fix\.yml)$' || true)
          if [ -n "$bad" ]; then
            echo "Unexpected paths:"
            echo "$bad"
            exit 1
          fi
          grep -q '_DecorForeground' source/lib/theme/screen_decor.dart
          grep -q 'ScreenDecorBackdrop' source/lib/screens/practice_screen.dart
          grep -q 'ScreenDecorBackdrop' source/lib/screens/junior_oncall_screen.dart
          grep -q 'ScreenDecorBackdrop' source/lib/screens/senior_oncall_screen.dart

      - name: Commit visibility fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: garantir les décors sur les vues intégrées'
          git push origin HEAD:style/full-app-decor-refresh-20261001
