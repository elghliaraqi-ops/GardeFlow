name: One-time lock avatar dependencies

on:
  push:
    branches:
      - feature/junior-gaming-avatars-finalize
    paths:
      - '.github/workflows/one_time_lock_avatar_dependencies.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/junior-gaming-avatars-finalize
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Refresh lockfile
        working-directory: source
        run: flutter pub get
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- source/pubspec.lock; then
            echo 'Lockfile already up to date.'
            exit 0
          fi
          git config user.name 'GardeFlow CI'
          git config user.email 'actions@users.noreply.github.com'
          git add source/pubspec.lock
          git commit -m 'Lock avatar rendering dependencies'
          git push origin HEAD:feature/junior-gaming-avatars-finalize
