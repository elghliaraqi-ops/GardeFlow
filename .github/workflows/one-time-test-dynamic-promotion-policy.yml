name: Test dynamic promotion policy

on:
  push:
    branches:
      - audit-fixes-v11.6.70
    paths:
      - .github/workflows/one-time-test-dynamic-promotion-policy.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-v11.6.70
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Run dynamic promotion regression tests
        working-directory: source
        run: |
          flutter pub get
          flutter test test/intern_promotions_test.dart
