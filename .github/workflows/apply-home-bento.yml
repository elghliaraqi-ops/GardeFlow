                    decoration: BoxDecoration(
                      color: AppColors.card,
                      borderRadius: BorderRadius.circular(18),
                      border: Border.all(color: AppColors.line),
                    ),
                    child: Row(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Icon(icon, color: AppColors.brandBright, size: 19),
                        const SizedBox(width: 6),
                        Flexible(
                          child: Text(
                            label,
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                            style: TextStyle(
                              color: AppColors.ink,
                              fontSize: 11.5,
                              fontWeight: FontWeight.w850,
                            ),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class _HomeNewsShortcut extends StatelessWidget {
            final VoidCallback onTap;

            const _HomeNewsShortcut({required this.onTap});

            @override
            Widget build(BuildContext context) {
              return Material(
                color: Colors.transparent,
                child: InkWell(
                  onTap: onTap,
                  borderRadius: BorderRadius.circular(20),
                  child: Ink(
                    padding: const EdgeInsets.fromLTRB(14, 12, 12, 12),
                    decoration: BoxDecoration(
                      color: AppColors.card,
                      borderRadius: BorderRadius.circular(20),
                      border: Border.all(color: AppColors.line),
                    ),
                    child: Row(
                      children: [
                        Container(
                          width: 40,
                          height: 40,
                          decoration: BoxDecoration(
                            color: AppColors.brand.withOpacity(0.10),
                            borderRadius: BorderRadius.circular(13),
                          ),
                          child: Icon(
                            Icons.dynamic_feed_rounded,
                            color: AppColors.brandBright,
                            size: 21,
                          ),
                        ),
                        const SizedBox(width: 11),
                        Expanded(
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text(
                                'Actualités du jour',
                                style: TextStyle(
                                  color: AppColors.ink,
                                  fontSize: 13,
                                  fontWeight: FontWeight.w900,
                                ),
                              ),
                              const SizedBox(height: 2),
                              Text(
                                'Annonces et informations utiles',
                                maxLines: 1,
                                overflow: TextOverflow.ellipsis,
                                style: TextStyle(
                                  color: AppColors.inkSoft,
                                  fontSize: 10.5,
                                  fontWeight: FontWeight.w600,
                                ),
                              ),
                            ],
                          ),
                        ),
                        const SizedBox(width: 8),
                        Container(
                          width: 36,
                          height: 36,
                          decoration: BoxDecoration(
                            color: AppColors.paper,
                            borderRadius: BorderRadius.circular(12),
                            border: Border.all(color: AppColors.line),
                          ),
                          child: Icon(
                            Icons.keyboard_arrow_down_rounded,
                            color: AppColors.brandBright,
                            size: 22,
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }'''

          text = text[:dashboard_start] + dashboard + '\n\n' + text[dashboard_end:]

          guard_start = text.index('class _NextGuardCard extends StatelessWidget {')
          guard_end = text.index('class _DashboardAction extends StatelessWidget {')

          guard = r'''class _NextGuardCard extends StatelessWidget {
            final PlanningEntry? entry;
            final VoidCallback onTap;

            const _NextGuardCard({required this.entry, required this.onTap});

            @override
            Widget build(BuildContext context) {
              if (entry == null) {
                return Material(
                  color: Colors.transparent,
                  child: InkWell(
                    onTap: onTap,
                    borderRadius: BorderRadius.circular(24),
                    child: Ink(
                      padding: const EdgeInsets.all(16),
                      decoration: BoxDecoration(
                        color: AppColors.card,
                        borderRadius: BorderRadius.circular(24),
                        border: Border.all(color: AppColors.line),
                        boxShadow: AppShadow.low,
                      ),
                      child: Row(
                        children: [
                          Container(
                            width: 48,
                            height: 48,
                            decoration: BoxDecoration(
                              color: AppColors.brand.withOpacity(0.10),
                              borderRadius: BorderRadius.circular(16),
                            ),
                            child: Icon(
                              Icons.event_available_rounded,
                              color: AppColors.brandBright,
                              size: 25,
                            ),
                          ),
                          const SizedBox(width: 12),
                          Expanded(
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text(
                                  'Prochaine garde',
                                  style: TextStyle(
                                    color: AppColors.ink,
                                    fontFamily: 'SpaceGrotesk',
                                    fontSize: 16,
                                    fontWeight: FontWeight.w900,
                                  ),
                                ),
                                const SizedBox(height: 3),
                                Text(
                                  'Aucune garde validée à venir.',
                                  style: TextStyle(
                                    color: AppColors.inkSoft,
                                    fontSize: 11.5,
                                    fontWeight: FontWeight.w600,
                                  ),
                                ),
                              ],
                            ),
                          ),
                          Icon(
                            Icons.chevron_right_rounded,
                            color: AppColors.inkFaint,
                            size: 24,
                          ),
                        ],
                      ),
                    ),
                  ),
                );
              }

              final current = entry!;
              final shift = ShiftCatalog.byId(current.shiftId);
              final shiftId = shift.id.toLowerCase();
              final shiftLabel = shift.label.trim();

              final isUrgence = shiftId.startsWith('urg-') ||
                  shiftId.contains('urgence') ||
                  shiftLabel.toLowerCase().contains('urgence');
              final is24h = shiftId.contains('24h') ||
                  shiftId.contains('24-h') ||
                  shiftLabel.toLowerCase().contains('24h');
              final isNight = !is24h &&
                  (shiftId.contains('nuit') ||
                      shiftLabel.toLowerCase().contains('nuit'));

              final category = isUrgence ? 'URGENCES' : 'SERVICE';
              final period = is24h
                  ? '24H'
                  : isNight
                      ? 'NUIT'
                      : 'JOUR';

              final date = DateTime.tryParse(current.dateStr);
              final dateLabel = date == null
                  ? current.dateStr
                  : DateFormat('EEE d MMMM', 'fr_FR').format(date);
              final timeLabel = is24h
                  ? '08:00 → 08:00'
                  : isNight
                      ? '20:00 → 08:00'
                      : '08:00 → 20:00';

              final guardTitle = shiftLabel.isEmpty
                  ? 'Garde de ${period.toLowerCase()}'
                  : shiftLabel;

              final colors = is24h
                  ? const [Color(0xFF287CC7), Color(0xFF0B1C35)]
                  : isNight
                      ? const [Color(0xFF0A1729), Color(0xFF123D70)]
                      : const [Color(0xFF25AFE9), Color(0xFF0879D7)];
              final accent = isUrgence
                  ? const Color(0xFFFFD5DA)
                  : isNight
                      ? const Color(0xFFFFE9A8)
                      : const Color(0xFFFFE06D);

              String countdownLabel = 'À venir';
              if (date != null) {
                final today = DateTime.now();
                final startToday = DateTime(today.year, today.month, today.day);
                final guardDay = DateTime(date.year, date.month, date.day);
                final days = guardDay.difference(startToday).inDays;
                if (days == 0) {
                  countdownLabel = "Aujourd'hui";
                } else if (days == 1) {
                  countdownLabel = 'Demain';
                } else if (days > 1) {
                  countdownLabel = 'Dans $days jours';
                }
              }

              return Material(
                color: Colors.transparent,
                child: InkWell(
                  onTap: onTap,
                  borderRadius: BorderRadius.circular(26),
                  child: Ink(
                    width: double.infinity,
                    padding: const EdgeInsets.fromLTRB(16, 15, 14, 15),
                    decoration: BoxDecoration(
                      gradient: LinearGradient(
                        begin: Alignment.topLeft,
                        end: Alignment.bottomRight,
                        colors: colors,
                      ),
                      borderRadius: BorderRadius.circular(26),
                      boxShadow: [
                        BoxShadow(
                          color: colors.last.withOpacity(0.20),
                          blurRadius: 20,
                          offset: const Offset(0, 9),
                        ),
                      ],
                    ),
                    child: Stack(
                      children: [
                        Positioned(
                          right: -28,
                          bottom: -42,
                          child: Container(
                            width: 120,
                            height: 120,
                            decoration: BoxDecoration(
                              shape: BoxShape.circle,
                              color: Colors.white.withOpacity(0.06),
                            ),
                          ),
                        ),
                        Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              children: [
                                Container(
                                  width: 46,
                                  height: 46,
                                  decoration: BoxDecoration(
                                    color: Colors.white.withOpacity(0.14),
                                    borderRadius: BorderRadius.circular(15),
                                    border: Border.all(
                                      color: Colors.white.withOpacity(0.15),
                                    ),
                                  ),
                                  child: Icon(
                                    is24h
                                        ? Icons.brightness_6_rounded
                                        : isNight
                                            ? Icons.nightlight_round
                                            : Icons.wb_sunny_rounded,
                                    color: accent,
                                    size: 24,
                                  ),
                                ),
                                const SizedBox(width: 11),
                                Expanded(
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Text(
                                        'PROCHAINE GARDE · $countdownLabel',
                                        maxLines: 1,
                                        overflow: TextOverflow.ellipsis,
                                        style: TextStyle(
                                          color: Colors.white.withOpacity(0.74),
                                          fontSize: 9.5,
                                          fontWeight: FontWeight.w900,
                                          letterSpacing: 0.45,
                                        ),
                                      ),
                                      const SizedBox(height: 3),
                                      Text(
                                        '$category · $period',
                                        maxLines: 1,
                                        overflow: TextOverflow.ellipsis,
                                        style: const TextStyle(
                                          color: Colors.white,
                                          fontFamily: 'SpaceGrotesk',
                                          fontSize: 20,
                                          height: 1.05,
                                          fontWeight: FontWeight.w900,
                                        ),
                                      ),
                                    ],
                                  ),
                                ),
                                Container(
                                  width: 38,
                                  height: 38,
                                  decoration: BoxDecoration(
                                    color: Colors.white.withOpacity(0.12),
                                    borderRadius: BorderRadius.circular(13),
                                  ),
                                  child: Icon(
                                    Icons.arrow_forward_rounded,
                                    color: Colors.white.withOpacity(0.92),
                                    size: 20,
                                  ),
                                ),
                              ],
                            ),
                            const SizedBox(height: 12),
                            Text(
                              guardTitle,
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              style: TextStyle(
                                color: Colors.white.withOpacity(0.90),
                                fontSize: 12.5,
                                fontWeight: FontWeight.w750,
                              ),
                            ),
                            const SizedBox(height: 10),
                            Wrap(
                              spacing: 7,
                              runSpacing: 7,
                              children: [
                                _GuardMetaChip(
                                  icon: Icons.calendar_month_rounded,
                                  text: dateLabel,
                                ),
                                _GuardMetaChip(
                                  icon: Icons.schedule_rounded,
                                  text: timeLabel,
                                ),
                                _GuardMetaChip(
                                  icon: isUrgence
                                      ? Icons.emergency_rounded
                                      : Icons.medical_services_rounded,
                                  text: isUrgence ? 'Urgences' : 'Service',
                                ),
                              ],
                            ),
                          ],
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class _GuardMetaChip extends StatelessWidget {
            final IconData icon;
            final String text;

            const _GuardMetaChip({required this.icon, required this.text});

            @override
            Widget build(BuildContext context) {
              return Container(
                padding: const EdgeInsets.symmetric(horizontal: 9, vertical: 7),
                decoration: BoxDecoration(
                  color: Colors.white.withOpacity(0.11),
                  borderRadius: BorderRadius.circular(999),
                  border: Border.all(color: Colors.white.withOpacity(0.11)),
                ),
                child: Row(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    Icon(icon, color: Colors.white.withOpacity(0.88), size: 14),
                    const SizedBox(width: 5),
                    Text(
                      text,
                      style: TextStyle(
                        color: Colors.white.withOpacity(0.92),
                        fontSize: 10.5,
                        fontWeight: FontWeight.w750,
                      ),
                    ),
                  ],
                ),
              );
            }
          }'''

          text = text[:guard_start] + guard + '\n\n' + text[guard_end:]
          path.write_text(text, encoding='utf-8')
          PY

