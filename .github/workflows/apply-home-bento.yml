name: Apply Home Bento Refactor

on:
  push:
    branches:
      - ux/home-bento-v12
    paths:
      - .github/workflows/apply-home-bento.yml

permissions:
  contents: write

jobs:
  patch-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/home-bento-v12
          fetch-depth: 0

      - name: Apply ergonomic home refactor
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('source/lib/screens/home_screen.dart')
          text = path.read_text(encoding='utf-8')

          dashboard_start = text.index('class _DashboardView extends StatelessWidget {')
          dashboard_end = text.index('class _MonthlyGuardChip extends StatelessWidget {')

          dashboard = r'''class _DashboardView extends StatelessWidget {
            final AppState appState;
            final GlobalKey newsFeedKey;
            final ScrollController scrollController;
            final VoidCallback onOpenPlanning;
            final VoidCallback onOpenDirectory;
            final VoidCallback onOpenProfile;

            const _DashboardView({
              required this.appState,
              required this.newsFeedKey,
              required this.scrollController,
              required this.onOpenPlanning,
              required this.onOpenDirectory,
              required this.onOpenProfile,
            });

            List<PlanningEntry> _futureGuards(AppUser me) {
              final entries = appState.planning
                  .where(
                    (entry) =>
                        (entry.ownerId == me.id || entry.ownerPhone == me.phone) &&
                        entry.shiftId != 'conge' &&
                        appState.isPlanningEntryApproved(entry) &&
                        !appState.guardHasStarted(entry),
                  )
                  .toList()
                ..sort((a, b) {
                  final ad = DateTime.parse(a.dateStr);
                  final bd = DateTime.parse(b.dateStr);
                  final cmp = ad.compareTo(bd);
                  if (cmp != 0) return cmp;
                  final ashift = ShiftCatalog.byId(a.shiftId);
                  final bshift = ShiftCatalog.byId(b.shiftId);
                  return (ashift.start ?? '').compareTo(bshift.start ?? '');
                });
              return entries;
            }

            int _guardsThisMonth(AppUser me, DateTime now) {
              return appState.planning.where((entry) {
                if (entry.ownerId != me.id && entry.ownerPhone != me.phone) return false;
                if (entry.shiftId == 'conge') return false;
                final date = DateTime.tryParse(entry.dateStr);
                if (date == null) return false;
                return date.year == now.year && date.month == now.month;
              }).length;
            }

            int _guardsThisMonthByCategory(
              AppUser me,
              DateTime now, {
              required bool urgence,
            }) {
              return appState.planning.where((entry) {
                if (entry.ownerId != me.id && entry.ownerPhone != me.phone) return false;
                if (entry.shiftId == 'conge') return false;
                final date = DateTime.tryParse(entry.dateStr);
                if (date == null || date.year != now.year || date.month != now.month) {
                  return false;
                }
                final id = entry.shiftId.toLowerCase();
                final isUrgence = id.contains('urg');
                return urgence ? isUrgence : !isUrgence;
              }).length;
            }

            @override
            Widget build(BuildContext context) {
              final me = appState.currentUser;
              if (me == null) {
                return const Center(child: CircularProgressIndicator());
              }

              final future = _futureGuards(me);
              final next = future.isEmpty ? null : future.first;
              final now = DateTime.now();
              final isNight = now.hour >= 18 || now.hour < 6;
              final greeting = isNight ? 'Bonsoir' : 'Bonjour';
              final monthlyCount = _guardsThisMonth(me, now);
              final urgenceMonthlyCount = _guardsThisMonthByCategory(
                me,
                now,
                urgence: true,
              );
              final serviceMonthlyCount = _guardsThisMonthByCategory(
                me,
                now,
                urgence: false,
              );

              final rawDate = DateFormat('EEEE d MMMM yyyy', 'fr_FR').format(now);
              final dateLabel = rawDate.isEmpty
                  ? ''
                  : rawDate[0].toUpperCase() + rawDate.substring(1);
              final timeLabel = DateFormat('HH:mm').format(now);

              return SingleChildScrollView(
                controller: scrollController,
                physics: const BouncingScrollPhysics(),
                padding: const EdgeInsets.fromLTRB(16, 14, 16, 30),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    _HomeHeroCard(
                      user: me,
                      greeting: greeting,
                      dateLabel: dateLabel,
                      timeLabel: timeLabel,
                      isNight: isNight,
                      monthlyCount: monthlyCount,
                      urgenceCount: urgenceMonthlyCount,
                      serviceCount: serviceMonthlyCount,
                    ),
                    const SizedBox(height: 14),
                    _NextGuardCard(entry: next, onTap: onOpenPlanning),
                    const SizedBox(height: 14),
                    PracticeHomeSummary(appState: appState, user: me),
                    const SizedBox(height: 14),
                    _HomeQuickRow(
                      onPlanning: onOpenPlanning,
                      onPractice: onOpenDirectory,
                      onProfile: onOpenProfile,
                    ),
                    const SizedBox(height: 14),
                    _HomeNewsShortcut(
                      onTap: () {
                        final targetContext = newsFeedKey.currentContext;
                        if (targetContext == null) return;
                        Scrollable.ensureVisible(
                          targetContext,
                          duration: const Duration(milliseconds: 480),
                          curve: Curves.easeOutCubic,
                          alignment: 0.04,
                        );
                      },
                    ),
                    const SizedBox(height: 12),
                    DailyNewsSection(verticalFeedKey: newsFeedKey),
                  ],
                ),
              );
            }
          }

          class _HomeHeroCard extends StatelessWidget {
            final AppUser user;
            final String greeting;
            final String dateLabel;
            final String timeLabel;
            final bool isNight;
            final int monthlyCount;
            final int urgenceCount;
            final int serviceCount;

            const _HomeHeroCard({
              required this.user,
              required this.greeting,
              required this.dateLabel,
              required this.timeLabel,
              required this.isNight,
              required this.monthlyCount,
              required this.urgenceCount,
              required this.serviceCount,
            });

            @override
            Widget build(BuildContext context) {
              final colors = isNight
                  ? const [Color(0xFF06101E), Color(0xFF102E53)]
                  : const [Color(0xFF2DB7F5), Color(0xFF087EE6)];
              final accent = isNight
                  ? const Color(0xFFFFE6A0)
                  : const Color(0xFFFFD54F);

              return Container(
                width: double.infinity,
                padding: const EdgeInsets.fromLTRB(18, 18, 18, 16),
                decoration: BoxDecoration(
                  gradient: LinearGradient(
                    begin: Alignment.topLeft,
                    end: Alignment.bottomRight,
                    colors: colors,
                  ),
                  borderRadius: BorderRadius.circular(26),
                  boxShadow: [
                    BoxShadow(
                      color: colors.last.withOpacity(0.20),
                      blurRadius: 22,
                      offset: const Offset(0, 10),
                    ),
                  ],
                ),
                child: Stack(
                  clipBehavior: Clip.none,
                  children: [
                    Positioned(
                      right: -8,
                      top: -12,
                      child: Container(
                        width: 78,
                        height: 78,
                        decoration: BoxDecoration(
                          shape: BoxShape.circle,
                          color: Colors.white.withOpacity(0.08),
                        ),
                      ),
                    ),
                    Positioned(
                      right: 12,
                      top: 7,
                      child: Icon(
                        isNight ? Icons.nightlight_round : Icons.wb_sunny_rounded,
                        color: accent.withOpacity(0.94),
                        size: 44,
                      ),
                    ),
                    Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Padding(
                          padding: const EdgeInsets.only(right: 62),
                          child: Text(
                            '$greeting Dr ${user.nom}',
                            maxLines: 2,
                            overflow: TextOverflow.ellipsis,
                            style: const TextStyle(
                              color: Colors.white,
                              fontFamily: 'SpaceGrotesk',
                              fontSize: 25,
                              height: 1.05,
                              fontWeight: FontWeight.w900,
                              letterSpacing: -0.6,
                            ),
                          ),
                        ),
                        const SizedBox(height: 9),
                        Row(
                          children: [
                            Icon(
                              Icons.schedule_rounded,
                              color: Colors.white.withOpacity(0.82),
                              size: 16,
                            ),
                            const SizedBox(width: 6),
                            Expanded(
                              child: Text(
                                '$dateLabel · $timeLabel',
                                maxLines: 1,
                                overflow: TextOverflow.ellipsis,
                                style: TextStyle(
                                  color: Colors.white.withOpacity(0.88),
                                  fontSize: 12.5,
                                  fontWeight: FontWeight.w650,
                                ),
                              ),
                            ),
                          ],
                        ),
                        const SizedBox(height: 15),
                        Row(
                          children: [
                            Expanded(
                              child: _HomeStatPill(
                                icon: Icons.calendar_month_rounded,
                                value: monthlyCount,
                                label: 'Ce mois',
                              ),
                            ),
                            const SizedBox(width: 8),
                            Expanded(
                              child: _HomeStatPill(
                                icon: Icons.emergency_rounded,
                                value: urgenceCount,
                                label: 'Urgences',
                              ),
                            ),
                            const SizedBox(width: 8),
                            Expanded(
                              child: _HomeStatPill(
                                icon: Icons.medical_services_rounded,
                                value: serviceCount,
                                label: 'Service',
                              ),
                            ),
                          ],
                        ),
                      ],
                    ),
                  ],
                ),
              );
            }
          }

          class _HomeStatPill extends StatelessWidget {
            final IconData icon;
            final int value;
            final String label;

            const _HomeStatPill({
              required this.icon,
              required this.value,
              required this.label,
