name: Verify Practice Daily Challenges

on:
  pull_request:
    branches: [main]
    paths:
      - 'source/lib/models/practice_daily_models.dart'
      - 'source/lib/services/practice_daily_service.dart'
      - 'source/lib/screens/practice_daily_screen.dart'
      - 'source/lib/screens/practice_daily_history_screen.dart'
      - 'supabase/migrations/*practice_daily_replay*'
      - 'source/lib/screens/practice_screen.dart'
      - 'source/lib/services/notification_service.dart'
      - 'source/test/practice_daily_models_test.dart'
      - 'supabase/functions/generate-practice-daily-challenge/**'
      - 'source/supabase/functions/generate-practice-daily-challenge/**'
      - 'supabase/migrations/*practice_daily*'
      - 'supabase/migrations/*practice_progressive*'
      - '.github/workflows/practice-daily-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: source
        run: flutter pub get
      - name: Check Dart formatting
        working-directory: source
        run: dart format --output=none --set-exit-if-changed lib/models/practice_daily_models.dart lib/services/practice_daily_service.dart lib/screens/practice_daily_screen.dart lib/screens/practice_daily_history_screen.dart test/practice_daily_models_test.dart
      - name: Test daily challenge models
        working-directory: source
        run: flutter test test/practice_daily_models_test.dart
      - name: Analyze daily challenge UI and backend
        working-directory: source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/models/practice_daily_models.dart lib/services/practice_daily_service.dart lib/screens/practice_daily_screen.dart lib/screens/practice_screen.dart lib/services/notification_service.dart lib/screens/practice_daily_history_screen.dart
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Groq daily challenge
        run: |
          deno check supabase/functions/generate-practice-daily-challenge/index.ts
          deno check source/supabase/functions/generate-practice-daily-challenge/index.ts
          test "$(sha256sum supabase/functions/generate-practice-daily-challenge/index.ts | cut -d' ' -f1)" = "$(sha256sum source/supabase/functions/generate-practice-daily-challenge/index.ts | cut -d' ' -f1)"
      - name: Verify no public answer-key reads
        run: |
          grep -Fq 'revoke all on public.practice_daily_challenges,public.practice_daily_attempts from public,anon,authenticated' supabase/migrations/20261009002000_practice_daily_challenge.sql
          grep -Fq "questions jsonb not null" supabase/migrations/20261009002000_practice_daily_challenge.sql
          grep -Fq 'grant execute on function public.practice_daily_generation_claim(date,text) to service_role' supabase/migrations/20261009002500_practice_daily_generation_claim.sql
          grep -Fq 'case_stages' supabase/migrations/20261009030000_practice_progressive_case_stages.sql
          grep -Fq 'revoke all on public.practice_daily_replay_attempts from public,anon,authenticated;' supabase/migrations/20261009034500_practice_daily_replay_history.sql
          grep -Fq 'on conflict(id) do nothing' supabase/migrations/20261009034500_practice_daily_replay_history.sql
