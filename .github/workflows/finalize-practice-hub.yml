name: Finalize Practice Hub

on:
  push:
    branches:
      - ux/practice-hub-v12
    paths:
      - .github/workflows/finalize-practice-hub.yml

permissions:
  contents: write

jobs:
  finalize-practice:
    if: "${{ github.event.head_commit.message == 'chore finalize practice hub' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/practice-hub-v12
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix bounded layout and format
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('source/lib/screens/practice_screen.dart')
          text = path.read_text(encoding='utf-8')
          start = text.index('class _PracticeHubAction extends StatelessWidget {')
          end = text.index('class _PracticeGameHeader extends StatelessWidget {', start)
          segment = text[start:end]
          if 'const Spacer(),' not in segment:
              raise SystemExit('Expected PracticeHubAction spacer not found')
          segment = segment.replace('const Spacer(),', 'const SizedBox(height: 12),', 1)
          text = text[:start] + segment + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          dart format source/lib/screens/practice_screen.dart
          git diff --check

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Analyze
        working-directory: source
        run: flutter analyze

      - name: Tests
        working-directory: source
        run: flutter test

      - name: Commit finalized Practice hub
        shell: bash
        run: |
          git config user.name "elghliaraqi-ops"
          git config user.email "elghliaraqi@gmail.com"
          git add source/lib/screens/practice_screen.dart
          git rm .github/workflows/finalize-practice-hub.yml
          git commit -m "fix finalize Practice hub layout"
          git push origin HEAD:ux/practice-hub-v12
