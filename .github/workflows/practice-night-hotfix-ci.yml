name: Validate Practice Night Hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - fix-practice-night-disciplinary-20260929
    paths:
      - '.github/workflows/practice-night-hotfix-ci.yml'
      - 'ci/v12_practice/fix_practice_night_disciplinary.py'
      - 'source/lib/models/practice_models.dart'
      - 'source/test/practice_models_test.dart'

permissions:
  contents: write

concurrency:
  group: gardeflow-practice-night-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v5
        with:
          ref: fix-practice-night-disciplinary-20260929
          fetch-depth: 0

      - name: Apply guarded Practice hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/v12_practice/fix_practice_night_disciplinary.py
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'GardeFlow CI'
            git config user.email 'actions@users.noreply.github.com'
            git add source/lib/models/practice_models.dart source/test/practice_models_test.dart
            git commit -m 'fix(practice): detect night guards by morning date and include disciplinary guards'
            git push origin HEAD:fix-practice-night-disciplinary-20260929
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run Practice regression tests
        working-directory: source
        run: flutter test test/practice_models_test.dart

      - name: Analyze changed Practice model
        working-directory: source
        run: flutter analyze lib/models/practice_models.dart test/practice_models_test.dart --no-fatal-infos --no-fatal-warnings

      - name: Build Flutter Web release
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --enable-web
          if [ ! -f web/index.html ]; then
            flutter create --no-pub --platforms=web --project-name huim6_planning .
          fi
          flutter build web --release --base-href "/GardeFlow/"
          test -f build/web/index.html
          test -f build/web/main.dart.js
