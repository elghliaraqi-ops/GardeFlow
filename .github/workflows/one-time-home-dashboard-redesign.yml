name: One-time home dashboard redesign

on:
  push:
    branches:
      - home-dashboard-redesign-20261003
    paths:
      - .github/workflows/one-time-home-dashboard-redesign.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: home-dashboard-redesign-20261003
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Apply home dashboard redesign
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/patch_home_dashboard_redesign.py
          dart format source/lib/screens/home_screen.dart
          git diff --check
          grep -Fq "Annonces & échanges" source/lib/screens/home_screen.dart
          grep -Fq "_scrollHomeToTopAndRefresh" source/lib/screens/home_screen.dart
          grep -Fq "Color(0xFF310812)" source/lib/screens/home_screen.dart

      - name: Commit dashboard redesign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GardeFlow CI'
          git config user.email 'actions@users.noreply.github.com'
          git add source/lib/screens/home_screen.dart
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'feat: redesign home guard card announcements and navigation refresh'
          git push origin HEAD:home-dashboard-redesign-20261003
