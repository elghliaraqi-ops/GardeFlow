name: Rollback Web before senior service colors

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rollback-web-before-senior-colors.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gardeflow-web-pages
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_DIR: source
      APP_VERSION: 11.6.70
      BUILD_NUMBER: "230"
    steps:
      - name: Checkout web state before senior service colors
        uses: actions/checkout@v4
        with:
          ref: backup-before-senior-service-colors-20260922

      - name: Verify source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 11.6.70+230$' pubspec.yaml
          test -f lib/main.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Web platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter config --enable-web
          if [ ! -f web/index.html ]; then
            flutter create --no-pub --platforms=web --project-name huim6_planning .
          fi

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get

      - name: Build Flutter Web release
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build web --release \
            --base-href "/GardeFlow/" \
            --build-name "$APP_VERSION" \
            --build-number "$BUILD_NUMBER"
          test -f build/web/index.html
          test -f build/web/main.dart.js
          touch build/web/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/build/web

  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy previous Web state
        id: deployment
        uses: actions/deploy-pages@v4
