name: Test V11.6.14 Android

on:
  push:
    branches:
      - feature/reminders-junior-roster-v11-6-14
    paths:
      - '.github/workflows/inspect-v11614.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Materialize V11.6.14
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="GardeFlow_android_v11_6_0_official_pdf_auto_import.zip"
          rm -rf .ci-v11614
          mkdir -p .ci-v11614
          unzip -q "$ZIP" -d .ci-v11614
          PUBSPEC="$(find .ci-v11614 -type f -name pubspec.yaml -print -quit)"
          test -n "$PUBSPEC"
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          cd "$PROJECT_DIR"

          cat "$GITHUB_WORKSPACE"/ci/v11_6_1/overlay.part* > /tmp/v1161.patch
          patch -p1 < /tmp/v1161.patch
          cat "$GITHUB_WORKSPACE"/ci/v11_6_3/overlay.part* > /tmp/v1163.patch
          patch -p1 < /tmp/v1163.patch
          sed -i 's/^version: 11.6.3+163$/version: 11.6.4+164/' pubspec.yaml
          cat "$GITHUB_WORKSPACE"/ci/v11_6_5/overlay.part* > /tmp/v1165.patch
          patch -p1 < /tmp/v1165.patch
          sed -i 's/^version: 11.6.4+164$/version: 11.6.5+165/' pubspec.yaml
          cat "$GITHUB_WORKSPACE"/ci/v11_6_6/overlay.part* > /tmp/v1166.patch
          patch -p1 < /tmp/v1166.patch
          python3 "$GITHUB_WORKSPACE/ci/v11_6_7/apply_v11_6_7.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_8/apply_v11_6_8.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_9/apply_v11_6_9.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_10/apply_v11_6_10.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_11/apply_v11_6_11.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_12/apply_v11_6_12.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_13/apply_v11_6_13.py"
          python3 "$GITHUB_WORKSPACE/ci/v11_6_14/apply_v11_6_14.py"

          grep -q '^version: 11.6.14+174$' pubspec.yaml
          grep -q 'flutter_local_notifications: 19.5.0' pubspec.yaml
          grep -q 'gardeflow_guard_urgent_v3' lib/services/notification_service.dart
          ! grep -q 'requestExactAlarmsPermission' lib/services/notification_service.dart
          grep -q 'Tous les services' lib/screens/junior_oncall_screen.dart
          grep -q 'HUICK de Casablanca' lib/screens/junior_oncall_screen.dart
          ! grep -q 'Tous les établissements' lib/screens/junior_oncall_screen.dart

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ] || [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            rm -rf android
            flutter create --no-pub --platforms=android --org com.huim6 --project-name huim6_planning .
          fi
          test -f google-services.json
          cp -f google-services.json android/app/google-services.json
          dart tool/configure_android.dart
          grep -R -q 'androidx.window:window:1.0.0' android/app/build.gradle*

      - name: Resolve and format
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get
          dart format lib/services/notification_service.dart lib/screens/settings_screen.dart lib/screens/junior_oncall_screen.dart lib/state/app_state.dart

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --release

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: GardeFlow-v11.6.14-test-apk
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 2
