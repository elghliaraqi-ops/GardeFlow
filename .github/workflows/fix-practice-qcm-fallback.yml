name: Fix Practice QCM fallback display

on:
  push:
    branches:
      - fix-practice-qcm-fallback-20260930
    paths:
      - '.github/workflows/fix-practice-qcm-fallback.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-practice-qcm-fallback-20260930
          fetch-depth: 0

      - name: Apply guarded QCM fallback fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          screen = Path('source/lib/screens/clinical_cases_section.dart')
          replace_once(
              screen,
              """    final aiReady = available.length == 5 &&\n        available.every((qcm) => qcm.generationSource == 'openai');\n    _qcms = aiReady ? available : <ClinicalCaseQcm>[];\n""",
              """    final valid = available\n        .where((qcm) =>\n            qcm.id.trim().isNotEmpty &&\n            qcm.question.trim().isNotEmpty &&\n            qcm.options.length >= 2)\n        .toList(growable: false);\n    _qcms = valid.length >= 5\n        ? valid.take(5).toList(growable: false)\n        : <ClinicalCaseQcm>[];\n""",
              'QCM display gate',
          )
          replace_once(
              screen,
              "Les 5 QCM et leurs explications IA sont en préparation…",
              "Les QCM de ce cas sont en cours de préparation…",
              'QCM loading label',
          )

          service = Path('source/lib/services/clinical_case_service.dart')
          replace_once(
              service,
              """    // Les anciens cas/fallbacks sont enrichis en arrière-plan à la première\n    // consultation. La requête est dédupliquée pour toute la session.\n    for (final post in posts) {\n      final needsAi = post.qcms.length < 5 ||\n          post.qcms.any((qcm) => qcm.generationSource != 'openai');\n      if (needsAi && _enrichmentRequested.add(post.id)) {\n        unawaited(enrichQcmForPost(post.id));\n      }\n    }\n""",
              """    // Les anciens cas/fallbacks sont utilisables immédiatement puis enrichis\n    // par l'IA en arrière-plan. On déduplique uniquement une requête en cours :\n    // en cas d'échec temporaire, un prochain rafraîchissement pourra réessayer.\n    for (final post in posts) {\n      final needsAi = post.qcms.length < 5 ||\n          post.qcms.any((qcm) => qcm.generationSource != 'openai');\n      if (needsAi && _enrichmentRequested.add(post.id)) {\n        unawaited(\n          enrichQcmForPost(post.id).whenComplete(() {\n            _enrichmentRequested.remove(post.id);\n          }),\n        );\n      }\n    }\n""",
              'QCM enrichment retry',
          )
          PY

          dart format source/lib/screens/clinical_cases_section.dart source/lib/services/clinical_case_service.dart
          git diff --check
          grep -Fq "valid.length >= 5" source/lib/screens/clinical_cases_section.dart
          ! grep -Fq "final aiReady" source/lib/screens/clinical_cases_section.dart
          grep -Fq "_enrichmentRequested.remove(post.id)" source/lib/services/clinical_case_service.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Analyze Flutter code
        working-directory: source
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build web release
        working-directory: source
        run: flutter build web --release --base-href "/GardeFlow/"

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/lib/screens/clinical_cases_section.dart source/lib/services/clinical_case_service.dart
          git commit -m 'fix(practice): show fallback QCM immediately and retry AI enrichment'
          git push origin HEAD:fix-practice-qcm-fallback-20260930
