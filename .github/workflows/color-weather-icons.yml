name: Color weather icons

on:
  push:
    branches:
      - style/color-weather-icons-20261001

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/color-weather-icons-20261001
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Colorer soleil lune et nuages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('source/lib/screens/home_screen.dart')
          text = path.read_text(encoding='utf-8')
          original = text

          # Grand décor jour/nuit : soleil ou lune coloré + deux nuages colorés.
          pattern_simple = re.compile(
              r"child: Icon\(\n"
              r"(?P<indent>\s+)isNight \? Icons\.nightlight_round : Icons\.wb_sunny_rounded,\n"
              r"(?P=indent)size: 104,\n"
              r"(?P=indent)color: Colors\.white\.withOpacity\(0\.12\),\n"
              r"(?P=indent[:-2])\),"
          )

          def repl_simple(match):
              i = match.group('indent')
              base = i[:-2]
              return (
                  "child: SizedBox(\n"
                  f"{i}width: 112,\n"
                  f"{i}height: 104,\n"
                  f"{i}child: Stack(\n"
                  f"{i}  clipBehavior: Clip.none,\n"
                  f"{i}  children: [\n"
                  f"{i}    Icon(\n"
                  f"{i}      isNight ? Icons.nightlight_round : Icons.wb_sunny_rounded,\n"
                  f"{i}      size: 104,\n"
                  f"{i}      color: isNight\n"
                  f"{i}          ? const Color(0xFFFFF1B8).withOpacity(0.92)\n"
                  f"{i}          : const Color(0xFFFFD54F).withOpacity(0.94),\n"
                  f"{i}    ),\n"
                  f"{i}    Positioned(\n"
                  f"{i}      right: -8,\n"
                  f"{i}      bottom: 7,\n"
                  f"{i}      child: Icon(\n"
                  f"{i}        Icons.cloud_rounded,\n"
                  f"{i}        size: 44,\n"
                  f"{i}        color: const Color(0xFFE7F5FF).withOpacity(0.84),\n"
                  f"{i}      ),\n"
                  f"{i}    ),\n"
                  f"{i}    Positioned(\n"
                  f"{i}      right: 24,\n"
                  f"{i}      bottom: -1,\n"
                  f"{i}      child: Icon(\n"
                  f"{i}        Icons.cloud_rounded,\n"
                  f"{i}        size: 28,\n"
                  f"{i}        color: const Color(0xFFB9DDF4).withOpacity(0.72),\n"
                  f"{i}      ),\n"
                  f"{i}    ),\n"
                  f"{i}  ],\n"
                  f"{i}),\n"
                  f"{base}),"
              )

          text, simple_count = pattern_simple.subn(repl_simple, text)

          # Décor des cartes JOUR/NUIT/24H : couleur adaptée + nuages colorés.
          pattern_24h = re.compile(
              r"child: Icon\(\n"
              r"(?P<indent>\s+)is24h\n"
              r"(?P=indent)    \? Icons\.brightness_6_rounded\n"
              r"(?P=indent)    : isNight\n"
              r"(?P=indent)        \? Icons\.nightlight_round\n"
              r"(?P=indent)        : Icons\.wb_sunny_rounded,\n"
              r"(?P=indent)size: 102,\n"
              r"(?P=indent)color: Colors\.white\.withOpacity\(0\.12\),\n"
              r"(?P=indent[:-2])\),"
          )

          def repl_24h(match):
              i = match.group('indent')
              base = i[:-2]
              return (
                  "child: SizedBox(\n"
                  f"{i}width: 110,\n"
                  f"{i}height: 102,\n"
                  f"{i}child: Stack(\n"
                  f"{i}  clipBehavior: Clip.none,\n"
                  f"{i}  children: [\n"
                  f"{i}    Icon(\n"
                  f"{i}      is24h\n"
                  f"{i}          ? Icons.brightness_6_rounded\n"
                  f"{i}          : isNight\n"
                  f"{i}              ? Icons.nightlight_round\n"
                  f"{i}              : Icons.wb_sunny_rounded,\n"
                  f"{i}      size: 102,\n"
                  f"{i}      color: is24h\n"
                  f"{i}          ? const Color(0xFFBFE4FF).withOpacity(0.88)\n"
                  f"{i}          : isNight\n"
                  f"{i}              ? const Color(0xFFFFF1B8).withOpacity(0.92)\n"
                  f"{i}              : const Color(0xFFFFD54F).withOpacity(0.94),\n"
                  f"{i}    ),\n"
                  f"{i}    Positioned(\n"
                  f"{i}      right: -8,\n"
                  f"{i}      bottom: 6,\n"
                  f"{i}      child: Icon(\n"
                  f"{i}        Icons.cloud_rounded,\n"
                  f"{i}        size: 42,\n"
                  f"{i}        color: const Color(0xFFE7F5FF).withOpacity(0.82),\n"
                  f"{i}      ),\n"
                  f"{i}    ),\n"
                  f"{i}  ],\n"
                  f"{i}),\n"
                  f"{base}),"
              )

          text, h24_count = pattern_24h.subn(repl_24h, text)

          # Icône principale des cartes de garde : soleil/lune/24h également colorée.
          text, main_count = re.subn(
              r"child: Icon\(mainIcon, color: Colors\.white, size: 31\),",
              "child: Icon(\n"
              "                          mainIcon,\n"
              "                          color: is24h\n"
              "                              ? const Color(0xFFBFE4FF)\n"
              "                              : isNight\n"
              "                                  ? const Color(0xFFFFF1B8)\n"
              "                                  : const Color(0xFFFFD54F),\n"
              "                          size: 31,\n"
              "                        ),",
              text,
          )

          if text == original:
              raise SystemExit('Aucun changement applique')
          if simple_count < 1:
              raise SystemExit('Decor jour/nuit non trouve')
          if main_count < 1:
              raise SystemExit('Icone principale jour/nuit non trouvee')

          path.write_text(text, encoding='utf-8')
          print(f'decors jour/nuit colores: {simple_count}')
          print(f'decors 24h colores: {h24_count}')
          print(f'icones principales colorees: {main_count}')
          PY

          echo '--- occurrences météo après patch ---'
          grep -nE 'wb_sunny|nightlight|cloud_rounded|brightness_6' source/lib/screens/home_screen.dart || true

      - name: Vérifier format et compilation
        working-directory: source
        run: |
          dart format lib/screens/home_screen.dart
          flutter pub get
          flutter test
          flutter analyze lib tool --no-fatal-infos --no-fatal-warnings
          flutter build web --release --base-href "/GardeFlow/" --build-name "12.0.0" --build-number "300"

      - name: Vérifier le périmètre et committer
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- source/pubspec.lock || true
          rm -f .github/workflows/color-weather-icons.yml
          git add source/lib/screens/home_screen.dart .github/workflows/color-weather-icons.yml
          CHANGED="$(git diff --cached --name-only)"
          echo "$CHANGED"
          test "$CHANGED" = $'.github/workflows/color-weather-icons.yml\nsource/lib/screens/home_screen.dart' || \
          test "$CHANGED" = $'source/lib/screens/home_screen.dart\n.github/workflows/color-weather-icons.yml'
          git config user.name "gardeflow-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "style: colorer soleil lune et nuages"
          git push origin HEAD:style/color-weather-icons-20261001
