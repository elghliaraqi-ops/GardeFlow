name: Lighten home hero

on:
  push:
    branches:
      - style/lighten-home-hero-20261001

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
      - name: Simplifier la carte d'accueil
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('source/lib/screens/home_screen.dart')
          text = path.read_text()

          old = """                    PracticeHomeSummary(appState: appState, user: me),
                    SizedBox(height: 12),
                    Row(
"""
          new = """                    SizedBox(height: 12),
                    Row(
"""
          if old not in text:
              raise SystemExit('Bloc Practice dans le hero introuvable')
          text = text.replace(old, new, 1)

          old_date = """                            'On est le $dateLabel, il est $timeLabel',
"""
          new_date = """                            '$dateLabel · $timeLabel',
"""
          if old_date not in text:
              raise SystemExit('Texte date/heure introuvable')
          text = text.replace(old_date, new_date, 1)

          pattern = re.compile(r"""                    SizedBox\(height: 17\),\n                    Container\(\n.*?_MonthlyGuardChip\(\n                                label: 'Service',\n                                value: serviceMonthlyCount,\n                              \),\n                            \],\n                          \),\n                        \],\n                      \),\n                    \),\n""", re.S)
          replacement = """                    SizedBox(height: 14),
                    Container(
                      padding: EdgeInsets.symmetric(horizontal: 13, vertical: 10),
                      decoration: BoxDecoration(
                        color: Colors.white.withOpacity(0.13),
                        borderRadius: BorderRadius.circular(14),
                        border: Border.all(color: Colors.white.withOpacity(0.14)),
                      ),
                      child: Row(
                        children: [
                          Icon(
                            Icons.calendar_month_rounded,
                            color: Colors.white,
                            size: 18,
                          ),
                          SizedBox(width: 7),
                          Expanded(
                            child: Text(
                              '$monthlyCount garde${monthlyCount > 1 ? 's' : ''} ce mois',
                              style: TextStyle(
                                color: Colors.white,
                                fontSize: 12.5,
                                fontWeight: FontWeight.w900,
                              ),
                            ),
                          ),
                          Container(
                            padding: EdgeInsets.symmetric(horizontal: 8, vertical: 5),
                            decoration: BoxDecoration(
                              color: Colors.white.withOpacity(0.10),
                              borderRadius: BorderRadius.circular(999),
                            ),
                            child: Text(
                              'Urg. $urgenceMonthlyCount · Serv. $serviceMonthlyCount',
                              style: TextStyle(
                                color: Colors.white.withOpacity(0.90),
                                fontSize: 9.5,
                                fontWeight: FontWeight.w800,
                              ),
                            ),
                          ),
                        ],
                      ),
                    ),
"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Bloc statistiques mensuelles remplacé {count} fois')

          old_after = """          ),
          SizedBox(height: 24),
          Text(
            'Prochaine garde à venir',
"""
          new_after = """          ),
          PracticeHomeSummary(appState: appState, user: me),
          SizedBox(height: 20),
          Text(
            'Prochaine garde à venir',
"""
          if old_after not in text:
              raise SystemExit('Point insertion Practice hors hero introuvable')
          text = text.replace(old_after, new_after, 1)

          path.write_text(text)
      - name: Commit visual change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/lib/screens/home_screen.dart
          git commit -m "style: alléger la carte principale de l'accueil"
          git push
      - name: Install dependencies
        working-directory: source
        run: flutter pub get
      - name: Run tests
        working-directory: source
        run: flutter test
      - name: Analyze Flutter code
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings
      - name: Build Flutter Web release
        working-directory: source
        run: flutter build web --release --base-href "/GardeFlow/" --build-name "12.0.0" --build-number "301"
