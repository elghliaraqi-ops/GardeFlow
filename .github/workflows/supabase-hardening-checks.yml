name: Supabase hardening checks

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'source/supabase/functions/analyze-official-roster-pdf/**'
  push:
    branches:
      - hardening-20261003
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'

permissions:
  contents: read

jobs:
  sql-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify hardening migration invariants
        shell: bash
        run: |
          set -euo pipefail
          FILE='supabase/migrations/20261003070000_gardeflow_business_rule_hardening.sql'
          test -f "$FILE"
          grep -Fq "set search_path = ''" "$FILE"
          grep -Fq "review_planning_month" "$FILE"
          grep -Fq "clinical_case_qcm_response_events" "$FILE"
          grep -Fq "auto_validation_blocked" "$FILE"
          grep -Fq "v_involves_emergency" "$FILE"
          echo 'Hardening migration static invariants verified.'

      - name: Verify Garde R6 fail-closed invariants
        shell: bash
        run: |
          set -euo pipefail
          R6='supabase/migrations/20261007231000_garde_functional_lock_r6.sql'
          EDGE='source/supabase/functions/analyze-official-roster-pdf/index.ts'

          test -f "$R6"
          test -f "$EDGE"

          grep -Fq "official_roster_import_reports" "$R6"
          grep -Fq "official_roster_guards" "$R6"
          grep -Fq "official_roster_identity_links" "$R6"
          grep -Fq "official_roster_anomalies" "$R6"
          grep -Fq "official_roster_recalculation_runs" "$R6"
          grep -Fq "admin_preview_official_roster_recalculation" "$R6"
          grep -Fq "admin_apply_official_roster_recalculation" "$R6"
          grep -Fq "set search_path = ''" "$R6"
          grep -Fq "g.date_str as date_str" "$R6"
          grep -Fq "check (duty_area = 'urgences')" "$R6"
          if grep -Fq "g.date_str::text as date_str" "$R6"; then
            echo 'ERROR: R6 preview must keep DATE typed for joins.' >&2
            exit 1
          fi
          test "$(grep -Fc 'from anon;' "$R6")" -ge 7

          AS_COUNT="$(grep -Fxc 'as $$' "$R6")"
          END_COUNT="$(grep -Fxc '$$;' "$R6")"
          test "$AS_COUNT" -gt 0
          test "$AS_COUNT" -eq "$END_COUNT"
          if grep -Fxq 'as $' "$R6" || grep -Fxq '$;' "$R6"; then
            echo 'ERROR: malformed SQL dollar-quote delimiter in R6 migration.' >&2
            exit 1
          fi

          grep -Fq "const PARSER_REVISION = 'v12.0.2-r6'" "$EDGE"
          grep -Fq "const readB = await runRead" "$EDGE"
          grep -Fq "cExecuted = true" "$EDGE"
          grep -Fq "manualResolutions" "$EDGE"
          grep -Fq "coverage_start" "$EDGE"
          grep -Fq "coverage_end" "$EDGE"
          grep -Fq "coverage_scope_mismatch" "$EDGE"
          grep -Fq "Jour du mois principal absent" "$EDGE"
          grep -Fq "document_scope" "$EDGE"
          grep -Fq "non_urgences" "$EDGE"
          grep -Fq "mixed_or_uncertain" "$EDGE"
          grep -Fq "STRICTEMENT réservé aux Urgences" "$EDGE"
          grep -Fq "const SHIFTS = new Set(['urg-jour', 'urg-nuit', 'urg-24h']);" "$EDGE"
          if grep -Eq "service-(jour|nuit|24h)" "$EDGE"; then
            echo 'ERROR: R6 official roster must remain Urgences-only.' >&2
            exit 1
          fi
          grep -Fq "Page non localisée" "$EDGE"
          grep -Fq "Zone non localisée" "$EDGE"
          grep -Fq "status = 'green'" "$EDGE"
          grep -Fq "status = 'orange'" "$EDGE"
          grep -Fq "status = 'red'" "$EDGE"
          if grep -Fq "profileContext" "$EDGE"; then
            echo 'ERROR: the visual reader must not be seeded with account/profile context.' >&2
            exit 1
          fi

          echo 'Garde R6 fail-closed static invariants verified.'

  garde-r6-db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v5

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Apply disposable R6 baseline
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/garde_r6_validation_baseline.sql

      - name: Apply real R6 migrations
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261007231000_garde_functional_lock_r6.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261008060000_garde_r6_preview_date_type_fix.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261008061500_garde_r6_rpc_anon_lockdown.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261008063000_garde_r6_fk_indexes.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261008064500_garde_r6_emergency_only_scope.sql

      - name: Run R6 integration assertions
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/garde_r6_integration_assertions.sql

