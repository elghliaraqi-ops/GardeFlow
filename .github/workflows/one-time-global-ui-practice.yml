name: One-time Practice global UI cleanup

on:
  push:
    branches:
      - feature-global-ui-refresh-20260930
    paths:
      - '.github/workflows/one-time-global-ui-practice.yml'
      - 'source/lib/theme/**'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature-global-ui-refresh-20260930

      - name: Apply Practice visual cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('source/lib/screens/practice_screen.dart')
          text = path.read_text(encoding='utf-8')

          old_colors = '''abstract final class PracticeColors {
            static const background = Color(0xFF062E20);
            static const surface = Color(0xFF0B4933);
            static const elevated = Color(0xFF116044);
            static const accent = Color(0xFF20D67A);
            static const text = Colors.white;
            static const textSecondary = Color(0xFFB8D6C9);
            static const line = Color(0xFF287154);
            static const waiting = Color(0xFFFFC857);
            static const specialist = Color(0xFF55A7FF);
            static const discharged = Color(0xFF20D67A);
            static const hospitalized = Color(0xFFFF766E);
            static const prescription = Color(0xFF8FE3B7);
          }'''.replace('          ', '')
          new_colors = '''abstract final class PracticeColors {
            static const background = Color(0xFF071F18);
            static const surface = Color(0xFF0E3025);
            static const elevated = Color(0xFF14392C);
            static const accent = Color(0xFF22D985);
            static const text = Color(0xFFF4F8F6);
            static const textSecondary = Color(0xFFB6CAC0);
            static const line = Color(0xFF1B4A38);
            static const waiting = Color(0xFFF2AD45);
            static const specialist = Color(0xFF5AA8FF);
            static const discharged = Color(0xFF2BC878);
            static const hospitalized = Color(0xFFE25A56);
            static const prescription = Color(0xFF35C3D8);
          }'''.replace('          ', '')
          if old_colors not in text:
              raise SystemExit('PracticeColors source block not found; refusing unsafe patch')
          text = text.replace(old_colors, new_colors, 1)

          text = text.replace(
              "padding: const EdgeInsets.fromLTRB(16, 18, 16, 34),",
              "padding: const EdgeInsets.fromLTRB(16, 10, 16, 34),",
              1,
          )

          old_intro = '''              const Text(
                'Practice',
                style: TextStyle(color: Colors.white, fontSize: 30, fontWeight: FontWeight.w900, letterSpacing: -0.8),
              ),
              const SizedBox(height: 4),
              const Text(
                'Gardes, cas documentés et apprentissage en un seul espace.',
                style: TextStyle(color: PracticeColors.textSecondary, fontSize: 13.5, fontWeight: FontWeight.w600),
              ),
'''
          if old_intro not in text:
              raise SystemExit('Practice duplicate intro block not found; refusing unsafe patch')
          text = text.replace(old_intro, '', 1)

          old_fab = '''      floatingActionButton: widget.guard == null
          ? null
          : FloatingActionButton.extended(
              onPressed: _newCase,
              backgroundColor: PracticeColors.accent,
              foregroundColor: PracticeColors.background,
              icon: const Icon(Icons.add_rounded),
              label: const Text('Ajouter un malade', style: TextStyle(fontWeight: FontWeight.w900)),
            ),
'''
          new_fab = '''      floatingActionButton: widget.guard == null
          ? null
          : FloatingActionButton(
              onPressed: _newCase,
              tooltip: 'Ajouter un malade',
              backgroundColor: PracticeColors.accent,
              foregroundColor: PracticeColors.background,
              child: const Icon(Icons.add_rounded, size: 28),
            ),
'''
          if old_fab not in text:
              raise SystemExit('Practice FAB block not found; refusing unsafe patch')
          text = text.replace(old_fab, new_fab, 1)

          old_sort = '''            Align(
              alignment: Alignment.centerRight,
              child: PopupMenuButton<String>(
                initialValue: _sort,
                onSelected: (value) => setState(() => _sort = value),
                color: PracticeColors.surface,
                itemBuilder: (_) => const [
                  PopupMenuItem(value: 'recent', child: Text('Plus récents')),
                  PopupMenuItem(value: 'oldest', child: Text('Plus anciens')),
                  PopupMenuItem(value: 'patient', child: Text('Patient #')),
                  PopupMenuItem(value: 'arrival', child: Text('Heure d’arrivée')),
                ],
                child: Container(
                  padding: const EdgeInsets.symmetric(horizontal: 11, vertical: 7),
                  decoration: BoxDecoration(
                    color: PracticeColors.surface,
                    borderRadius: BorderRadius.circular(12),
                    border: Border.all(color: PracticeColors.line),
                  ),
                  child: const Row(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Icon(Icons.sort_rounded, color: PracticeColors.textSecondary, size: 17),
                      SizedBox(width: 6),
                      Text('Trier', style: TextStyle(color: Colors.white, fontSize: 11, fontWeight: FontWeight.w800)),
                    ],
                  ),
                ),
              ),
            ),
            const SizedBox(height: 16),
'''
          new_sort = '''            Row(
              children: [
                Expanded(
                  child: Text(
                    'Patients · ${_visible.length}',
                    style: const TextStyle(
                      color: Colors.white,
                      fontSize: 16,
                      fontWeight: FontWeight.w900,
                    ),
                  ),
                ),
                PopupMenuButton<String>(
                  initialValue: _sort,
                  onSelected: (value) => setState(() => _sort = value),
                  color: PracticeColors.surface,
                  itemBuilder: (_) => const [
                    PopupMenuItem(value: 'recent', child: Text('Plus récents')),
                    PopupMenuItem(value: 'oldest', child: Text('Plus anciens')),
                    PopupMenuItem(value: 'patient', child: Text('Patient #')),
                    PopupMenuItem(value: 'arrival', child: Text('Heure d’arrivée')),
                  ],
                  child: Container(
                    padding: const EdgeInsets.symmetric(horizontal: 11, vertical: 7),
                    decoration: BoxDecoration(
                      color: PracticeColors.surface,
                      borderRadius: BorderRadius.circular(12),
                    ),
                    child: const Row(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Icon(Icons.sort_rounded, color: PracticeColors.textSecondary, size: 17),
                        SizedBox(width: 6),
                        Text('Trier', style: TextStyle(color: Colors.white, fontSize: 11, fontWeight: FontWeight.w800)),
                      ],
                    ),
                  ),
                ),
              ],
            ),
            const SizedBox(height: 12),
'''
          if old_sort not in text:
              raise SystemExit('Practice sort block not found; refusing unsafe patch')
          text = text.replace(old_sort, new_sort, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format source/lib/theme/app_theme.dart source/lib/theme/widgets.dart source/lib/screens/practice_screen.dart

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Analyze code
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Commit validated Practice cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/lib/theme/app_theme.dart source/lib/theme/widgets.dart source/lib/screens/practice_screen.dart
          git commit -m 'style: apply validated Practice visual cleanup'
          git push origin HEAD:feature-global-ui-refresh-20260930
