name: Generate Practice cases and QCM gaming

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/move_cases_and_game_qcm.py
      - .github/scripts/move_cases_trigger.txt

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create generated branch
        run: git switch -c generated/practice-cases-qcm-20261001

      - name: Apply requested UI/navigation changes
        run: python .github/scripts/move_cases_and_game_qcm.py

      - name: Check patch formatting
        run: git diff --check

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Analyze Flutter code
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build Flutter Web release
        working-directory: source
        run: flutter build web --release --base-href "/GardeFlow/" --build-name "12.0.0" --build-number "301"

      - name: Restore lockfile and commit validated source
        run: |
          git checkout -- source/pubspec.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            source/lib/screens/home_screen.dart \
            source/lib/screens/practice_screen.dart \
            source/lib/screens/practice_qcm_screen.dart \
            source/lib/screens/clinical_cases_section.dart \
            source/lib/screens/clinical_cases_screen.dart
          git diff --cached --check
          git commit -m "feat: déplacer les cas cliniques dans Practice et gamifier les QCM"
          git push --force-with-lease origin generated/practice-cases-qcm-20261001
