name: Move cases and game QCM

on:
  push:
    branches:
      - feat/practice-clinical-cases-gaming-qcm-20261001

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/practice-clinical-cases-gaming-qcm-20261001
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply requested UI/navigation changes
        run: python .github/scripts/move_cases_and_game_qcm.py

      - name: Check patch formatting
        run: git diff --check

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            source/lib/screens/home_screen.dart \
            source/lib/screens/practice_screen.dart \
            source/lib/screens/practice_qcm_screen.dart \
            source/lib/screens/clinical_cases_section.dart \
            source/lib/screens/clinical_cases_screen.dart
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "feat: déplacer les cas cliniques dans Practice et gamifier les QCM"
            git push origin HEAD:feat/practice-clinical-cases-gaming-qcm-20261001
          fi

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Run tests
        working-directory: source
        run: flutter test

      - name: Analyze Flutter code
        working-directory: source
        run: flutter analyze lib tool --no-fatal-infos --no-fatal-warnings

      - name: Build Flutter Web release
        working-directory: source
        run: flutter build web --release --base-href "/GardeFlow/" --build-name "12.0.0" --build-number "301"

      - name: Ensure dependency lock unchanged
        run: |
          git checkout -- source/pubspec.lock
          test -z "$(git status --porcelain --untracked-files=no)" || (git status --short && exit 1)
